<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Convocações - Motorista</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    /* Estilos específicos da página Convocações (padrão vem de padrao-telas.css) */
    /* FILTROS */
    .filtros {
      background: white;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
      border-radius: 16px;
      border: 1px solid var(--gray-200, #e9ecef);
    }
    
    .filtros-titulo {
      font-size: 13px;
      color: #666;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .filtros-buttons {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    
    .filtro-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    
    .filtro-btn.active {
      background: #0ea5e9;
      color: white;
      border-color: #0ea5e9;
    }
    
    .filtro-btn:active {
      transform: scale(0.95);
    }
    
    /* CARD (expandível) */
    .card {
      background: white;
      border-radius: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .card:active {
      transform: scale(0.98);
    }
    
    .card-header {
      background: var(--app-header-bg);
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card-title { 
      font-size: 17px; 
      font-weight: 700;
    }
    
    .badge {
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .badge-pendente { background: #ffc107; color: #000; }
    .badge-aceita { background: #28a745; color: white; }
    .badge-confirmada { background: #007bff; color: white; }
    .badge-recusada { background: #dc3545; color: white; }
    
    .card-body { 
      padding: 16px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    
    .card.expandido .card-body {
      max-height: 2000px;
      transition: max-height 0.5s ease-in;
    }
    
    /* RESUMO (quando colapsado) */
    .card-resumo {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
    }
    
    .card.expandido .card-resumo {
      display: none;
    }
    
    .resumo-info {
      flex: 1;
    }
    
    .resumo-rota {
      font-size: 14px;
      color: #333;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .resumo-detalhes {
      font-size: 12px;
      color: #666;
    }
    
    .resumo-icone {
      font-size: 24px;
      color: #0ea5e9;
    }
    
    /* ROTA */
    .route-section {
      background: #f8f9fa;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    
    .route-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }
    
    .route-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    
    .route-icon.origem { background: #28a745; color: white; }
    .route-icon.destino { background: #dc3545; color: white; }
    
    .route-label { 
      font-size: 11px; 
      color: #666; 
      font-weight: 600; 
      text-transform: uppercase; 
      margin-bottom: 4px;
    }
    .route-cidade { 
      font-size: 15px; 
      color: #333; 
      font-weight: 600;
    }
    
    /* INFO GRID */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    
    .info-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    
    .info-icon { font-size: 22px; margin-bottom: 6px; }
    .info-label { 
      font-size: 10px; 
      color: #666; 
      text-transform: uppercase; 
      font-weight: 600;
      margin-bottom: 4px;
    }
    .info-value { 
      font-size: 15px; 
      color: #333; 
      font-weight: 700;
    }
    
    /* OBSERVAÇÕES */
    .obs-box {
      margin-top: 14px;
      padding: 12px;
      background: #fffbea;
      border-left: 4px solid #ffc107;
      border-radius: 8px;
    }
    
    .obs-title {
      font-size: 11px;
      color: #856404;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    
    .obs-text {
      font-size: 13px;
      color: #333;
      line-height: 1.4;
    }
    
    /* BOTÕES */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 2px solid #f0f0f0;
    }
    
    .btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }
    
    .btn:active { transform: scale(0.96); }
    
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    
    /* LOADING/EMPTY */
    .loading, .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0ea5e9;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← <span data-i18n="common.voltar">Voltar</span></button>
    <h1><i class="bx bx-clipboard"></i></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online" data-i18n="dashboard.onlineSincronizado">Online - Sincronizado</div>
  </div>

  <div class="container">
    <div class="filtros">
      <div class="filtros-titulo" data-i18n="convocacoes.periodo">📅 Período:</div>
      <div class="filtros-buttons">
        <button class="filtro-btn" data-dias="7" onclick="filtrarPeriodo(7, this)">7 dias</button>
        <button class="filtro-btn" data-dias="15" onclick="filtrarPeriodo(15, this)">15 dias</button>
        <button class="filtro-btn active" data-dias="30" onclick="filtrarPeriodo(30, this)">30 dias</button>
        <button class="filtro-btn" data-dias="60" onclick="filtrarPeriodo(60, this)">60 dias</button>
        <button class="filtro-btn" data-dias="90" onclick="filtrarPeriodo(90, this)">90 dias</button>
        <button class="filtro-btn" data-dias="0" onclick="filtrarPeriodo(0, this)">Todos</button>
      </div>
    </div>

    <div id="convocacoesList">
      <div class="loading">
        <div class="spinner"></div>
        <p data-i18n="convocacoes.carregando">Carregando convocações...</p>
      </div>
    </div>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k) el.textContent = window.t(k);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
        var k = el.getAttribute('data-i18n-title');
        if (k) el.title = window.t(k);
      });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);

    const motorista = JSON.parse(localStorage.getItem('motorista') || '{}');
    const token = localStorage.getItem('token');
    
    if (!token) {
      window.location.href = '../index.html';
    }

    function formatarMoeda(valor, moeda) {
      return new Intl.NumberFormat('pt-BR', { 
        style: 'currency', 
        currency: (moeda && moeda.trim()) || 'BRL' 
      }).format(valor || 0);
    }

    /** Distância em km: vírgula como decimal, 2 casas (ex.: 371,97 km). */
    function formatarDistancia(valor) {
      const n = parseFloat(String(valor || 0).replace(',', '.')) || 0;
      return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    }

    /** Peso em kg: vírgula como decimal, até 2 casas (ex.: 12.345,00 kg). */
    function formatarPeso(valor) {
      const n = parseFloat(String(valor || 0).replace(',', '.')) || 0;
      return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
    }

    function formatarData(data) {
      if (!data) return '-';
      return new Date(data).toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    async function carregarConvocacoes() {
      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/convocacoes/${motorista.id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (response.ok) {
            const convocacoes = await response.json();
            convocacoesGlobal = convocacoes;
            await window.OfflineDB.salvarCache('convocacoes', convocacoes);
            filtrarPeriodo(periodoAtual);
            registrarAcessoConvocacoesNoServidor(convocacoes);
            return;
          }
        }

        const convocacoes = await window.OfflineDB.buscarCache('convocacoes');
        convocacoesGlobal = convocacoes || [];
        filtrarPeriodo(periodoAtual);
        
        if (!window.OfflineDB.isOnline()) {
          mostrarToast('Offline - Mostrando dados salvos', 'warning');
        }
      } catch (err) {
        console.error('Erro:', err);
        try {
          const convocacoes = await window.OfflineDB.buscarCache('convocacoes');
          convocacoesGlobal = convocacoes || [];
          filtrarPeriodo(periodoAtual);
        } catch {
          document.getElementById('convocacoesList').innerHTML = 
            '<div class="empty">❌ Erro ao carregar</div>';
        }
      }
    }

    let convocacoesGlobal = [];
    let periodoAtual = 30;

    /** Registra no servidor que o motorista acessou as convocações (para aparecer "Acessou" na web). */
    function registrarAcessoConvocacoesNoServidor(convocacoes) {
      if (!convocacoes || convocacoes.length === 0 || !window.OfflineDB.isOnline()) return;
      var idConvocacoesSemAcesso = [];
      for (var i = 0; i < convocacoes.length; i++) {
        var c = convocacoes[i];
        var id = c.IDCONVOCACAO != null ? c.IDCONVOCACAO : c.idconvocacao;
        var jaAcessou = (c.DHACESSO != null) || (c.dhacesso != null);
        if (id && !jaAcessou) idConvocacoesSemAcesso.push(id);
      }
      if (idConvocacoesSemAcesso.length === 0) return;
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          idConvocacoesSemAcesso.forEach(function(id) {
            fetch('/api/public/convocacao/' + id + '/acesso', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ latitude: lat, longitude: lng })
            }).catch(function() {});
          });
        },
        function() {
          idConvocacoesSemAcesso.forEach(function(id) {
            fetch('/api/public/convocacao/' + id + '/acesso', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({})
            }).catch(function() {});
          });
        },
        { timeout: 3000 }
      );
    }

    function filtrarPeriodo(dias, elemento) {
      periodoAtual = dias;
      
      // Atualizar botões ativos
      document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('active'));
      if (elemento) {
        elemento.classList.add('active');
      } else {
        // Se não passou elemento, marcar o botão correspondente
        const botoes = document.querySelectorAll('.filtro-btn');
        botoes.forEach(btn => {
          if (btn.getAttribute('data-dias') == dias) {
            btn.classList.add('active');
          }
        });
      }
      
      // Filtrar convocações
      let filtradas = convocacoesGlobal;
      
      if (dias > 0) {
        const dataLimite = new Date();
        dataLimite.setDate(dataLimite.getDate() - dias);
        
        filtradas = convocacoesGlobal.filter(c => {
          const dataConv = new Date(c.DHCONVOCACAO);
          return dataConv >= dataLimite;
        });
      }
      
      renderizar(filtradas);
    }

    function toggleCard(event, idConvocacao) {
      // Prevenir propagação se clicou em botão
      if (event.target.tagName === 'BUTTON') {
        return;
      }
      
      const card = document.getElementById(`card-${idConvocacao}`);
      
      if (card) {
        const jaExpandido = card.classList.contains('expandido');
        
        // Fechar TODOS os cards primeiro
        document.querySelectorAll('.card').forEach(c => {
          c.classList.remove('expandido');
        });
        
        // Se NÃO estava expandido, abrir este
        if (!jaExpandido) {
          card.classList.add('expandido');
        }
      }
    }

    function renderizar(convocacoes) {
      const lista = document.getElementById('convocacoesList');
      
      if (!convocacoes || convocacoes.length === 0) {
        lista.innerHTML = '<div class="empty">📭 ' + (typeof window.t === 'function' ? window.t('convocacoes.semConvocacoes') : 'Nenhuma convocação no período') + '</div>';
        return;
      }

      lista.innerHTML = convocacoes.map(c => {
        const badgeClass = `badge-${c.STATUS.toLowerCase()}`;
        const statusTexto = {
          'PENDENTE': 'Pendente',
          'ACEITA': 'Aceita',
          'CONFIRMADA': 'Confirmada',
          'RECUSADA': 'Recusada'
        }[c.STATUS] || c.STATUS;

        const origemCidade = c.ORIGEM_CIDADE != null ? c.ORIGEM_CIDADE : c.origem_cidade;
        const origemEstado = c.ORIGEM_ESTADO != null ? c.ORIGEM_ESTADO : c.origem_estado;
        const destinoCidade = c.DESTINO_CIDADE != null ? c.DESTINO_CIDADE : c.destino_cidade;
        const destinoEstado = c.DESTINO_ESTADO != null ? c.DESTINO_ESTADO : c.destino_estado;
        const dsRoteiro = String((c.DSROTEIRO != null ? c.DSROTEIRO : c.dsroteiro) || '').trim();
        const origem = origemCidade && origemEstado
          ? (origemCidade + ' - ' + origemEstado)
          : (dsRoteiro ? (dsRoteiro.split(/\s*->\s*|\s*→\s*/)[0] || dsRoteiro).trim() : 'Não informado');
        const destino = destinoCidade && destinoEstado
          ? (destinoCidade + ' - ' + destinoEstado)
          : (dsRoteiro ? ((dsRoteiro.split(/\s*->\s*|\s*→\s*/)[1] || '').trim() || 'Não informado') : 'Não informado');

        const podeAceitar = c.STATUS === 'PENDENTE';

        return `
          <div class="card" id="card-${c.IDCONVOCACAO}" onclick="toggleCard(event, ${c.IDCONVOCACAO})">
            <div class="card-header">
              <div class="card-title">🚚 Viagem #${c.IDVIAGEM}</div>
              <span class="badge ${badgeClass}">${statusTexto}</span>
            </div>

            <div class="card-resumo">
              <div class="resumo-info">
                <div class="resumo-rota">📍 ${origem} → 🎯 ${destino}</div>
                <div class="resumo-detalhes">
                  ${formatarDistancia(c.DISTANCIAKM)} km • ${formatarMoeda(c.VLFRETE, c.MOEDA)} • ${formatarData(c.DTPREVINICIO)}
                </div>
              </div>
              <div class="resumo-icone">▼</div>
            </div>

            <div class="card-body">
              <div class="route-section">
                <div class="route-item">
                  <div class="route-icon origem">📍</div>
                  <div>
                    <div class="route-label">Origem</div>
                    <div class="route-cidade">${origem}</div>
                  </div>
                </div>

                <div class="route-item">
                  <div class="route-icon destino">🎯</div>
                  <div>
                    <div class="route-label">Destino</div>
                    <div class="route-cidade">${destino}</div>
                  </div>
                </div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <div class="info-icon">📏</div>
                  <div class="info-label">Distância</div>
                  <div class="info-value">${formatarDistancia(c.DISTANCIAKM)} km</div>
                </div>

                <div class="info-item">
                  <div class="info-icon">💰</div>
                  <div class="info-label">Frete</div>
                  <div class="info-value">${formatarMoeda(c.VLFRETE, c.MOEDA)}</div>
                </div>

                <div class="info-item">
                  <div class="info-icon">📦</div>
                  <div class="info-label">Peso</div>
                  <div class="info-value">${formatarPeso(c.PESO)} kg</div>
                </div>

                <div class="info-item">
                  <div class="info-icon">📅</div>
                  <div class="info-label">Início</div>
                  <div class="info-value">${formatarData(c.DTPREVINICIO)}</div>
                </div>
              </div>

              ${c.OBSERV ? `
                <div class="obs-box">
                  <div class="obs-title">Observações</div>
                  <div class="obs-text">${c.OBSERV.substring(0, 150)}${c.OBSERV.length > 150 ? '...' : ''}</div>
                </div>
              ` : ''}

              ${podeAceitar ? `
                <div class="buttons">
                  <button class="btn btn-success" onclick="aceitar(${c.IDCONVOCACAO}, ${c.IDVIAGEM})">
                    ✓ Aceitar
                  </button>
                  <button class="btn btn-danger" onclick="recusar(${c.IDCONVOCACAO})">
                    ✗ Recusar
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function aceitar(idConvocacao, idViagem) {
      const resposta = await mostrarModal(
        '✅ Aceitar Viagem',
        'Deseja aceitar esta convocação?',
        ['Cancelar', 'Aceitar']
      );
      
      if (resposta !== 'Aceitar') return;

      let latitude = null, longitude = null;

      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
        });
        latitude = pos.coords.latitude;
        longitude = pos.coords.longitude;
      } catch (err) {
        console.log('GPS não disponível');
      }

      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/aceitar-convocacao/${idConvocacao}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ latitude, longitude })
          });

          if (response.ok) {
            mostrarToast('Convocação aceita com sucesso!', 'success');
            carregarConvocacoes();
          } else {
            mostrarToast('Erro ao aceitar convocação', 'error');
          }
        } else {
          await window.OfflineDB.adicionarFila('filaAcoes', {
            tipo: 'aceitar',
            url: `/api/motorista/aceitar-convocacao/${idConvocacao}`,
            method: 'POST',
            data: { latitude, longitude }
          });

          mostrarToast('Salvo! Será enviado quando houver conexão', 'warning');
          
          const convocacoes = await window.OfflineDB.buscarCache('convocacoes');
          const conv = convocacoes.find(c => c.IDCONVOCACAO === idConvocacao);
          if (conv) {
            conv.STATUS = 'ACEITA';
            await window.OfflineDB.salvarCache('convocacoes', convocacoes);
            renderizar(convocacoes);
          }
        }

        await window.OfflineDB.atualizarIndicador();
      } catch (err) {
        mostrarToast('Erro ao aceitar convocação', 'error');
      }
    }

    async function recusar(idConvocacao) {
      const resposta = await mostrarModal(
        '❌ Recusar Viagem',
        'Deseja recusar esta convocação?',
        ['Cancelar', 'Recusar']
      );
      
      if (resposta !== 'Recusar') return;

      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/recusar-convocacao/${idConvocacao}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            }
          });

          if (response.ok) {
            mostrarToast('Convocação recusada', 'success');
            carregarConvocacoes();
          }
        } else {
          await window.OfflineDB.adicionarFila('filaAcoes', {
            tipo: 'recusar',
            url: `/api/motorista/recusar-convocacao/${idConvocacao}`,
            method: 'POST',
            data: {}
          });

          mostrarToast('Salvo! Será enviado quando houver conexão', 'warning');
        }

        await window.OfflineDB.atualizarIndicador();
      } catch (err) {
        mostrarToast('Erro ao recusar convocação', 'error');
      }
    }

    function voltar() {
      window.location.href = 'dashboard.html';
    }

    carregarConvocacoes();
  </script>
</body>
</html>
