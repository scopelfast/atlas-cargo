<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Convocações - Motorista</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #f0f2f5; padding: 0; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    
    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 15px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      box-sizing: border-box;
    }
    
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .navbar h1 { 
      font-size: 18px; 
      margin: 0; 
      font-weight: 600; 
      flex: 1;
    }
    
    .btn-voltar { 
      background: rgba(255,255,255,0.25); 
      border: none; 
      color: white; 
      padding: 8px 16px; 
      border-radius: 20px; 
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-voltar:active { 
      background: rgba(255,255,255,0.4); 
      transform: scale(0.95); 
    }
    
    #statusIndicador {
      padding: 12px 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      width: 100%;
      box-sizing: border-box;
      display: block;
    }
    
    .status-online { 
      background: #d4edda; 
      color: #155724;
      border-bottom: 2px solid #c3e6cb;
    }
    .status-offline { 
      background: #f8d7da; 
      color: #721c24;
      border-bottom: 2px solid #f5c6cb;
    }
    .status-syncing { 
      background: #fff3cd; 
      color: #856404;
      border-bottom: 2px solid #ffeeba;
    }
    
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 0;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #e8e8e8;
    }
    
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card-title { 
      font-size: 18px; 
      font-weight: 700; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge-pendente { background: #ffc107; color: #000; }
    .badge-aceita { background: #28a745; color: white; }
    .badge-confirmada { background: #007bff; color: white; }
    .badge-recusada { background: #dc3545; color: white; }
    
    .card-body {
      padding: 16px;
    }
    
    .route-section {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .route-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 12px 0;
      position: relative;
    }
    
    .route-item:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 18px;
      top: 32px;
      width: 2px;
      height: calc(100% + 12px);
      background: #ddd;
      z-index: 0;
    }
    
    .route-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      z-index: 1;
      position: relative;
    }
    
    .route-icon.origem { background: #28a745; color: white; }
    .route-icon.destino { background: #dc3545; color: white; }
    
    .route-text { flex: 1; }
    .route-label { font-size: 12px; color: #666; font-weight: 500; text-transform: uppercase; }
    .route-cidade { font-size: 16px; color: #333; font-weight: 600; margin-top: 4px; }
    
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    
    .info-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    
    .info-icon { font-size: 24px; margin-bottom: 6px; }
    .info-label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: 600; }
    .info-value { font-size: 16px; color: #333; font-weight: 700; margin-top: 4px; }
    
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 2px solid #f0f0f0;
    }
    
    .btn {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn:active { transform: scale(0.96); }
    
    .btn-success { background: #28a745; color: white; box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3); }
    .btn-danger { background: #dc3545; color: white; box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3); }
    .btn-info { background: #17a2b8; color: white; box-shadow: 0 4px 12px rgba(23, 162, 184, 0.3); }
    
    .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="navbar-left">
      <button class="btn-voltar" onclick="voltar()">← Voltar</button>
    </div>
    <h1>📦 Minhas Convocações</h1>
    <div style="width: 90px;"></div>
  </div>

  <div id="statusIndicador" class="status-offline">
    🔴 Carregando...
  </div>

  <div class="container">
    <div id="convocacoesList">
      <div class="loading">
        <p>Carregando convocações...</p>
      </div>
    </div>
  </div>

  <script src="../js/offline.js"></script>
  <script>
    const motorista = JSON.parse(localStorage.getItem('motorista') || '{}');
    const token = localStorage.getItem('token');
    
    if (!token) {
      window.location.href = '../index.html';
    }

    // Formatar moeda
    function formatarMoeda(valor) {
      return new Intl.NumberFormat('pt-BR', { 
        style: 'currency', 
        currency: 'BRL' 
      }).format(valor || 0);
    }

    // Formatar data
    function formatarData(data) {
      if (!data) return '-';
      return new Date(data).toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Carregar convocações
    async function carregarConvocacoes() {
      try {
        // Tentar buscar do servidor
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/convocacoes/${motorista.id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (response.ok) {
            const convocacoes = await response.json();
            
            // Salvar no cache
            await window.OfflineDB.salvarCache('convocacoes', convocacoes);
            
            renderizar(convocacoes);
            return;
          }
        }

        // Se offline ou erro, buscar do cache
        const convocacoes = await window.OfflineDB.buscarCache('convocacoes');
        renderizar(convocacoes);
        
        if (!window.OfflineDB.isOnline()) {
          alert('📴 Offline - Mostrando dados salvos');
        }
      } catch (err) {
        console.error('Erro ao carregar convocações:', err);
        
        // Tentar cache
        try {
          const convocacoes = await window.OfflineDB.buscarCache('convocacoes');
          renderizar(convocacoes);
          alert('📴 Sem conexão - Mostrando dados salvos');
        } catch (cacheErr) {
          document.getElementById('convocacoesList').innerHTML = 
            '<div class="empty">Erro ao carregar convocações</div>';
        }
      }
    }

    // Renderizar lista
    function renderizar(convocacoes) {
      const lista = document.getElementById('convocacoesList');
      
      if (!convocacoes || convocacoes.length === 0) {
        lista.innerHTML = '<div class="empty">📭 Nenhuma convocação encontrada</div>';
        return;
      }

      lista.innerHTML = convocacoes.map(c => {
        const badgeClass = `badge-${c.STATUS.toLowerCase()}`;
        const statusTexto = {
          'PENDENTE': 'Pendente',
          'ACEITA': 'Aceita',
          'CONFIRMADA': 'Confirmada',
          'RECUSADA': 'Recusada',
          'ACEITA_DESCARTADA': 'Descartada'
        }[c.STATUS] || c.STATUS;

        const podeAceitar = c.STATUS === 'PENDENTE';

        const origem = c.ORIGEM_CIDADE && c.ORIGEM_ESTADO 
          ? `${c.ORIGEM_CIDADE} - ${c.ORIGEM_ESTADO}` 
          : (c.DSROTEIRO ? c.DSROTEIRO.split(' → ')[0] : 'Não informado');
        
        const destino = c.DESTINO_CIDADE && c.DESTINO_ESTADO 
          ? `${c.DESTINO_CIDADE} - ${c.DESTINO_ESTADO}` 
          : (c.DSROTEIRO ? c.DSROTEIRO.split(' → ')[1] || 'Não informado' : 'Não informado');

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                🚚 Viagem #${c.IDVIAGEM}
              </div>
              <span class="badge ${badgeClass}">${statusTexto}</span>
            </div>

            <div class="card-body">
              <div class="route-section">
                <div class="route-item">
                  <div class="route-icon origem">📍</div>
                  <div class="route-text">
                    <div class="route-label">Origem</div>
                    <div class="route-cidade">${origem}</div>
                  </div>
                </div>

                <div class="route-item">
                  <div class="route-icon destino">🎯</div>
                  <div class="route-text">
                    <div class="route-label">Destino</div>
                    <div class="route-cidade">${destino}</div>
                  </div>
                </div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <div class="info-icon">📏</div>
                  <div class="info-label">Distância</div>
                  <div class="info-value">${(c.DISTANCIAKM || 0).toLocaleString('pt-BR')} km</div>
                </div>

                <div class="info-item">
                  <div class="info-icon">💰</div>
                  <div class="info-label">Frete</div>
                  <div class="info-value">${formatarMoeda(c.VLFRETE)}</div>
                </div>

                <div class="info-item">
                  <div class="info-icon">📦</div>
                  <div class="info-label">Peso</div>
                  <div class="info-value">${(c.PESO || 0).toLocaleString('pt-BR', {maximumFractionDigits: 0})} kg</div>
                </div>

                <div class="info-item">
                  <div class="info-icon">📅</div>
                  <div class="info-label">Início</div>
                  <div class="info-value">${formatarData(c.DTPREVINICIO).split(',')[0]}</div>
                </div>
              </div>

              ${c.OBSERV ? `
                <div style="margin-top: 16px; padding: 12px; background: #fffbea; border-left: 4px solid #ffc107; border-radius: 8px;">
                  <div style="font-size: 11px; color: #856404; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Observações</div>
                  <div style="font-size: 13px; color: #333;">${c.OBSERV.substring(0, 100)}${c.OBSERV.length > 100 ? '...' : ''}</div>
                </div>
              ` : ''}

              ${podeAceitar ? `
                <div class="buttons">
                  <button class="btn btn-success" onclick="aceitar(${c.IDCONVOCACAO}, ${c.IDVIAGEM})">
                    ✓ Aceitar
                  </button>
                  <button class="btn btn-danger" onclick="recusar(${c.IDCONVOCACAO})">
                    ✗ Recusar
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Aceitar convocação
    async function aceitar(idConvocacao, idViagem) {
      if (!confirm('Deseja aceitar esta viagem?')) return;

      // Capturar GPS se possível
      let latitude = null;
      let longitude = null;

      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
        });
        latitude = pos.coords.latitude;
        longitude = pos.coords.longitude;
      } catch (err) {
        console.log('GPS não disponível');
      }

      const dados = { latitude, longitude };

      try {
        if (window.OfflineDB.isOnline()) {
          // Online: enviar direto
          const response = await fetch(`/api/motorista/aceitar-convocacao/${idConvocacao}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(dados)
          });

          if (response.ok) {
            alert('✅ Convocação aceita com sucesso!');
            carregarConvocacoes();
          } else {
            alert('Erro ao aceitar convocação');
          }
        } else {
          // Offline: adicionar à fila
          await window.OfflineDB.adicionarFila('filaAcoes', {
            tipo: 'aceitar',
            url: `/api/motorista/aceitar-convocacao/${idConvocacao}`,
            method: 'POST',
            data: dados
          });

          alert('📴 Offline - Será enviado quando voltar online');
          
          // Atualizar cache local
          const convocacoes = await window.OfflineDB.buscarCache('convocacoes');
          const convocacao = convocacoes.find(c => c.IDCONVOCACAO === idConvocacao);
          if (convocacao) {
            convocacao.STATUS = 'ACEITA';
            convocacao.DHRESPOSTA = new Date().toISOString();
            await window.OfflineDB.salvarCache('convocacoes', convocacoes);
            renderizar(convocacoes);
          }
        }

        await window.OfflineDB.atualizarIndicador();
      } catch (err) {
        console.error('Erro ao aceitar:', err);
        alert('Erro ao aceitar convocação');
      }
    }

    // Recusar convocação
    async function recusar(idConvocacao) {
      if (!confirm('Deseja recusar esta viagem?')) return;

      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/recusar-convocacao/${idConvocacao}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            }
          });

          if (response.ok) {
            alert('Convocação recusada');
            carregarConvocacoes();
          }
        } else {
          // Offline: adicionar à fila
          await window.OfflineDB.adicionarFila('filaAcoes', {
            tipo: 'recusar',
            url: `/api/motorista/recusar-convocacao/${idConvocacao}`,
            method: 'POST',
            data: {}
          });

          alert('📴 Offline - Será enviado quando voltar online');
        }

        await window.OfflineDB.atualizarIndicador();
      } catch (err) {
        console.error('Erro ao recusar:', err);
        alert('Erro ao recusar convocação');
      }
    }

    // Voltar
    function voltar() {
      window.location.href = 'dashboard.html';
    }

    // Carregar ao iniciar
    carregarConvocacoes();
  </script>
</body>
</html>
