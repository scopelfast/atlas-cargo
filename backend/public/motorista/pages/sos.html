<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS - Emergência</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    .sos-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    .sos-warning {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 8px 24px rgba(231, 76, 60, 0.4);
    }

    .sos-warning h1,
    .sos-warning p,
    .sos-warning strong {
      color: #fff;
    }

    .sos-warning h1 {
      font-size: 48px;
      margin: 0 0 10px 0;
    }

    .sos-warning p {
      font-size: 16px;
      margin: 0;
      opacity: 0.95;
    }

    .sos-button {
      width: 100%;
      padding: 24px;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(231, 76, 60, 0.4);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .sos-button:active {
      transform: scale(0.98);
    }

    .sos-button.press-and-hold {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(231, 76, 60, 0.4); }
      50% { box-shadow: 0 8px 32px rgba(231, 76, 60, 0.7); }
    }

    .sos-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: white;
      transition: width 0.1s linear;
      border-radius: 0 0 20px 20px;
    }

    .message-input {
      width: 100%;
      padding: 15px;
      border: 2px solid #dee2e6;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 20px;
      font-family: inherit;
    }

    .info-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border-left: 4px solid #0ea5e9;
    }

    .info-box h3 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 16px;
    }

    .info-box p {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }

    .status-message {
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-message.show {
      display: block;
    }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← <span data-i18n="common.voltar">Voltar</span></button>
    <h1><i class="bx bx-error-circle"></i></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online" data-i18n="dashboard.onlineSincronizado">Online - Sincronizado</div>
  </div>

  <div class="container">
    <div class="sos-container">
      <div class="sos-warning">
        <p><strong data-i18n="sos.titulo">SOS</strong></p>
        <p data-i18n="sos.descricao">Envie um alerta de emergência para a central</p>
      </div>

      <div id="statusMessage" class="status-message"></div>

      <button 
        id="btnSOS" 
        class="sos-button"
        ontouchstart="iniciarSOS()"
        ontouchend="cancelarSOS()"
        onmousedown="iniciarSOS()"
        onmouseup="cancelarSOS()"
        onmouseleave="cancelarSOS()"
      >
        <span data-i18n="sos.enviar">Enviar alerta SOS</span>
        <div id="progressBar" class="sos-progress" style="width: 0%;"></div>
      </button>

      <div class="info-box">
        <h3>📝 Mensagem (Opcional)</h3>
        <input 
          type="text" 
          id="inputMensagem" 
          class="message-input" 
          placeholder="Descreva brevemente a emergência..."
          maxlength="500"
        >
      </div>

      <div class="info-box">
        <h3>ℹ️ Informações</h3>
        <p><strong>ID Viagem:</strong> <span id="viagemId">-</span></p>
        <p><strong>Localização:</strong> <span id="localizacao">Obtendo GPS...</span></p>
        <p><strong>Status:</strong> <span id="statusConexao">Online</span></p>
      </div>
    </div>
  </div>

  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) { var k = el.getAttribute('data-i18n'); if (k) el.textContent = window.t(k); });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el) { var k = el.getAttribute('data-i18n-title'); if (k) el.title = window.t(k); });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);
  </script>
  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/notifications-service.js"></script>
  <script src="js/sos.js"></script>
</body>
</html>
