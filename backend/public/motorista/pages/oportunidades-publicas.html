<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Oportunidades de Carga — Atlas Cargo</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('temaPadraoClaro') !== '1') {
          localStorage.setItem('tema', 'claro');
          localStorage.setItem('temaPadraoClaro', '1');
        }
        var t = localStorage.getItem('tema');
        if (t == null || t === '' || t === 'auto') t = 'claro';
        var dark = t === 'escuro';
        document.documentElement.classList.toggle('tema-escuro', !!dark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.classList.remove('tema-escuro');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body.motorista-oport-public-page {
      min-height: 100vh;
      margin: 0;
      background: #faf9f6 !important;
      color: #1c1a16;
      font-family: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    html[data-theme="dark"] body.motorista-oport-public-page,
    html.tema-escuro body.motorista-oport-public-page {
      background: #161510 !important;
      color: #f5f4ef;
    }

    body.motorista-oport-public-page .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 0;
    }

    .oport-folha {
      background: #fff;
      border: 1px solid #e7e3da;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    html[data-theme="dark"] .oport-folha,
    html.tema-escuro .oport-folha {
      background: #1d1c17;
      border-color: #33312a;
    }

    .oport-marca {

      text-align: center;
      padding: 28px 24px 18px;
      border-bottom: 1px solid #e7e3da;
    }

    html.tema-escuro .oport-marca {

    .oport-marca .marca span { color: #5d594f; font-size: 13px; font-weight: 700; }
    html[data-theme="dark"] .oport-marca .marca strong,
    html.tema-escuro .oport-marca .marca strong { color: #f5f4ef; }
    html[data-theme="dark"] .oport-marca .marca,
    html[data-theme="dark"] .oport-marca .marca span,
    html.tema-escuro .oport-marca .marca,

      color: var(--app-text);

    .oport-pub-feedback.oport-pub-feedback-ok {

    .oport-pub-feedback.oport-pub-feedback-no {

    .oport-pub-feedback.oport-pub-feedback-lock {

    html[data-theme="dark"] .oport-pub-feedback.oport-pub-feedback-ok {

    .oport-pub-botoes button:disabled {

    .oport-toast {

      border-color: var(--app-card-border);

  <div id="oportToast" class="oport-toast" role="status" aria-live="polite"></div>

  <script src="../js/url-helper.js?v=20261125claro"></script>
  <script src="../js/i18n.js"></script>
  <script>
    (function () {
      function baseUrl() {
        var o = window.location.origin || '';
        return o.replace(/\/$/, '');
      }

      function aplicarIdentidade(logoRetangular) {
        var img = document.getElementById('logoImgOport');
        var marca = document.getElementById('marcaAtlasOport');
        var nome = String(logoRetangular || '').replace(/[^a-zA-Z0-9._-]/g, '');
        var padrao = !nome || nome === 'logoAtlasTransparente.png' || nome === 'logo-atlas.svg' || nome === 'logo-atlas-simbolo.svg';
        if (padrao) {
          if (img) img.hidden = true;
          if (marca) marca.hidden = false;
          return;
        }
        if (!img) return;
        img.hidden = false;
        if (marca) marca.hidden = true;
        img.src = baseUrl() + '/img/' + nome;
        img.onerror = function () {
          img.onerror = null;
          img.hidden = true;
          if (marca) marca.hidden = false;
        };
      }

      fetch(baseUrl() + '/api/configuracoes/identidade')
        .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
        .then(function (data) {
          aplicarIdentidade(data.logoRetangular);
        })
        .catch(function () {
          aplicarIdentidade('');
        });

      function getToken() {
        var p = new URLSearchParams(window.location.search);
        return p.get('t') || '';
      }

      function setAvatarInicial(nome) {
        var el = document.getElementById('avatarOport');
        if (!el) return;
        var t = (nome || '').trim();
        el.textContent = t ? t.charAt(0).toUpperCase() : '?';
      }

      function showToast(text, kind) {
        var toastEl = document.getElementById('oportToast');
        if (!toastEl) {
          window.alert(text);
          return;
        }
        toastEl.textContent = text;
        toastEl.className = 'oport-toast' + (kind === 'err' ? ' oport-toast-err' : kind === 'info' ? ' oport-toast-info' : '');
        toastEl.style.display = 'block';
        clearTimeout(showToast._tm);
        showToast._tm = setTimeout(function () {
          toastEl.style.display = 'none';
        }, kind === 'info' ? 5200 : 4800);
      }

      function t(key) {
        return typeof window.t === 'function' ? window.t(key) : key;
      }

      function tpl(key, map) {
        var s = t(key);
        if (!map) return s;
        Object.keys(map).forEach(function (k) {
          s = s.split('{' + k + '}').join(String(map[k]));
        });
        return s;
      }

      function localeFmt() {
        return document.documentElement.getAttribute('lang') === 'es' ? 'es-PY' : 'pt-BR';
      }

      function estadoManifestacaoDb(st) {
        var u = String(st || '').toUpperCase().trim();
        if (!u || u === 'PENDENTE') return 'ABERTO';
        if (u === 'ACEITA') return 'ACEITA';
        if (u === 'RECUSADA') return 'RECUSADA';
        if (u === 'CONFIRMADA') return 'CONFIRMADA';
        if (u === 'ACEITA_DESCARTADA') return 'ENCERRADA';
        return 'ABERTO';
      }

      function aplicarEstadoCard(card, statusDb) {
        var estado = estadoManifestacaoDb(statusDb);
        card._manifestacaoStatus = statusDb || null;
        var fb = card.querySelector('.oport-pub-feedback');
        var wrap = card.querySelector('.oport-pub-botoes');
        if (!fb || !wrap) return;
        var bInt = wrap.querySelector('button[data-acao="interesse"]');
        var bRec = wrap.querySelector('button[data-acao="recusa"]');
        fb.classList.remove('oport-pub-feedback-ok', 'oport-pub-feedback-no', 'oport-pub-feedback-lock');
        if (estado === 'ABERTO') {
          fb.style.display = 'none';
          fb.textContent = '';
          if (bInt) { bInt.disabled = false; bInt.removeAttribute('aria-disabled'); }
          if (bRec) { bRec.disabled = false; bRec.removeAttribute('aria-disabled'); }
        } else {
          fb.style.display = 'block';
          if (estado === 'ACEITA') {
            fb.textContent = t('oportunidadesPublicas.feedbackInteresse');
            fb.classList.add('oport-pub-feedback-ok');
            if (bInt) { bInt.disabled = false; bInt.removeAttribute('aria-disabled'); }
            if (bRec) { bRec.disabled = false; bRec.removeAttribute('aria-disabled'); }
          } else if (estado === 'RECUSADA') {
            fb.textContent = t('oportunidadesPublicas.feedbackRecusa');
            fb.classList.add('oport-pub-feedback-no');
            if (bInt) { bInt.disabled = false; bInt.removeAttribute('aria-disabled'); }
            if (bRec) { bRec.disabled = true; bRec.setAttribute('aria-disabled', 'true'); }
          } else if (estado === 'CONFIRMADA') {
            fb.textContent = t('oportunidadesPublicas.feedbackConfirmada');
            fb.classList.add('oport-pub-feedback-lock');
            if (bInt) { bInt.disabled = true; bInt.setAttribute('aria-disabled', 'true'); }
            if (bRec) { bRec.disabled = true; bRec.setAttribute('aria-disabled', 'true'); }
          } else if (estado === 'ENCERRADA') {
            fb.textContent = t('oportunidadesPublicas.feedbackEncerrada');
            fb.classList.add('oport-pub-feedback-lock');
            if (bInt) { bInt.disabled = true; bInt.setAttribute('aria-disabled', 'true'); }
            if (bRec) { bRec.disabled = true; bRec.setAttribute('aria-disabled', 'true'); }
          }
        }
        if (bInt) {
          bInt.textContent =
            estado === 'ACEITA'
              ? t('oportunidadesPublicas.btnAtualizarLocalizacao')
              : t('oportunidadesPublicas.btnInteresse');
        }
        if (bRec) bRec.textContent = t('oportunidadesPublicas.btnNaoInteresse');
      }

      function obterGeolocalizacaoInteresse() {
        return new Promise(function (resolve, reject) {
          if (!navigator.geolocation) {
            reject(new Error(t('oportunidadesPublicas.geoNaoSuportado')));
            return;
          }
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              resolve({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
              });
            },
            function (err) {
              var code = err && err.code;
              var msg = t('oportunidadesPublicas.geoErroGenerico');
              if (code === 1) msg = t('oportunidadesPublicas.geoNegado');
              else if (code === 2) msg = t('oportunidadesPublicas.geoIndisponivel');
              else if (code === 3) msg = t('oportunidadesPublicas.geoTimeout');
              reject(new Error(msg));
            },
            { enableHighAccuracy: true, timeout: 22000, maximumAge: 0 }
          );
        });
      }

      async function postInteresse(token, idViagem, acao, card, btn) {
        var prevSt = card._manifestacaoStatus;
        var wrap = card.querySelector('.oport-pub-botoes');
        var botoes = wrap ? wrap.querySelectorAll('button') : [];
        botoes.forEach(function (b) { b.disabled = true; });
        if (btn) btn.textContent = t('oportunidadesPublicas.enviando');
        try {
          var payload = { idViagem: idViagem, acao: acao };
          if (acao !== 'RECUSA') {
            try {
              var geo = await obterGeolocalizacaoInteresse();
              payload.latitude = geo.lat;
              payload.longitude = geo.lng;
            } catch (geoErr) {
              showToast(geoErr.message || t('oportunidadesPublicas.geoErroGenerico'), 'err');
              aplicarEstadoCard(card, prevSt);
              return;
            }
          }
          var r = await fetch('/api/oportunidades-publicas/' + encodeURIComponent(token) + '/interesse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          var d = await r.json().catch(function () { return {}; });
          if (!r.ok) {
            showToast(d.error || t('oportunidadesPublicas.toastFalhaEnvio'), 'err');
            if (r.status === 409 && d.statusAtual) aplicarEstadoCard(card, d.statusAtual);
            else aplicarEstadoCard(card, prevSt);
            return;
          }
          if (d.warning && d.warning.message) {
            showToast(d.warning.message, 'info');
          }
          if (d.unchanged) {
            if (d.localizacaoAtualizada) {
              showToast(t('oportunidadesPublicas.toastLocalAtualizada'), 'ok');
            } else {
              var jaMsg =
                String(d.status || '').toUpperCase() === 'RECUSADA'
                  ? t('oportunidadesPublicas.toastJaRecusa')
                  : t('oportunidadesPublicas.toastJaInteresse');
              showToast(jaMsg, 'info');
            }
            aplicarEstadoCard(card, d.status || prevSt);
          } else {
            var okMsg =
              acao === 'RECUSA'
                ? tpl('oportunidadesPublicas.toastRecusaViagem', { id: idViagem })
                : tpl('oportunidadesPublicas.toastInteresseViagem', { id: idViagem });
            showToast(okMsg, 'ok');
            aplicarEstadoCard(card, d.status || (acao === 'RECUSA' ? 'RECUSADA' : 'ACEITA'));
          }
        } catch (e) {
          showToast(e.message || t('oportunidadesPublicas.toastErroAcao'), 'err');
          aplicarEstadoCard(card, prevSt);
        } finally {
          aplicarEstadoCard(card, card._manifestacaoStatus);
        }
      }

      function applyStaticUi() {
        document.title = t('oportunidadesPublicas.tituloPagina');
        var logo = document.getElementById('logoImgOport');
        if (logo) logo.setAttribute('alt', t('oportunidadesPublicas.logoAlt'));
        var elBm = document.getElementById('oportPubBadgeMotorista');
        if (elBm) elBm.textContent = t('oportunidadesPublicas.badgeMotorista');
        var elBo = document.getElementById('oportPubBadgeOport');
        if (elBo) elBo.textContent = t('oportunidadesPublicas.badgeOportunidades');
        var nomeEl = document.getElementById('nomeOport');
        if (nomeEl) nomeEl.textContent = t('oportunidadesPublicas.carregandoNome');
        var cpfEl = document.getElementById('cpfOport');
        if (cpfEl) {
          cpfEl.textContent = t('oportunidadesPublicas.docPadrao') + t('oportunidadesPublicas.docSeparador') + t('oportunidadesPublicas.docVazio');
        }
        var st = document.getElementById('oportPubStatus');
        if (st) st.textContent = t('oportunidadesPublicas.statusRodapePublica');
        var ver = document.getElementById('oportPubVersao');
        if (ver) ver.textContent = t('footer.versao');
        var tit = document.getElementById('oportPubTituloLista');
        if (tit) {
          tit.innerHTML = '<i class="bx bx-package" aria-hidden="true"></i> ' + t('oportunidadesPublicas.tituloLista');
        }
        var ajuda = document.getElementById('oportPubAjudaResposta');
        if (ajuda) {
          ajuda.textContent = t('oportunidadesPublicas.ajudaMudarResposta');
          ajuda.removeAttribute('hidden');
        }
        var btnApp = document.getElementById('btnAbrirApp');
        if (btnApp) {
          var tt = t('oportunidadesPublicas.btnAbrirAppTitle');
          btnApp.setAttribute('title', tt);
          btnApp.setAttribute('aria-label', t('oportunidadesPublicas.btnAbrirAppAria'));
        }
      }

      async function init() {
        var tok = getToken();
        var nomeEl = document.getElementById('nomeOport');
        var ajudaEl = document.getElementById('oportPubAjudaResposta');
        if (!tok) {
          if (nomeEl) nomeEl.textContent = t('oportunidadesPublicas.linkInvalido');
          document.getElementById('campanhaOport').textContent = t('oportunidadesPublicas.abraLinkCompleto');
          setAvatarInicial('');
          if (ajudaEl) ajudaEl.setAttribute('hidden', '');
          return;
        }
        var r = await fetch('/api/oportunidades-publicas/' + encodeURIComponent(tok));
        var d = await r.json().catch(function () { return {}; });
        if (!r.ok) {
          if (nomeEl) nomeEl.textContent = t('oportunidadesPublicas.linkInvalidoExpirado');
          document.getElementById('cpfOport').textContent = '';
          document.getElementById('campanhaOport').textContent = d.error || t('oportunidadesPublicas.tenteNovoConvite');
          var stErro = document.getElementById('oportPubStatus');
          if (stErro) stErro.textContent = '';
          var wrapErro = document.getElementById('oportPubStatusWrap');
          if (wrapErro) wrapErro.hidden = true;
          setAvatarInicial('');
          if (ajudaEl) ajudaEl.setAttribute('hidden', '');
          return;
        }
        if (ajudaEl) {
          ajudaEl.removeAttribute('hidden');
        }
        var stOk = document.getElementById('oportPubStatusWrap');
        if (stOk) stOk.hidden = true;
        var camp = d.campanha || {};
        var mot = d.motorista || {};
        var nomeMot = mot.nome || t('oportunidadesPublicas.motoristaFallback');
        var nomeCamp = camp.NOME || camp.nome || t('oportunidadesPublicas.campanhaVazio');
        var rot = mot.documentoRotulo || t('oportunidadesPublicas.docPadrao');
        var doc = mot.documento != null ? mot.documento : t('oportunidadesPublicas.docVazio');

        if (nomeEl) nomeEl.textContent = nomeMot;
        document.getElementById('cpfOport').textContent = rot + t('oportunidadesPublicas.docSeparador') + doc;
        document.getElementById('campanhaOport').textContent = t('oportunidadesPublicas.campanhaPrefixo') + nomeCamp;
        setAvatarInicial(nomeMot);

        var lista = document.getElementById('lista');
        var viagens = d.viagens || [];
        if (!viagens.length) {
          var empty = document.createElement('div');
          empty.className = 'card';
          empty.innerHTML = '<div class="card-body" style="text-align:center;color:var(--app-text-muted);">' + t('oportunidadesPublicas.semViagens') + '</div>';
          lista.appendChild(empty);
          return;
        }

        viagens.forEach(function (v) {
          var idv = v.IDVIAGEM || v.idviagem;
          var origem = (v.ORIGEM_CIDADE || '') + '/' + (v.ORIGEM_ESTADO || '');
          var destino = (v.DESTINO_CIDADE || '') + '/' + (v.DESTINO_ESTADO || '');
          var frete = Number(v.VLFRETE || v.vlfrete || 0).toLocaleString(localeFmt(), {
            style: 'currency',
            currency: (v.MOEDA || v.moeda || 'BRL')
          });

          var card = document.createElement('article');
          card.className = 'oport-viagem-card';
          card.setAttribute('role', 'listitem');
          card.innerHTML =
            '<div class="oport-viagem-card-head">' + tpl('oportunidadesPublicas.viagemHead', { id: idv }) + '</div>' +
            '<div class="oport-viagem-card-body">' +
              '<div class="oport-viagem-line"><i class="bx bx-map" aria-hidden="true"></i> ' + tpl('oportunidadesPublicas.rota', { orig: origem, dest: destino }) + '</div>' +
              '<div class="oport-viagem-frete">' + tpl('oportunidadesPublicas.frete', { val: frete }) + '</div>' +
              '<div class="oport-pub-acoes">' +
                '<div class="oport-pub-feedback" role="status" aria-live="polite"></div>' +
                '<div class="oport-pub-botoes">' +
                  '<button type="button" data-acao="interesse" class="btn-primary btn-success">' + t('oportunidadesPublicas.btnInteresse') + '</button>' +
                  '<button type="button" data-acao="recusa" class="oport-pub-btn-no">' + t('oportunidadesPublicas.btnNaoInteresse') + '</button>' +
                '</div>' +
              '</div>' +
            '</div>';

          var stMan = v.statusManifestacao != null ? v.statusManifestacao : v.STATUSMANIFESTACAO;
          aplicarEstadoCard(card, stMan);
          card.querySelector('button[data-acao="interesse"]').onclick = function () {
            postInteresse(tok, idv, 'INTERESSE', card, this);
          };
          card.querySelector('button[data-acao="recusa"]').onclick = function () {
            postInteresse(tok, idv, 'RECUSA', card, this);
          };
          lista.appendChild(card);
        });
      }

      function run() {
        applyStaticUi();
        init().catch(function () {
          var nomeEl = document.getElementById('nomeOport');
          if (nomeEl) nomeEl.textContent = t('oportunidadesPublicas.erroCarregarNome');
          showToast(t('oportunidadesPublicas.toastErroCarregar'), 'err');
        });
      }

      if (window.i18nReady) {
        window.i18nReady.then(run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
