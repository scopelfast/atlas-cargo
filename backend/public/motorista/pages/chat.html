<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Motorista</title>
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <style>
    .chat-container { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px;
      padding-bottom: 80px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    
    .mensagem { margin-bottom: 12px; display: flex; }
    .mensagem.motorista { justify-content: flex-end; }
    .mensagem.operador { justify-content: flex-start; }
    
    .mensagem-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    
    .mensagem.motorista .mensagem-bubble {
      background: #dcf8c6;
      border-bottom-right-radius: 4px;
    }
    
    .mensagem.operador .mensagem-bubble {
      background: white;
      border-bottom-left-radius: 4px;
    }
    
    .mensagem-texto { font-size: 14px; color: #333; margin-bottom: 4px; word-wrap: break-word; }
    .mensagem-hora { font-size: 11px; color: #999; text-align: right; }
    
    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f0f0f0;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #ddd;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    
    .input-msg {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      background: white;
    }
    
    .btn-enviar,
    .btn-localizacao {
      width: 48px;
      height: 48px;
      border: none;
      color: white;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .btn-enviar {
      background: #667eea;
    }
    
    .btn-localizacao {
      background: #28a745;
    }
    
    .btn-localizacao:active {
      transform: scale(0.95);
    }
    
    .btn-localizacao:disabled {
      background: #6c757d;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .empty { 
      text-align: center; 
      padding: 40px 20px; 
      color: #999;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .status-indicator {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 8px;
    }

    .status-online {
      background: #d4edda;
      color: #155724;
    }

    .status-offline {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div id="statusIndicador" class="status-bar status-online">🟢 Online - Sincronizado</div>

  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← Voltar</button>
    <h1>Chat com Operador <span id="chatStatus" class="status-indicator status-offline">Offline</span></h1>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="empty">
      <div class="empty-icon">💬</div>
      <strong>Carregando mensagens...</strong>
    </div>
  </div>

  <div class="input-area">
    <button class="btn-localizacao" onclick="enviarLocalizacao()" title="Enviar minha localização">📍</button>
    <input type="text" class="input-msg" id="inputMensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagem()">
    <button class="btn-enviar" onclick="enviarMensagem()">📤</button>
  </div>

  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/notifications-service.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
