<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Motorista</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #e5ddd5; 
      font-family: -apple-system, sans-serif; 
      height: 100vh; 
      display: flex; 
      flex-direction: column;
      overflow: hidden;
    }
    
    .navbar { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      color: white; 
      padding: 14px 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      flex-shrink: 0; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .btn-voltar { background: rgba(255,255,255,0.25); border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .navbar h1 { font-size: 18px; font-weight: 600; flex: 1; }
    
    .chat-container { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    
    .mensagem { margin-bottom: 12px; display: flex; }
    .mensagem.motorista { justify-content: flex-end; }
    .mensagem.operador { justify-content: flex-start; }
    
    .mensagem-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    
    .mensagem.motorista .mensagem-bubble {
      background: #dcf8c6;
      border-bottom-right-radius: 4px;
    }
    
    .mensagem.operador .mensagem-bubble {
      background: white;
      border-bottom-left-radius: 4px;
    }
    
    .mensagem-texto { font-size: 14px; color: #333; margin-bottom: 4px; word-wrap: break-word; }
    .mensagem-hora { font-size: 11px; color: #999; text-align: right; }
    
    .input-area {
      background: #f0f0f0;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    
    .input-msg {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      background: white;
    }
    
    .btn-enviar {
      width: 48px;
      height: 48px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .empty { 
      text-align: center; 
      padding: 40px 20px; 
      color: #999;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← Voltar</button>
    <h1>💬 Chat com Operador</h1>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="empty">
      <div class="empty-icon">💬</div>
      <strong>Nenhuma mensagem ainda</strong><br>
      Envie uma mensagem para começar a conversa!
    </div>
  </div>

  <div class="input-area">
    <input type="text" class="input-msg" id="inputMensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagem()">
    <button class="btn-enviar" onclick="enviarMensagem()">📤</button>
  </div>

  <script src="../js/offline.js"></script>
  <script>
    const motorista = JSON.parse(localStorage.getItem('motorista') || '{}');
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '../index.html';

    let mensagens = [];
    const idViagem = 82250; // TODO: Pegar da viagem atual

    async function enviarMensagem() {
      const input = document.getElementById('inputMensagem');
      const texto = input.value.trim();
      
      if (!texto) return;

      const mensagem = {
        idviagem: idViagem,
        idmotorista: motorista.id,
        tipo: 'M',
        mensagem: texto,
        timestamp: new Date().toISOString()
      };

      // Adicionar à lista local
      mensagens.push({
        ...mensagem,
        remetente: 'motorista',
        enviado: false
      });

      renderizar();
      input.value = '';
      scrollBottom();

      // Tentar enviar
      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch('/api/motorista/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(mensagem)
          });

          if (response.ok) {
            mensagens[mensagens.length - 1].enviado = true;
            renderizar();
          } else {
            await window.OfflineDB.adicionarFila('filaMensagens', mensagem);
          }
        } else {
          await window.OfflineDB.adicionarFila('filaMensagens', mensagem);
        }

        localStorage.setItem('chat_mensagens', JSON.stringify(mensagens));
      } catch (err) {
        console.error('Erro:', err);
      }
    }

    function renderizar() {
      const container = document.getElementById('chatContainer');
      
      if (mensagens.length === 0) {
        container.innerHTML = '<div class="empty">Nenhuma mensagem ainda<br>Envie uma mensagem abaixo!</div>';
        return;
      }

      container.innerHTML = mensagens.map(m => {
        const hora = new Date(m.timestamp).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
        const classe = m.remetente === 'motorista' ? 'motorista' : 'operador';

        return `
          <div class="mensagem ${classe}">
            <div class="mensagem-bubble">
              <div class="mensagem-texto">${m.mensagem}</div>
              <div class="mensagem-hora">${hora} ${m.enviado ? '✓✓' : '⏳'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function scrollBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    function voltar() {
      window.location.href = 'dashboard.html';
    }

    // Carregar mensagens salvas
    const salvo = localStorage.getItem('chat_mensagens');
    if (salvo) {
      mensagens = JSON.parse(salvo);
      renderizar();
      setTimeout(scrollBottom, 100);
    }

    // Auto-atualizar mensagens a cada 10 segundos
    setInterval(async () => {
      // TODO: Buscar novas mensagens do servidor
      if (window.OfflineDB && window.OfflineDB.isOnline()) {
        window.OfflineDB.sincronizarTudo();
      }
    }, 10000);
  </script>
</body>
</html>
