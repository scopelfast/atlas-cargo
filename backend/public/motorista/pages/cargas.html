<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargas Disponíveis</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    /* Estilos específicos da página Cargas */
    .filtros { background: var(--app-card); padding: 16px; margin-bottom: 16px; border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--app-card-border); color: var(--app-text); }
    .filtros-titulo { font-size: 15px; color: var(--app-text); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .filtros-titulo .bx { font-size: 20px; color: var(--app-primary); }
    .filtro-label { font-size: 13px; color: var(--app-text-secondary); font-weight: 600; display: block; margin-bottom: 4px; }
    .filtro-input { width: 100%; padding: 12px; border: 2px solid var(--app-input-border); border-radius: 10px; font-size: 14px; margin-bottom: 10px; background: var(--app-input-bg); color: var(--app-input-text); }
    .btn-filtrar { width: 100%; padding: 14px; background: var(--app-primary); color: var(--app-header-text); border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-filtrar .bx { font-size: 20px; }

    .route-section { background: var(--app-bg-alt); padding: 14px; border-radius: 12px; margin-bottom: 14px; border: 1px solid var(--app-card-border); }
    .route-item { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
    .route-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .route-icon.origem { background: var(--success); color: white; }
    .route-icon.destino { background: var(--error); color: white; }
    .route-label { font-size: 11px; color: var(--app-text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
    .route-cidade { font-size: 15px; color: var(--app-text); font-weight: 600; }

    .obs-box { margin: 14px 0; padding: 12px; background: var(--warning-bg); border-left: 4px solid var(--warning); border-radius: 8px; }
    .obs-titulo { font-size: 11px; color: var(--warning); font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
    .obs-texto { font-size: 13px; color: var(--app-text-secondary); }

    .empty { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .empty .bx { font-size: 32px; color: var(--app-primary); opacity: 0.9; }
    .info-icon { display: flex; align-items: center; justify-content: center; }
    .info-icon .bx { font-size: 18px; color: var(--app-primary); }
    .cargas-obs-texto { text-align: center; color: var(--app-text-muted); font-size: 12px; margin-top: 12px; padding: 0 16px; }
    .cargas-classe-box { background: var(--app-accent-muted); padding: 12px; border-radius: 10px; margin-bottom: 14px; border: 1px solid var(--app-card-border); }
    .cargas-classe-titulo { font-size: 12px; font-weight: 600; color: var(--app-primary); margin-bottom: 6px; }
    .cargas-classe-sub { font-size: 11px; color: var(--app-text-muted); }
    
    .btn-aceitar { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3); }
    .btn-aceitar:active { transform: scale(0.96); }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← Voltar</button>
    <h1><i class="bx bx-package"></i> <span data-i18n="cargas.titulo">Cargas Disponíveis</span></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online">Online - Sincronizado</div>
  </div>

  <div class="container">
    <div class="filtros">
      <div class="filtros-titulo"><i class="bx bx-search-alt"></i> <span data-i18n="cargas.filtrosBusca">Filtros de Busca</span></div>
      <label class="filtro-label" for="filtroPais"><span data-i18n="cargas.pais">País</span></label>
      <select class="filtro-input" id="filtroPais">
        <option value="" data-i18n="cargas.todosPaises">Todos os países</option>
      </select>
      <label class="filtro-label" for="filtroEstado"><span data-i18n="cargas.estado">Estado / UF</span></label>
      <select class="filtro-input" id="filtroEstado">
        <option value="" data-i18n="cargas.todosEstados">Todos os estados</option>
      </select>
      <div id="filtroRegiaoWrap" style="display: none;">
        <label class="filtro-label" for="filtroRegiao"><span data-i18n="cargas.regiao">Região</span></label>
        <select class="filtro-input" id="filtroRegiao">
          <option value="" data-i18n="cargas.todosRegioes">Todas as regiões</option>
        </select>
      </div>
      <input type="number" class="filtro-input" id="filtroDistancia" placeholder="Distância máxima (km)">
      <button class="btn-filtrar" onclick="aplicarFiltros()"><i class="bx bx-search"></i> <span data-i18n="cargas.buscarCargas">Buscar Cargas</span></button>
    </div>

    <div id="cargasList">
      <div class="loading"><div class="spinner"></div><p data-i18n="cargas.carregando">Carregando cargas...</p></div>
    </div>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k) el.textContent = window.t(k);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
        var k = el.getAttribute('data-i18n-title');
        if (k) el.title = window.t(k);
      });
    }
    if (window.i18nReady) window.i18nReady.then(function() {
      applyI18n();
      // Atualizar placeholders dos selects após i18n (evita chaves cruas)
      var optEstado = document.querySelector('#filtroEstado option[data-i18n="cargas.todosEstados"]');
      var optRegiao = document.querySelector('#filtroRegiao option[data-i18n="cargas.todosRegioes"]');
      if (optEstado && typeof window.t === 'function') optEstado.textContent = window.t('cargas.todosEstados');
      if (optRegiao && typeof window.t === 'function') optRegiao.textContent = window.t('cargas.todosRegioes');
    });

    const motorista = JSON.parse(localStorage.getItem('motorista') || '{}');
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '../index.html';

    const baseUrl = window.__BASE_URL__ || (window.location.protocol + '//' + window.location.host);
    const _t = (typeof window.t === 'function' ? window.t : function(k) { return k; });

    console.log('🚚 Página Cargas carregada');
    console.log('👤 Motorista:', motorista);

    // Contexto (país padrão) - Fase 4 multimoeda/multipaís
    let contextoPais = 'BR';
    async function loadContexto() {
      try {
        const r = await fetch(baseUrl + '/api/contexto');
        const d = await r.json();
        if (d && d.pais) contextoPais = String(d.pais).toUpperCase().substring(0, 2);
      } catch (e) {}
    }

    async function loadPaises() {
      const sel = document.getElementById('filtroPais');
      if (!sel) return;
      try {
        await loadContexto();
        const r = await fetch(baseUrl + '/api/paises');
        const paises = await r.json();
        if (!Array.isArray(paises)) return;
        sel.innerHTML = '<option value="">' + _t('cargas.todosPaises') + '</option>';
        paises.forEach(function(p) {
          const v = (p.SGPAIS != null && p.SGPAIS !== '') ? String(p.SGPAIS).trim() : String(p.CDPAIS || '');
          const lbl = p.DSPAIS || p.SGPAIS || p.CDPAIS || v;
          if (!v) return;
          const o = document.createElement('option');
          o.value = v;
          o.textContent = lbl;
          sel.appendChild(o);
        });
        sel.value = contextoPais || '';
        await loadEstados();
      } catch (err) { console.warn('Erro ao carregar países:', err); }
    }

    async function loadEstados() {
      const sel = document.getElementById('filtroEstado');
      const regiaoWrap = document.getElementById('filtroRegiaoWrap');
      const pais = document.getElementById('filtroPais') && document.getElementById('filtroPais').value;
      if (!sel) return;
      sel.innerHTML = '<option value="">' + _t('cargas.todosEstados') + '</option>';
      if (regiaoWrap) regiaoWrap.style.display = 'none';
      if (document.getElementById('filtroRegiao')) document.getElementById('filtroRegiao').innerHTML = '<option value="">' + _t('cargas.todosRegioes') + '</option>';
      if (!pais) return;
      try {
        if (pais === 'BR') {
          if (regiaoWrap) regiaoWrap.style.display = 'block';
          const r = await fetch(baseUrl + '/api/estados-brasil');
          const estados = await r.json();
          if (Array.isArray(estados)) estados.forEach(function(e) {
            const o = document.createElement('option');
            o.value = e.uf || e.UF || e.estado;
            o.textContent = e.nome || e.uf || e.UF || o.value;
            sel.appendChild(o);
          });
        } else {
          const r2 = await fetch(baseUrl + '/api/estados?pais=' + encodeURIComponent(pais));
          const lista = await r2.json();
          if (Array.isArray(lista)) lista.forEach(function(e) {
            const o = document.createElement('option');
            const cduf = e.CDUF != null ? e.CDUF : e.cduf;
            const nm = e.NMESTADO || e.nmestado || e.ESTADO || e.estado || cduf;
            o.value = cduf != null ? String(cduf) : (e.uf || e.UF || '');
            o.textContent = nm;
            if (o.value || o.textContent) sel.appendChild(o);
          });
        }
      } catch (err) { console.warn('Erro ao carregar estados:', err); }
    }

    async function loadRegioes() {
      const sel = document.getElementById('filtroRegiao');
      const estadoVal = document.getElementById('filtroEstado') && document.getElementById('filtroEstado').value;
      if (!sel || !estadoVal) return;
      sel.innerHTML = '<option value="">' + _t('cargas.todosRegioes') + '</option>';
      let cduf = parseInt(estadoVal, 10);
      if (isNaN(cduf)) {
        try {
          const r = await fetch(baseUrl + '/api/estado-cduf/' + encodeURIComponent(estadoVal));
          const d = await r.json();
          if (d && d.CDUF != null) cduf = d.CDUF;
        } catch (e) { return; }
      }
      if (isNaN(cduf)) return;
      try {
        const r = await fetch(baseUrl + '/api/mesorregioes/' + cduf);
        const list = await r.json();
        if (Array.isArray(list)) list.forEach(function(m) {
          const o = document.createElement('option');
          o.value = m.CDMESOREGIAO != null ? m.CDMESOREGIAO : m.cdmesoregiao;
          o.textContent = m.DSMESOREGIAO || m.dsmesoregiao || o.value;
          sel.appendChild(o);
        });
      } catch (err) { console.warn('Erro ao carregar regiões:', err); }
    }

    document.getElementById('filtroPais').addEventListener('change', function() {
      loadEstados();
    });
    document.getElementById('filtroEstado').addEventListener('change', function() {
      var pais = document.getElementById('filtroPais') && document.getElementById('filtroPais').value;
      if (pais === 'BR') loadRegioes(); else document.getElementById('filtroRegiao').innerHTML = '<option value="">' + _t('cargas.todosRegioes') + '</option>';
    });

    function formatarMoeda(v, moeda) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: (moeda && moeda.trim()) || 'BRL' }).format(v || 0); }
    function formatarData(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : '-'; }
    function formatarDistancia(valor) {
      const n = parseFloat(String(valor || 0).replace(',', '.')) || 0;
      return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    }
    function formatarPeso(valor) {
      const n = parseFloat(String(valor || 0).replace(',', '.')) || 0;
      return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
    }
    function formatarCubagem(valor) {
      const n = parseFloat(String(valor || 0).replace(',', '.')) || 0;
      return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
    }

    async function aplicarFiltros() {
      console.log('🔍 Aplicando filtros...');
      
      const pais = document.getElementById('filtroPais') && document.getElementById('filtroPais').value;
      const estado = document.getElementById('filtroEstado') && document.getElementById('filtroEstado').value;
      const regiao = document.getElementById('filtroRegiao') && document.getElementById('filtroRegiao').value;
      const distancia = document.getElementById('filtroDistancia') && document.getElementById('filtroDistancia').value;

      let url = baseUrl + '/api/motorista/cargas-disponiveis?';
      url += `idmotorista=${motorista.id || motorista.CDCADASTRO || ''}&`;
      if (pais) url += `pais=${encodeURIComponent(pais)}&`;
      if (estado) url += `estado=${encodeURIComponent(estado)}&`;
      if (regiao) url += `regiao=${encodeURIComponent(regiao)}&`;
      if (distancia) url += `distanciaMax=${distancia}&`;

      console.log('📡 URL:', url);
      console.log('🔑 Token:', token ? 'Presente' : 'Ausente');

      try {
        console.log('🌐 Verificando conexão...');
        
        const response = await fetch(url, { 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        
        console.log('📨 Resposta:', response.status);
        
        if (response.ok) {
          const cargas = await response.json();
          console.log('✅ Cargas recebidas:', cargas.length);
          
          if (window.OfflineDB) {
            await window.OfflineDB.salvarCache('cargas', cargas);
          }
          renderizar(cargas);
        } else {
          const erro = await response.text();
          console.error('❌ Erro servidor:', erro);
          
          // Tentar cache
          if (window.OfflineDB) {
            const cargas = await window.OfflineDB.buscarCache('cargas');
            renderizar(cargas || []);
            mostrarToast('Erro ao buscar cargas. Mostrando dados salvos.', 'warning');
          } else {
            renderizar([]);
          }
        }
      } catch (err) {
        console.error('❌ ERRO:', err);
        
        // Tentar cache
        try {
          if (window.OfflineDB) {
            const cargas = await window.OfflineDB.buscarCache('cargas');
            renderizar(cargas || []);
            mostrarToast('Sem conexão. Mostrando dados salvos.', 'warning');
          } else {
            renderizar([]);
            mostrarToast('Erro ao carregar cargas', 'error');
          }
        } catch (cacheErr) {
          renderizar([]);
          mostrarToast('Erro ao carregar cargas', 'error');
        }
      }
    }

    function renderizar(cargas) {
      const lista = document.getElementById('cargasList');
      
      if (!cargas || cargas.length === 0) {
        const _t = (typeof window.t === 'function' ? window.t : function(k){ return k; });
        lista.innerHTML = '<div class="empty"><i class="bx bx-package"></i> ' + _t('cargas.semCargas') + '</div>' +
          '<p class="cargas-obs-texto">' +
          'Aparecem aqui apenas viagens em <strong>Preparação</strong> ou <strong>Programada</strong>, ativas, sem motorista confirmado. ' +
          'Use os filtros acima e clique em Buscar Cargas.</p>';
        return;
      }

      lista.innerHTML = cargas.map(c => {
        const origem = c.ORIGEM_CIDADE && c.ORIGEM_ESTADO ? `${c.ORIGEM_CIDADE} - ${c.ORIGEM_ESTADO}` : 'Não informado';
        const destino = c.DESTINO_CIDADE && c.DESTINO_ESTADO ? `${c.DESTINO_CIDADE} - ${c.DESTINO_ESTADO}` : 'Não informado';

        const linkMaps = `https://www.google.com/maps/search/${encodeURIComponent(origem)}`;
        
        let numCont = (c.CONTRATADOR_CELULAR || '').toString().replace(/\D/g, '');
        if (numCont.startsWith('0')) numCont = numCont.substring(1);
        const linkWhatsApp = numCont.length >= 10
          ? `https://wa.me/${numCont.length >= 12 ? numCont : '55' + numCont}`
          : null;

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title"><i class="bx bx-map-alt"></i> Viagem #${c.IDVIAGEM}</div>
              <div class="card-subtitle">${c.DSTIPOVIAGEM || 'Tipo não definido'}</div>
            </div>
            <div class="card-body">
              <div class="cargas-classe-box">
                <div class="cargas-classe-titulo">
                  <i class="bx bx-truck"></i> ${c.DSCLASSEFROTA || 'Classe não definida'}
                </div>
                <div class="cargas-classe-sub">
                  ${c.FGRASTREADO === 'S' ? '<i class="bx bx-radar"></i> Exige Rastreamento' : '<i class="bx bx-map-pin"></i> Não exige rastreamento'}
                </div>
              </div>

              <div class="route-section">
                <div class="route-item">
                  <div class="route-icon origem"><i class="bx bx-map-pin"></i></div>
                  <div style="flex: 1;">
                    <div class="route-label">Origem</div>
                    <div class="route-cidade">${origem}</div>
                    <a href="${linkMaps}" target="_blank" style="font-size: 11px; color: #0ea5e9; text-decoration: none; font-weight: 600; margin-top: 4px; display: inline-block;">
                      <i class="bx bx-map"></i> Abrir no Mapa
                    </a>
                  </div>
                </div>
                <div class="route-item">
                  <div class="route-icon destino"><i class="bx bx-target-lock"></i></div>
                  <div>
                    <div class="route-label">Destino</div>
                    <div class="route-cidade">${destino}</div>
                  </div>
                </div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <div class="info-icon"><i class="bx bx-ruler"></i></div>
                  <div class="info-label">Distância</div>
                  <div class="info-value">${formatarDistancia(c.DISTANCIAKM)} km</div>
                </div>
                <div class="info-item">
                  <div class="info-icon"><i class="bx bx-dollar"></i></div>
                  <div class="info-label">Frete</div>
                  <div class="info-value">${formatarMoeda(c.VLFRETE, c.MOEDA)}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon"><i class="bx bx-package"></i></div>
                  <div class="info-label">Peso</div>
                  <div class="info-value">${formatarPeso(c.PESO)} kg</div>
                </div>
                <div class="info-item">
                  <div class="info-icon"><i class="bx bx-package"></i></div>
                  <div class="info-label">Cubagem</div>
                  <div class="info-value">${formatarCubagem(c.CUBAGEM)} m³</div>
                </div>
                <div class="info-item">
                  <div class="info-icon"><i class="bx bx-calendar"></i></div>
                  <div class="info-label">Início</div>
                  <div class="info-value">${formatarData(c.DTPREVINICIO)}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon"><i class="bx bx-building"></i></div>
                  <div class="info-label">Contratador</div>
                  <div class="info-value" style="font-size: 12px;">${(c.CONTRATADOR || 'N/I').substring(0, 15)}</div>
                </div>
              </div>

              ${linkWhatsApp ? `
                <a href="${linkWhatsApp}" target="_blank" style="display: block; padding: 12px; background: #25D366; color: white; text-align: center; border-radius: 10px; text-decoration: none; font-weight: 700; margin: 14px 0;">
                  💬 WhatsApp do Contratador
                </a>
              ` : ''}
              ${c.OBSERV ? `
                <div class="obs-box">
                  <div class="obs-titulo">Observações</div>
                  <div class="obs-texto">${c.OBSERV.substring(0, 100)}${c.OBSERV.length > 100 ? '...' : ''}</div>
                </div>
              ` : ''}
              <button class="btn-aceitar" onclick="aceitarCarga(${c.IDVIAGEM})">✓ Aceitar Esta Carga</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function aceitarCarga(idViagem) {
      const confirmado = await window.Notificacoes.confirmar({
        titulo: 'Aceitar Carga',
        mensagem: 'Deseja aceitar esta viagem?',
        icone: '🚚',
        confirmar: '✓ Aceitar',
        cancelar: '✗ Cancelar'
      });
      
      if (!confirmado) return;

      const dados = { idmotorista: motorista.id };

      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/aceitar-carga/${idViagem}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(dados)
          });

          if (response.ok) {
            window.Notificacoes.sucesso('Carga aceita! Veja em "Minhas Convocações"', 4000);
            aplicarFiltros();
          } else {
            window.Notificacoes.erro('Erro ao aceitar carga');
          }
        } else {
          await window.OfflineDB.adicionarFila('filaAcoes', {
            tipo: 'aceitar-carga',
            url: `/api/motorista/aceitar-carga/${idViagem}`,
            method: 'POST',
            data: dados
          });
          window.Notificacoes.info('Offline - Será enviado quando conectar');
        }
      } catch (err) {
        window.Notificacoes.erro('Erro ao aceitar carga');
      }
    }

    function voltar() {
      window.location.href = 'dashboard.html';
    }

    if (window.OfflineDB && window.OfflineDB.atualizarIndicador) {
      window.OfflineDB.atualizarIndicador();
    }
    // Carregar países/estados só após i18n para traduzir "Todos os estados" / "Todas as regiões"
    (window.i18nReady ? window.i18nReady : Promise.resolve()).then(function() {
      loadPaises().then(aplicarFiltros);
    });
  </script>
</body>
</html>
