<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargas Disponíveis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #f0f2f5; font-family: -apple-system, sans-serif; width: 100%; overflow-x: hidden; }
    
    .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .btn-voltar { background: rgba(255,255,255,0.25); border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .navbar h1 { font-size: 18px; font-weight: 600; flex: 1; }
    
    .status-bar { padding: 10px 16px; text-align: center; font-size: 13px; font-weight: 600; }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    
    .filtros { background: white; padding: 16px; margin-bottom: 16px; }
    .filtros-titulo { font-size: 14px; color: #666; font-weight: 600; margin-bottom: 12px; }
    .filtro-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; margin-bottom: 10px; }
    .btn-filtrar { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
    
    .container { padding: 0 16px 16px; }
    
    .card { background: white; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
    .card-header { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; padding: 16px; }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .card-subtitle { font-size: 13px; opacity: 0.95; }
    
    .card-body { padding: 16px; }
    
    .route-section { background: #f8f9fa; padding: 14px; border-radius: 12px; margin-bottom: 14px; }
    .route-item { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
    .route-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .route-icon.origem { background: #28a745; color: white; }
    .route-icon.destino { background: #dc3545; color: white; }
    .route-label { font-size: 11px; color: #666; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
    .route-cidade { font-size: 15px; color: #333; font-weight: 600; }
    
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .info-item { background: #f8f9fa; padding: 12px; border-radius: 10px; text-align: center; }
    .info-icon { font-size: 22px; margin-bottom: 6px; }
    .info-label { font-size: 10px; color: #666; text-transform: uppercase; font-weight: 600; }
    .info-value { font-size: 15px; color: #333; font-weight: 700; margin-top: 4px; }
    
    .btn-aceitar { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3); }
    .btn-aceitar:active { transform: scale(0.96); }
    
    .obs-box { margin: 14px 0; padding: 12px; background: #fffbea; border-left: 4px solid #ffc107; border-radius: 8px; }
    .obs-titulo { font-size: 11px; color: #856404; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
    .obs-texto { font-size: 13px; color: #333; }
    
    .empty { text-align: center; padding: 60px 20px; color: #999; }
    .loading { text-align: center; padding: 60px 20px; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="statusIndicador" class="status-bar status-online">🟢 Online</div>

  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← Voltar</button>
    <h1>🚚 Cargas Disponíveis</h1>
  </div>

  <div class="filtros">
    <div class="filtros-titulo">🔍 Filtros de Busca</div>
    <select class="filtro-input" id="filtroEstado">
      <option value="">Todos os Estados</option>
      <option value="PR">PR - Paraná</option>
      <option value="SP">SP - São Paulo</option>
      <option value="SC">SC - Santa Catarina</option>
      <option value="RS">RS - Rio Grande do Sul</option>
      <option value="RJ">RJ - Rio de Janeiro</option>
      <option value="MG">MG - Minas Gerais</option>
    </select>
    <input type="number" class="filtro-input" id="filtroDistancia" placeholder="Distância máxima (km)">
    <button class="btn-filtrar" onclick="aplicarFiltros()">🔍 Buscar Cargas</button>
  </div>

  <div class="container">
    <div id="cargasList">
      <div class="loading"><div class="spinner"></div><p>Carregando cargas...</p></div>
    </div>
  </div>

  <script src="../js/offline.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/console-mobile.js"></script>
  <script>
    const motorista = JSON.parse(localStorage.getItem('motorista') || '{}');
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '../index.html';

    console.log('🚚 Página Cargas carregada');
    console.log('👤 Motorista:', motorista);

    function formatarMoeda(v) { return new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(v || 0); }
    function formatarData(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : '-'; }

    async function aplicarFiltros() {
      console.log('🔍 Aplicando filtros...');
      
      const estado = document.getElementById('filtroEstado').value;
      const distancia = document.getElementById('filtroDistancia').value;

      let url = '/api/motorista/cargas-disponiveis?';
      url += `idmotorista=${motorista.id}&`; // Filtrar por classes do motorista
      if (estado) url += `estado=${estado}&`;
      if (distancia) url += `distanciaMax=${distancia}&`;

      console.log('📡 URL:', url);
      console.log('🔑 Token:', token ? 'Presente' : 'Ausente');

      try {
        console.log('🌐 Verificando conexão...');
        
        const response = await fetch(url, { 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        
        console.log('📨 Resposta:', response.status);
        
        if (response.ok) {
          const cargas = await response.json();
          console.log('✅ Cargas recebidas:', cargas.length);
          
          if (window.OfflineDB) {
            await window.OfflineDB.salvarCache('cargas', cargas);
          }
          renderizar(cargas);
        } else {
          const erro = await response.text();
          console.error('❌ Erro servidor:', erro);
          
          // Tentar cache
          if (window.OfflineDB) {
            const cargas = await window.OfflineDB.buscarCache('cargas');
            renderizar(cargas || []);
            alert('Erro ao buscar cargas. Mostrando cache.');
          } else {
            renderizar([]);
          }
        }
      } catch (err) {
        console.error('❌ ERRO:', err);
        
        // Tentar cache
        try {
          if (window.OfflineDB) {
            const cargas = await window.OfflineDB.buscarCache('cargas');
            renderizar(cargas || []);
            alert('📴 Sem conexão. Mostrando dados salvos.');
          } else {
            renderizar([]);
            alert('Erro ao carregar cargas');
          }
        } catch (cacheErr) {
          renderizar([]);
          alert('Erro ao carregar');
        }
      }
    }

    function renderizar(cargas) {
      const lista = document.getElementById('cargasList');
      
      if (!cargas || cargas.length === 0) {
        lista.innerHTML = '<div class="empty">📭 Nenhuma carga disponível</div>';
        return;
      }

      lista.innerHTML = cargas.map(c => {
        const origem = c.ORIGEM_CIDADE && c.ORIGEM_ESTADO ? `${c.ORIGEM_CIDADE} - ${c.ORIGEM_ESTADO}` : 'Não informado';
        const destino = c.DESTINO_CIDADE && c.DESTINO_ESTADO ? `${c.DESTINO_CIDADE} - ${c.DESTINO_ESTADO}` : 'Não informado';

        const linkMaps = c.ORIGEM_LATITUDE && c.ORIGEM_LONGITUDE 
          ? `https://www.google.com/maps?q=${c.ORIGEM_LATITUDE},${c.ORIGEM_LONGITUDE}`
          : `https://www.google.com/maps/search/${encodeURIComponent(origem)}`;
        
        const linkWhatsApp = c.CONTRATADOR_CELULAR 
          ? `https://wa.me/55${c.CONTRATADOR_CELULAR.toString().replace(/\D/g, '')}`
          : null;

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">🚚 Viagem #${c.IDVIAGEM}</div>
              <div class="card-subtitle">${c.DSTIPOVIAGEM || 'Tipo não definido'}</div>
            </div>
            <div class="card-body">
              <div style="background: #e3f2fd; padding: 12px; border-radius: 10px; margin-bottom: 14px;">
                <div style="font-size: 12px; font-weight: 600; color: #1976d2; margin-bottom: 6px;">
                  🚛 ${c.DSCLASSEFROTA || 'Classe não definida'}
                </div>
                <div style="font-size: 11px; color: #666;">
                  ${c.FGRASTREADO === 'S' ? '📡 Exige Rastreamento' : '📍 Não exige rastreamento'}
                </div>
              </div>

              <div class="route-section">
                <div class="route-item">
                  <div class="route-icon origem">📍</div>
                  <div style="flex: 1;">
                    <div class="route-label">Origem</div>
                    <div class="route-cidade">${origem}</div>
                    <a href="${linkMaps}" target="_blank" style="font-size: 11px; color: #667eea; text-decoration: none; font-weight: 600; margin-top: 4px; display: inline-block;">
                      🗺️ Abrir no Mapa
                    </a>
                  </div>
                </div>
                <div class="route-item">
                  <div class="route-icon destino">🎯</div>
                  <div>
                    <div class="route-label">Destino</div>
                    <div class="route-cidade">${destino}</div>
                  </div>
                </div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <div class="info-icon">📏</div>
                  <div class="info-label">Distância</div>
                  <div class="info-value">${(c.DISTANCIAKM || 0).toLocaleString('pt-BR')} km</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">💰</div>
                  <div class="info-label">Frete</div>
                  <div class="info-value">${formatarMoeda(c.VLFRETE)}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">📦</div>
                  <div class="info-label">Peso</div>
                  <div class="info-value">${(c.PESO || 0).toLocaleString('pt-BR', {maximumFractionDigits: 0})} kg</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">📦</div>
                  <div class="info-label">Cubagem</div>
                  <div class="info-value">${(c.CUBAGEM || 0).toLocaleString('pt-BR', {maximumFractionDigits: 2})} m³</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">📅</div>
                  <div class="info-label">Início</div>
                  <div class="info-value">${formatarData(c.DTPREVINICIO)}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">🏢</div>
                  <div class="info-label">Contratador</div>
                  <div class="info-value" style="font-size: 12px;">${(c.CONTRATADOR || 'N/I').substring(0, 15)}</div>
                </div>
              </div>

              ${linkWhatsApp ? `
                <a href="${linkWhatsApp}" target="_blank" style="display: block; padding: 12px; background: #25D366; color: white; text-align: center; border-radius: 10px; text-decoration: none; font-weight: 700; margin: 14px 0;">
                  💬 WhatsApp do Contratador
                </a>
              ` : ''}
              ${c.OBSERV ? `
                <div class="obs-box">
                  <div class="obs-titulo">Observações</div>
                  <div class="obs-texto">${c.OBSERV.substring(0, 100)}${c.OBSERV.length > 100 ? '...' : ''}</div>
                </div>
              ` : ''}
              <button class="btn-aceitar" onclick="aceitarCarga(${c.IDVIAGEM})">✓ Aceitar Esta Carga</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function aceitarCarga(idViagem) {
      const confirmado = await window.Notificacoes.confirmar({
        titulo: 'Aceitar Carga',
        mensagem: 'Deseja aceitar esta viagem?',
        icone: '🚚',
        confirmar: '✓ Aceitar',
        cancelar: '✗ Cancelar'
      });
      
      if (!confirmado) return;

      const dados = { idmotorista: motorista.id };

      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch(`/api/motorista/aceitar-carga/${idViagem}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(dados)
          });

          if (response.ok) {
            window.Notificacoes.sucesso('Carga aceita! Veja em "Minhas Convocações"', 4000);
            aplicarFiltros();
          } else {
            window.Notificacoes.erro('Erro ao aceitar carga');
          }
        } else {
          await window.OfflineDB.adicionarFila('filaAcoes', {
            tipo: 'aceitar-carga',
            url: `/api/motorista/aceitar-carga/${idViagem}`,
            method: 'POST',
            data: dados
          });
          window.Notificacoes.info('Offline - Será enviado quando conectar');
        }
      } catch (err) {
        window.Notificacoes.erro('Erro ao aceitar carga');
      }
    }

    function voltar() { window.location.href = 'dashboard.html'; }

    aplicarFiltros();
  </script>
</body>
</html>
