<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualização GPS - Motorista</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="../../js/map-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .gps-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      gap: 16px;
    }
    
    .map-container {
      flex: 1;
      min-height: 320px;
      height: 50vh;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
    }
    
    #map {
      width: 100%;
      height: 100%;
      min-height: 280px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    .stat-unit {
      font-size: 14px;
      color: #999;
      margin-left: 4px;
    }
    
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid #e0e0e0;
    }
    
    .tab {
      padding: 12px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .tab.active {
      color: #0ea5e9;
      border-bottom-color: #0ea5e9;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .historico-list {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .historico-item {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .historico-item:last-child {
      border-bottom: none;
    }
    
    .historico-info {
      flex: 1;
    }
    
    .historico-coords {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    
    .historico-hora {
      font-size: 12px;
      color: #666;
    }
    .gps-marker-veiculo {
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← <span data-i18n="gpsVisualizacao.voltar">Voltar</span></button>
    <h1><i class="bx bx-map"></i> <span data-i18n="gpsVisualizacao.titulo">Visualização GPS</span></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online" data-i18n="dashboard.onlineSincronizado">Online - Sincronizado</div>
  </div>

  <div class="container">
    <div class="gps-container">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="mostrarTab('mapa')" data-i18n="gpsVisualizacao.mapa">📍 Mapa</button>
        <button class="tab" onclick="mostrarTab('historico')" data-i18n="gpsVisualizacao.historico">📊 Histórico</button>
        <button class="tab" onclick="mostrarTab('estatisticas')" data-i18n="gpsVisualizacao.estatisticas">📈 Estatísticas</button>
      </div>

      <!-- Tab: Mapa -->
      <div id="tab-mapa" class="tab-content active">
        <div class="map-container">
          <div id="map"></div>
          <div id="mapEmptyMessage" class="map-empty-message" style="display: flex; position: absolute; inset: 0; background: #f0f0f0; align-items: center; justify-content: center; border-radius: 12px; flex-direction: column; padding: 20px; text-align: center; color: #666;">
            <div style="font-size: 48px; margin-bottom: 16px;">📍</div>
            <div data-i18n="gpsVisualizacao.carregandoPosicoes">Carregando posições...</div>
          </div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.ultimaPosicao">📍 Última Posição</div>
            <div class="stat-value" id="ultimaPosicao">-</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.tempoEstimado">⏱️ Tempo Estimado</div>
            <div class="stat-value" id="tempoEstimado">-</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.distanciaPercorrida">📏 Distância Percorrida</div>
            <div class="stat-value" id="distanciaPercorrida">-</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.velocidadeMedia">🚗 Velocidade Média</div>
            <div class="stat-value" id="velocidadeMedia">-</div>
          </div>
        </div>
      </div>

      <!-- Tab: Histórico -->
      <div id="tab-historico" class="tab-content">
        <div class="historico-list" id="historicoList">
          <div class="loading">
            <div class="spinner"></div>
            <p data-i18n="gpsVisualizacao.carregandoHistorico">Carregando histórico...</p>
          </div>
        </div>
      </div>

      <!-- Tab: Estatísticas -->
      <div id="tab-estatisticas" class="tab-content">
        <div class="stats-grid" style="grid-template-columns: 1fr;">
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.totalPosicoes">📊 Total de Posições</div>
            <div class="stat-value" id="totalPosicoes">-</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.tempoTotal">⏱️ Tempo Total</div>
            <div class="stat-value" id="tempoTotal">-</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.velocidadeMaxima">🚗 Velocidade Máxima</div>
            <div class="stat-value" id="velocidadeMaxima">-</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label" data-i18n="gpsVisualizacao.primeiraPosicao">📍 Primeira Posição</div>
            <div class="stat-value" id="primeiraPosicao" style="font-size: 14px;">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/offline.js"></script>
  
  <script>
    if (!verificarAuth()) window.location.href = '../index.html';

    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k) el.textContent = window.t(k);
      });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);
    // Helper de tradução: usa referência fixa ao tradutor para evitar recursão (nunca usar nome "t" que pode conflitar com window.t)
    const _t = (typeof window.t === 'function' ? window.t : function(k) { return k; });

    const motorista = getMotorista();
    const token = localStorage.getItem('token');
    let idViagem = null;
    let map = null;
    let markers = [];
    let routePolyline = null;
    let posicoesGPS = [];

    // Obter ID da viagem da URL
    const params = new URLSearchParams(window.location.search);
    idViagem = params.get('viagem');

    if (!idViagem) {
      mostrarToast(_t('gpsVisualizacao.viagemNaoEspecificada'), 'error');
      setTimeout(() => {
        window.location.href = 'viagens.html';
      }, 2000);
    }

    window.voltar = function() {
      window.location.href = 'viagens.html';
    };

    function mostrarTab(tabName) {
      // Esconder todas as tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab').forEach(btn => {
        btn.classList.remove('active');
      });
      
      // Mostrar tab selecionada
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
      
      // Se for mapa, redimensionar (garante que o mapa apareça ao trocar de aba)
      if (tabName === 'mapa' && map) {
        setTimeout(() => {
          map.invalidateSize();
          if (posicoesGPS.length > 0) {
            const b = L.latLngBounds(posicoesGPS.map(p => [parseFloat(p.LATITUDE), parseFloat(p.LONGITUDE)]));
            map.fitBounds(b, { padding: [20, 20] });
          }
        }, 150);
      }
    }

    // Inicializar mapa com Leaflet
    function inicializarMapa() {
      if (typeof L === 'undefined') {
        console.warn('⚠️ Leaflet não carregado. Usando visualização alternativa.');
        document.getElementById('map').innerHTML = `
          <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666; flex-direction: column; padding: 20px;">
            <div style="text-align: center;">
              <div style="font-size: 48px; margin-bottom: 16px;">🗺️</div>
              <div style="font-weight: 600; margin-bottom: 8px;">Carregando mapa...</div>
            </div>
          </div>
        `;
        // Tentar novamente após um delay
        setTimeout(inicializarMapa, 1000);
        return;
      }

      // Posição padrão (Brasil)
      map = L.map('map').setView([-14.2350, -51.9253], 10);

      // IMPORTANTE: Usar APENAS getTileServerUrl() do map-config.js
      console.log('🗺️ [GPS] Inicializando mapa...');
      console.log('🗺️ [GPS] MAP_CONFIG disponível:', !!window.MAP_CONFIG);
      console.log('🗺️ [GPS] getTileServerUrl disponível:', typeof window.getTileServerUrl === 'function');
      
      let tileServer = window.getTileServerUrl ? window.getTileServerUrl() : (window.MAP_CONFIG?.tileServer || 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
      console.log('🗺️ [GPS] Tile server selecionado:', tileServer);
      
      const tileOptions = {
        attribution: window.MAP_CONFIG?.attribution || '© OpenStreetMap contributors',
        maxZoom: window.MAP_CONFIG?.maxZoom || 19,
        crossOrigin: true
      };
      
      // Se usar servidor OpenStreetMap com {s}, adicionar subdomínios
      if (tileServer.includes('{s}')) {
        tileOptions.subdomains = ['a', 'b', 'c'];
        console.log('🗺️ [GPS] Adicionando subdomínios para OpenStreetMap');
      }
      
      const tileLayer = L.tileLayer(tileServer, tileOptions);
      console.log('✅ [GPS] TileLayer adicionado ao mapa');
      
      tileLayer.addTo(map);
      
      // Forçar cálculo do tamanho (container pode estar em flex/tab)
      setTimeout(function() {
        if (map) map.invalidateSize();
      }, 100);
      
      // Log de erros de tiles
      tileLayer.on('tileerror', (error, tile) => {
        console.error('❌ [GPS] Erro ao carregar tile:', error, tile?.src);
      });
      
      tileLayer.on('tileload', (event) => {
        console.log('✅ [GPS] Tile carregado:', event.tile.src);
      });

      carregarPosicoes();
    }

    // Carregar posições GPS
    const baseUrl = window.__BASE_URL__ || (window.location.protocol + '//' + window.location.host);
    function extrairListaPosicoesApi(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.posicoes)) return data.posicoes;
      if (data.data && Array.isArray(data.data.posicoes)) return data.data.posicoes;
      return [];
    }
    async function carregarPosicoes() {
      try {
        const urlPos =
          typeof window.corrigirUrl === 'function'
            ? window.corrigirUrl('/api/motorista/posicoes/' + encodeURIComponent(idViagem))
            : baseUrl + '/api/motorista/posicoes/' + encodeURIComponent(idViagem);
        const response = await fetch(urlPos, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          let msgErro = 'HTTP ' + response.status;
          try {
            const errBody = await response.json();
            msgErro = errBody.error || errBody.message || msgErro;
          } catch (_) {
            try {
              msgErro = (await response.text()) || msgErro;
            } catch (__) { /* ignore */ }
          }
          console.error('[gps-visualizacao] Falha ao buscar posições:', msgErro);
          if (typeof mostrarToast === 'function') {
            mostrarToast(msgErro, 'error');
          }
          posicoesGPS = [];
          const emptyEl = document.getElementById('mapEmptyMessage');
          if (emptyEl) {
            emptyEl.style.display = 'flex';
            emptyEl.innerHTML =
              '<div style="font-size: 48px; margin-bottom: 16px;">📍</div><div>Não foi possível carregar as posições</div><div style="font-size: 12px; margin-top: 8px;">' +
              (typeof window.escapeHtml === 'function' ? window.escapeHtml(String(msgErro)) : String(msgErro)) +
              '</div>';
          }
          renderizarHistorico();
          atualizarEstatisticas();
          return;
        }

        const data = await response.json().catch(() => ({}));
        let raw = extrairListaPosicoesApi(data);
        // Normalizar chaves para maiúsculas (backend pode retornar minúsculas no PostgreSQL)
        posicoesGPS = raw.map(p => ({
          ...p,
          LATITUDE: p.LATITUDE ?? p.latitude,
          LONGITUDE: p.LONGITUDE ?? p.longitude,
          VELOCIDADE: p.VELOCIDADE ?? p.velocidade,
          DHREGISTRO: p.DHREGISTRO ?? p.dhiregistro,
          DHPOSICAO: p.DHPOSICAO ?? p.dhposicao
        }));
        // Garantir ordem: mais recente primeiro (índice 0 = última posição)
        posicoesGPS.sort(function(a, b) {
          const tA = new Date(a.DHPOSICAO || a.DHREGISTRO).getTime();
          const tB = new Date(b.DHPOSICAO || b.DHREGISTRO).getTime();
          return tB - tA;
        });

        if (posicoesGPS.length === 0) {
          const emptyEl = document.getElementById('mapEmptyMessage');
          if (emptyEl) {
            emptyEl.style.display = 'flex';
            emptyEl.innerHTML = '<div style="font-size: 48px; margin-bottom: 16px;">📍</div><div>Nenhuma posição GPS encontrada</div><div style="font-size: 12px; margin-top: 8px;">Aguardando envio de posições...</div>';
          }
          renderizarHistorico();
          atualizarEstatisticas();
          return;
        }

        const emptyEl2 = document.getElementById('mapEmptyMessage');
        if (emptyEl2) emptyEl2.style.display = 'none';

        // Renderizar no mapa
        try {
          renderizarMapa();
        } catch (rmErr) {
          console.error('[gps-visualizacao] renderizarMapa:', rmErr);
          if (typeof mostrarToast === 'function') {
            mostrarToast((rmErr && rmErr.message) ? rmErr.message : 'Erro ao desenhar o mapa.', 'error');
          }
        }
        
        // Renderizar histórico
        renderizarHistorico();
        
        // Atualizar estatísticas
        atualizarEstatisticas();
        
      } catch (err) {
        console.error('Erro ao carregar posições:', err);
        posicoesGPS = [];
        const emptyEl = document.getElementById('mapEmptyMessage');
        if (emptyEl) {
          emptyEl.style.display = 'flex';
          emptyEl.innerHTML = '<div style="font-size: 48px; margin-bottom: 16px;">📍</div><div>Nenhuma posição GPS encontrada</div><div style="font-size: 12px; margin-top: 8px;">Verifique a conexão ou aguarde o envio de posições.</div>';
        }
        renderizarHistorico();
        atualizarEstatisticas();
        if (typeof mostrarToast === 'function') {
          mostrarToast('Erro ao carregar posições GPS. Verifique a conexão.', 'error');
        }
      }
    }

    /**
     * Rota por estradas via gateway (evita CORS/405); fallback: polyline dos pontos GPS.
     */
    async function desenharRotaNoMapa(routeCoordinates) {
      const primeiro = routeCoordinates[0];
      const ultimo = routeCoordinates[routeCoordinates.length - 1];
      if (primeiro[0] === ultimo[0] && primeiro[1] === ultimo[1]) {
        routePolyline = L.polyline(routeCoordinates, { color: '#0ea5e9', weight: 4, opacity: 0.8 }).addTo(map);
        return;
      }
      if (typeof window.fetchOsrmRouteJsonViaBackend !== 'function') {
        routePolyline = L.polyline(routeCoordinates, { color: '#0ea5e9', weight: 4, opacity: 0.8 }).addTo(map);
        return;
      }
      const coordsStr = primeiro[1] + ',' + primeiro[0] + ';' + ultimo[1] + ',' + ultimo[0];
      try {
        const raw = await window.fetchOsrmRouteJsonViaBackend(coordsStr, 70000);
        var data = raw;
        if (typeof window.normalizarRespostaGatewayOsrm === 'function') {
          var n = window.normalizarRespostaGatewayOsrm(raw);
          if (n) data = n;
        }
        if (data && data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates) {
          const latLngs = data.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
          routePolyline = L.polyline(latLngs, { color: '#0ea5e9', weight: 4, opacity: 0.8 }).addTo(map);
          return;
        }
      } catch (e) {
        console.warn('[gps-visualizacao] Rota gateway:', e && e.message);
      }
      routePolyline = L.polyline(routeCoordinates, { color: '#0ea5e9', weight: 4, opacity: 0.8 }).addTo(map);
    }

    // Renderizar mapa com Leaflet
    function renderizarMapa() {
      if (!map || posicoesGPS.length === 0) return;

      // Limpar marcadores anteriores
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];
      
      if (routePolyline) {
        map.removeLayer(routePolyline);
      }

      // Criar array de coordenadas para a rota
      const routeCoordinates = [];
      const bounds = [];

      const iconVeiculoUltima = L.divIcon({
        className: 'gps-marker-veiculo',
        html: '<div style="font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))">🚛</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });

      posicoesGPS.forEach((pos, index) => {
        const lat = parseFloat(String(pos.LATITUDE != null ? pos.LATITUDE : '').replace(',', '.'));
        const lng = parseFloat(String(pos.LONGITUDE != null ? pos.LONGITUDE : '').replace(',', '.'));
        
        if (isNaN(lat) || isNaN(lng)) return;

        const position = [lat, lng];
        routeCoordinates.push(position);
        bounds.push(position);

        // Criar marcador (última posição = caminhão; demais = pin padrão)
        const isUltima = index === 0; // Primeira é a mais recente
        const markerOptions = {
          title: `Posição ${posicoesGPS.length - index}`
        };
        // Evita passar icon undefined para o Leaflet (quebra em _initIcon/createIcon).
        if (isUltima) markerOptions.icon = iconVeiculoUltima;
        const marker = L.marker(position, markerOptions);

        // Popup com informações
        const popupContent = `
          <div style="padding: 8px; min-width: 150px;">
            <strong>Posição ${posicoesGPS.length - index}</strong><br>
            <small>${new Date(pos.DHPOSICAO || pos.DHREGISTRO).toLocaleString('pt-BR')}</small><br>
            ${pos.VELOCIDADE ? `<small>Velocidade: ${parseFloat(pos.VELOCIDADE).toFixed(1)} km/h</small>` : ''}
          </div>
        `;
        marker.bindPopup(popupContent);
        marker.addTo(map);

        markers.push(marker);
      });

      // Desenhar rota: gateway (estradas); se falhar, polyline dos pontos
      if (routeCoordinates.length > 1) {
        void desenharRotaNoMapa(routeCoordinates).catch(function(e) {
          console.warn('[gps-visualizacao] desenharRotaNoMapa:', e && e.message);
        });
      }

      // Ajustar zoom para mostrar toda a rota
      if (bounds.length > 0) {
        try {
          const boundsGroup = L.latLngBounds(bounds);
          map.fitBounds(boundsGroup, { padding: [20, 20] });
          
          // Se houver apenas uma posição, definir zoom manual
          if (bounds.length === 1) {
            map.setZoom(15);
            map.setView(bounds[0]);
          }
        } catch (fbErr) {
          console.warn('[gps-visualizacao] fitBounds:', fbErr && fbErr.message);
          if (bounds.length === 1 && bounds[0]) {
            try {
              map.setView(bounds[0], 15);
            } catch (_) { /* ignore */ }
          }
        }
      }

      // Forçar Leaflet a recalcular tamanho do mapa (evita mapa em branco)
      setTimeout(function() {
        if (map) map.invalidateSize();
      }, 150);

      // Atualizar última posição
      if (posicoesGPS.length > 0) {
        const ultima = posicoesGPS[0];
        const hora = new Date(ultima.DHPOSICAO || ultima.DHREGISTRO).toLocaleTimeString('pt-BR', {
          hour: '2-digit',
          minute: '2-digit'
        });
        document.getElementById('ultimaPosicao').textContent = hora;
      }
    }

    // Renderizar histórico
    function renderizarHistorico() {
      const container = document.getElementById('historicoList');
      
      if (posicoesGPS.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #999;">
            <div style="font-size: 48px; margin-bottom: 16px;">📍</div>
            <p>Nenhuma posição registrada</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posicoesGPS.map((pos, index) => {
        const lat = parseFloat(pos.LATITUDE).toFixed(6);
        const lng = parseFloat(pos.LONGITUDE).toFixed(6);
        const hora = new Date(pos.DHPOSICAO || pos.DHREGISTRO).toLocaleString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
        const velocidade = pos.VELOCIDADE ? `${parseFloat(pos.VELOCIDADE).toFixed(1)} km/h` : 'N/A';
        const isUltima = index === 0;

        return `
          <div class="historico-item" ${isUltima ? 'style="background: #e0f2fe; border-left: 4px solid #0ea5e9;"' : ''}>
            <div class="historico-info">
              <div style="font-weight: 600; color: #333;">
                ${isUltima ? '📍 ' : ''}Posição ${posicoesGPS.length - index}
              </div>
              <div class="historico-coords">${lat}, ${lng}</div>
              ${pos.VELOCIDADE ? `<div style="font-size: 12px; color: #0ea5e9; margin-top: 4px;">🚗 ${velocidade}</div>` : ''}
            </div>
            <div class="historico-hora">${hora}</div>
          </div>
        `;
      }).join('');
    }

    // Calcular estatísticas
    function atualizarEstatisticas() {
      if (posicoesGPS.length === 0) {
        document.getElementById('totalPosicoes').textContent = '0';
        document.getElementById('distanciaPercorrida').textContent = '0 km';
        document.getElementById('velocidadeMedia').textContent = '0 km/h';
        document.getElementById('tempoEstimado').textContent = '-';
        document.getElementById('tempoTotal').textContent = '-';
        document.getElementById('velocidadeMaxima').textContent = '0 km/h';
        document.getElementById('primeiraPosicao').textContent = '-';
        return;
      }

      // Total de posições
      document.getElementById('totalPosicoes').textContent = posicoesGPS.length;

      // Primeira e última posição
      const primeira = posicoesGPS[posicoesGPS.length - 1];
      const ultima = posicoesGPS[0];
      
      const primeiraHora = new Date(primeira.DHPOSICAO || primeira.DHREGISTRO).toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('primeiraPosicao').textContent = primeiraHora;

      // Calcular distância total
      let distanciaTotal = 0;
      for (let i = 1; i < posicoesGPS.length; i++) {
        const prev = posicoesGPS[i];
        const curr = posicoesGPS[i - 1];
        
        if (prev.LATITUDE && prev.LONGITUDE && curr.LATITUDE && curr.LONGITUDE) {
          const dist = calcularDistancia(
            parseFloat(prev.LATITUDE),
            parseFloat(prev.LONGITUDE),
            parseFloat(curr.LATITUDE),
            parseFloat(curr.LONGITUDE)
          );
          distanciaTotal += dist;
        }
      }
      
      document.getElementById('distanciaPercorrida').innerHTML = 
        `${distanciaTotal.toFixed(2)}<span class="stat-unit"> km</span>`;

      // Calcular velocidade média (da API ou estimada por distância/tempo entre pontos)
      let velocidades = posicoesGPS
        .filter(p => p.VELOCIDADE != null && p.VELOCIDADE !== '')
        .map(p => parseFloat(p.VELOCIDADE));
      
      if (velocidades.length === 0 && posicoesGPS.length >= 2) {
        const estimadas = [];
        for (let i = 1; i < posicoesGPS.length; i++) {
          const prev = posicoesGPS[i];
          const curr = posicoesGPS[i - 1];
          const dist = calcularDistancia(
            parseFloat(prev.LATITUDE), parseFloat(prev.LONGITUDE),
            parseFloat(curr.LATITUDE), parseFloat(curr.LONGITUDE)
          );
          const tPrev = new Date(prev.DHPOSICAO || prev.DHREGISTRO).getTime();
          const tCurr = new Date(curr.DHPOSICAO || curr.DHREGISTRO).getTime();
          const horas = (tCurr - tPrev) / 3600000;
          if (horas > 0 && dist >= 0) estimadas.push(dist / horas);
        }
        if (estimadas.length > 0) velocidades = estimadas;
      }
      
      if (velocidades.length > 0) {
        const velocidadeMedia = velocidades.reduce((a, b) => a + b, 0) / velocidades.length;
        document.getElementById('velocidadeMedia').innerHTML = 
          `${velocidadeMedia.toFixed(1)}<span class="stat-unit"> km/h</span>`;
        
        const velocidadeMax = Math.max(...velocidades);
        document.getElementById('velocidadeMaxima').innerHTML = 
          `${velocidadeMax.toFixed(1)}<span class="stat-unit"> km/h</span>`;
      } else {
        document.getElementById('velocidadeMedia').textContent = 'N/A';
        document.getElementById('velocidadeMaxima').textContent = 'N/A';
      }

      // Calcular tempo total
      const primeiraData = new Date(primeira.DHPOSICAO || primeira.DHREGISTRO);
      const ultimaData = new Date(ultima.DHPOSICAO || ultima.DHREGISTRO);
      const tempoTotalMs = ultimaData - primeiraData;
      const horas = Math.floor(tempoTotalMs / 3600000);
      const minutos = Math.floor((tempoTotalMs % 3600000) / 60000);
      
      document.getElementById('tempoTotal').innerHTML = 
        horas > 0 ? `${horas}h ${minutos}min` : `${minutos}min`;

      // Tempo estimado de chegada (precisa de destino da viagem)
      calcularTempoEstimado();
    }

    // Calcular distância entre dois pontos (fórmula de Haversine)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371; // Raio da Terra em km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Calcular tempo estimado de chegada
    async function calcularTempoEstimado() {
      try {
        if (posicoesGPS.length === 0) {
          document.getElementById('tempoEstimado').textContent = 'N/A';
          return;
        }

        // Buscar dados da viagem para obter destino (mesmo prefixo /cargas que posicoes)
        const urlViagem =
          typeof window.corrigirUrl === 'function'
            ? window.corrigirUrl('/api/motorista/viagem/' + encodeURIComponent(idViagem))
            : `/api/motorista/viagem/${encodeURIComponent(idViagem)}`;
        const response = await fetch(urlViagem, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          let viagem = await response.json();
          
          // Verificar se é um objeto com dados ou o objeto direto
          if (viagem.dados) {
            viagem = viagem.dados;
          }
          
          // Obter coordenadas do destino diretamente da viagem
          let destinoLat = null;
          let destinoLng = null;
          
          if (viagem.DESTINO_LATITUDE && viagem.DESTINO_LONGITUDE) {
            destinoLat = parseFloat(viagem.DESTINO_LATITUDE);
            destinoLng = parseFloat(viagem.DESTINO_LONGITUDE);
          }
          
          // Se tiver destino, calcular
          if (destinoLat && destinoLng && posicoesGPS.length > 0) {
            const ultima = posicoesGPS[0];
            const distanciaRestante = calcularDistancia(
              parseFloat(ultima.LATITUDE),
              parseFloat(ultima.LONGITUDE),
              destinoLat,
              destinoLng
            );
            
            // Velocidade média: das últimas posições (API) ou estimada por distância/tempo
            let velMedia = 0;
            const ultimas5 = posicoesGPS.slice(0, 5).filter(p => p.VELOCIDADE != null && p.VELOCIDADE !== '');
            if (ultimas5.length > 0) {
              velMedia = ultimas5.reduce((sum, p) => sum + parseFloat(p.VELOCIDADE), 0) / ultimas5.length;
            } else if (posicoesGPS.length >= 2) {
              const estimadas = [];
              for (let i = 1; i < Math.min(6, posicoesGPS.length); i++) {
                const prev = posicoesGPS[i];
                const curr = posicoesGPS[i - 1];
                const dist = calcularDistancia(
                  parseFloat(prev.LATITUDE), parseFloat(prev.LONGITUDE),
                  parseFloat(curr.LATITUDE), parseFloat(curr.LONGITUDE)
                );
                const horas = (new Date(curr.DHPOSICAO || curr.DHREGISTRO) - new Date(prev.DHPOSICAO || prev.DHREGISTRO)) / 3600000;
                if (horas > 0 && dist >= 0) estimadas.push(dist / horas);
              }
              if (estimadas.length > 0) velMedia = estimadas.reduce((a, b) => a + b, 0) / estimadas.length;
            }
            
            if (velMedia > 0 && distanciaRestante > 0) {
              const tempoHoras = distanciaRestante / velMedia;
              const horas = Math.floor(tempoHoras);
              const minutos = Math.floor((tempoHoras - horas) * 60);
              document.getElementById('tempoEstimado').innerHTML = 
                horas > 0 ? `${horas}h ${minutos}min` : `${minutos}min`;
            } else if (distanciaRestante > 0) {
              document.getElementById('tempoEstimado').textContent = 'N/A';
            } else {
              document.getElementById('tempoEstimado').textContent = 'N/A';
            }
          } else {
            document.getElementById('tempoEstimado').textContent = 'N/A';
          }
        } else {
          document.getElementById('tempoEstimado').textContent = 'N/A';
        }
      } catch (err) {
        console.warn('Erro ao calcular tempo estimado:', err);
        document.getElementById('tempoEstimado').textContent = 'N/A';
      }
    }

    // Inicializar
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        inicializarMapa();
      });
    } else {
      inicializarMapa();
    }

    // Atualizar a cada 30 segundos
    setInterval(carregarPosicoes, 30000);
  </script>
