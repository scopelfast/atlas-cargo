<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento GPS - Motorista</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* navbar e btn-voltar vêm do padrao-telas.css */
    
    .status-rastreando { background: #cce5ff; color: #004085; }
    
    .container { padding: 16px; }
    
    /* CARD VIAGEM */
    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 14px;
    }
    
    .info-label { color: #666; }
    .info-value { color: #333; font-weight: 600; }
    
    /* STATUS GPS */
    .gps-status {
      background: linear-gradient(165deg, #061428 0%, #0d2137 50%, #1a365d 100%);
      color: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .gps-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .gps-texto {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .gps-detalhe {
      font-size: 13px;
      opacity: 0.9;
    }
    
    .gps-timer {
      font-size: 32px;
      font-weight: 700;
      margin: 12px 0;
      font-family: 'Courier New', monospace;
    }
    
    /* BOTÕES */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin: 8px 0;
      transition: all 0.2s;
    }
    
    .btn:active { transform: scale(0.96); }
    
    .btn-primary { background: #0ea5e9; color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    .btn-success { background: #28a745; color: white; box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3); }
    .btn-danger { background: #dc3545; color: white; box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3); }
    .btn-warning { background: #ffc107; color: #000; box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3); }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    /* HISTÓRICO */
    .historico {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .historico-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .historico-item:last-child {
      border-bottom: none;
    }
    
    .historico-hora {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    
    .historico-status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
    }
    
    .historico-status.enviado {
      background: #d4edda;
      color: #155724;
    }
    
    .historico-status.aguardando {
      background: #fff3cd;
      color: #856404;
    }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← <span data-i18n="rastreamento.voltar">Voltar</span></button>
    <h1><i class="bx bx-map"></i> <span data-i18n="rastreamento.titulo">Rastreamento GPS</span></h1>
    <div id="statusIndicador" class="status-badge-navbar status-offline" data-i18n="rastreamento.carregando">Carregando...</div>
  </div>

  <!-- CONTEÚDO -->
  <div class="container">
    <!-- INFO DA VIAGEM -->
    <div class="card">
      <div class="card-title" data-i18n="rastreamento.informacoesViagem">🚚 Informações da Viagem</div>
      <div class="info-row">
        <span class="info-label" data-i18n="rastreamento.viagem">Viagem:</span>
        <span class="info-value" id="infoViagem">-</span>
      </div>
      <div class="info-row">
        <span class="info-label" data-i18n="rastreamento.destino">Destino:</span>
        <span class="info-value" id="infoDestino">-</span>
      </div>
      <div class="info-row">
        <span class="info-label" data-i18n="rastreamento.distancia">Distância:</span>
        <span class="info-value" id="infoDistancia">-</span>
      </div>
    </div>

    <!-- STATUS GPS -->
    <div class="gps-status" id="gpsStatus">
      <div class="gps-icon" id="gpsIcon">📍</div>
      <div class="gps-texto" id="gpsTexto" data-i18n="rastreamento.rastreamentoParado">Rastreamento Parado</div>
      <div class="gps-detalhe" id="gpsDetalhe" data-i18n="rastreamento.cliqueIniciar">Clique em "Iniciar" para começar</div>
      <div class="gps-timer" id="gpsTimer" style="display: none;">05:00</div>
    </div>

    <!-- BOTÕES DE CONTROLE -->
    <button class="btn btn-success" id="btnIniciar" onclick="iniciarRastreamento()" data-i18n="rastreamento.iniciarRastreamento">
      ▶ Iniciar Rastreamento
    </button>
    <button class="btn btn-warning" id="btnPausar" onclick="pausarRastreamento()" style="display: none;" data-i18n="rastreamento.pausarRastreamento">
      ⏸ Pausar Rastreamento
    </button>
    <button class="btn btn-primary" id="btnEnviarAgora" onclick="enviarPosicaoAgora()" data-i18n="rastreamento.enviarPosicaoAgora">
      📍 Enviar Posição Agora
    </button>
    
    <button class="btn btn-warning" onclick="testarGPS()" style="background: #ffc107; color: #000;" data-i18n="rastreamento.testarPermissaoGPS">
      🧪 Testar Permissão GPS
    </button>
    
    <button class="btn" onclick="simularGPS()" style="background: #6c757d; color: white;" data-i18n="rastreamento.simularGPS">
      🎮 Simular GPS (Desenvolvimento)
    </button>

    <!-- HISTÓRICO -->
    <div class="card">
      <div class="card-title" data-i18n="rastreamento.historicoUltimas10">📋 Histórico (Últimas 10 Posições)</div>
      <div class="historico" id="historicoLista">
        <p style="text-align: center; color: #999; padding: 20px;" data-i18n="rastreamento.nenhumaPosicaoEnviada">
          Nenhuma posição enviada ainda
        </p>
      </div>
    </div>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/offline.js"></script>
  <script>
    const motorista = JSON.parse(localStorage.getItem('motorista') || '{}');
    const token = localStorage.getItem('token');
    
    if (!token) {
      window.location.href = '../index.html';
    }

    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k) el.textContent = window.t(k);
      });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);

    const _t = (typeof window.t === 'function' ? window.t : function(k) { return k; });

    let intervaloGPS = null;
    let watchId = null;
    let rastreando = false;
    let tempoRestante = 300; // 5 minutos em segundos
    let timerInterval = null;
    let idViagem = null; // TODO: Pegar da viagem aceita

    // TESTAR GPS (força solicitação de permissão)
    async function testarGPS() {
      try {
        console.log('🧪 Testando GPS...');
        
        if (!navigator.geolocation) {
          mostrarToast(_t('rastreamento.dispositivoNaoSuportaGPS'), 'error');
          return;
        }

        mostrarToast(_t('rastreamento.gpsDisponivel'), 'success');

        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            resolve, 
            reject, 
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
          );
        });

        mostrarToast(
          `GPS funcionando!\n\nLocalização capturada:\nLatitude: ${pos.coords.latitude.toFixed(6)}\nLongitude: ${pos.coords.longitude.toFixed(6)}\nPrecisão: ${Math.round(pos.coords.accuracy)} metros`,
          'success'
        );

        console.log('✅ GPS OK:', pos.coords);
      } catch (err) {
        console.error('❌ Erro GPS:', err);
        
        if (err.code === 1) {
          mostrarToast(_t('rastreamento.permissaoNegada'), 'error');
        } else if (err.code === 2) {
          mostrarToast(_t('rastreamento.gpsIndisponivel'), 'error');
        } else if (err.code === 3) {
          mostrarToast(_t('rastreamento.timeout'), 'warning');
        }
      }
    }

    // SOLICITAR PERMISSÃO GPS
    async function solicitarPermissaoGPS() {
      if (!navigator.geolocation) {
        mostrarToast(_t('rastreamento.gpsNaoDisponivel'), 'error');
        return false;
      }

      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            resolve, 
            reject, 
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
          );
        });
        return true;
      } catch (err) {
        console.error('Erro permissão GPS:', err);
        return false;
      }
    }

    // CAPTURAR E ENVIAR POSIÇÃO
    async function capturarPosicao() {
      try {
        console.log('📍 Capturando GPS...');
        
        // Verificar se GPS está disponível
        if (!navigator.geolocation) {
          throw new Error('GPS não disponível neste dispositivo');
        }

        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            { 
              enableHighAccuracy: true, 
              timeout: 15000,  // 15 segundos
              maximumAge: 0 
            }
          );
        });

        console.log('✅ GPS capturado:', pos.coords.latitude, pos.coords.longitude);

        const dados = {
          idviagem: idViagem,
          idmotorista: motorista.id,
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          velocidade: pos.coords.speed || 0,
          precisao: Math.round(pos.coords.accuracy),
          bateria: await getBateria()
        };

        console.log('📦 Dados GPS:', dados);

        // Adicionar ao histórico local
        adicionarHistorico({
          hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
          lat: pos.coords.latitude.toFixed(6),
          lng: pos.coords.longitude.toFixed(6),
          enviado: false
        });

        // Tentar enviar
        if (window.OfflineDB.isOnline()) {
          console.log('🌐 Enviando para servidor...');
          
          try {
            const response = await fetch('/api/motorista/gps', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify(dados)
            });

            const resultado = await response.json();
            console.log('📡 Resposta servidor:', resultado);

            if (response.ok) {
              console.log('✅ GPS enviado com sucesso!');
              atualizarUltimoHistorico(true);
              document.getElementById('gpsDetalhe').textContent = 
                (_t('rastreamento.ultimaPosicao') || 'Última posição:') + ' ' + new Date().toLocaleTimeString('pt-BR');
            } else {
              console.error('❌ Erro do servidor:', resultado);
              // Erro ao enviar - adicionar à fila
              await window.OfflineDB.adicionarFila('filaGPS', dados);
              console.log('⏳ GPS adicionado à fila (erro servidor)');
              atualizarUltimoHistorico(false);
            }
          } catch (fetchErr) {
            console.error('❌ Erro na requisição:', fetchErr);
            // Erro de rede - adicionar à fila
            await window.OfflineDB.adicionarFila('filaGPS', dados);
            atualizarUltimoHistorico(false);
          }
        } else {
          // Offline - adicionar à fila
          console.log('📴 Offline - adicionando à fila');
          await window.OfflineDB.adicionarFila('filaGPS', dados);
          document.getElementById('gpsDetalhe').textContent = _t('rastreamento.offlinePosicaoEnviada');
          atualizarUltimoHistorico(false);
        }

        await window.OfflineDB.atualizarIndicador();
      } catch (err) {
        console.error('❌ ERRO GPS:', err);
        
        let mensagemErro = _t('rastreamento.erroCapturarLocalizacao');
        
        if (err.code === 1) {
          mensagemErro = _t('rastreamento.permissaoNegada');
          
          // Oferecer ajuda
          mostrarModal(
            _t('rastreamento.permissaoNegadaTitulo'),
            mensagemErro + '\n\nDeseja ver instruções detalhadas?',
            [_t('rastreamento.cancelar'), 'Ver Instruções']
          ).then(resposta => {
            if (resposta === 'Ver Instruções') {
              window.open('ajuda-gps.html', '_blank');
            }
          });
          return;
        } else if (err.code === 2) {
          mensagemErro = _t('rastreamento.gpsIndisponivel');
        } else if (err.code === 3) {
          mensagemErro = _t('rastreamento.timeout');
        } else if (err.message) {
          mensagemErro = err.message;
        }
        
        mostrarToast(mensagemErro, 'error');
        
        // Se estava rastreando, pausar
        if (rastreando) {
          pausarRastreamento();
        }
      }
    }

    // INICIAR RASTREAMENTO
    async function iniciarRastreamento() {
      // Verificar permissão
      const permissao = await solicitarPermissaoGPS();
      if (!permissao) return;

      // TODO: Verificar se tem viagem aceita/confirmada
      idViagem = 82250; // TEMPORÁRIO - Pegar da viagem real

      rastreando = true;
      document.getElementById('btnIniciar').style.display = 'none';
      document.getElementById('btnPausar').style.display = 'block';
      document.getElementById('gpsIcon').textContent = '🟢';
      document.getElementById('gpsTexto').textContent = _t('rastreamento.rastreando');
      document.getElementById('gpsDetalhe').textContent = _t('rastreamento.gpsAtivoEnviando');
      document.getElementById('gpsTimer').style.display = 'block';

      // Enviar primeira posição imediatamente
      await capturarPosicao();

      // Reiniciar timer
      tempoRestante = 300;
      atualizarTimer();

      // Configurar intervalo (5 minutos)
      intervaloGPS = setInterval(async () => {
        await capturarPosicao();
        tempoRestante = 300;
      }, 300000); // 5 minutos

      // Timer visual (atualiza a cada segundo)
      timerInterval = setInterval(() => {
        tempoRestante--;
        if (tempoRestante < 0) tempoRestante = 300;
        atualizarTimer();
      }, 1000);
    }

    // PAUSAR RASTREAMENTO
    function pausarRastreamento() {
      if (intervaloGPS) {
        clearInterval(intervaloGPS);
        intervaloGPS = null;
      }
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      rastreando = false;
      document.getElementById('btnIniciar').style.display = 'block';
      document.getElementById('btnPausar').style.display = 'none';
      document.getElementById('gpsIcon').textContent = '⏸';
      document.getElementById('gpsTexto').textContent = _t('rastreamento.rastreamentoPausado');
      document.getElementById('gpsDetalhe').textContent = _t('rastreamento.cliqueIniciarContinuar');
      document.getElementById('gpsTimer').style.display = 'none';
    }

    // ENVIAR POSIÇÃO MANUAL
    async function enviarPosicaoAgora() {
      document.getElementById('btnEnviarAgora').disabled = true;
      document.getElementById('btnEnviarAgora').textContent = '📡 ' + _t('rastreamento.enviando');

      await capturarPosicao();
      
      setTimeout(() => {
        document.getElementById('btnEnviarAgora').disabled = false;
        document.getElementById('btnEnviarAgora').textContent = '📍 ' + _t('rastreamento.enviarPosicaoAgora');
      }, 2000);
    }

    // ATUALIZAR TIMER
    function atualizarTimer() {
      const minutos = Math.floor(tempoRestante / 60);
      const segundos = tempoRestante % 60;
      const texto = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;
      document.getElementById('gpsTimer').textContent = texto;
    }

    // GET BATERIA
    async function getBateria() {
      try {
        if ('getBattery' in navigator) {
          const battery = await navigator.getBattery();
          return Math.round(battery.level * 100);
        }
      } catch (err) {
        console.log('Bateria não disponível');
      }
      return null;
    }

    // HISTÓRICO
    let historico = [];

    function adicionarHistorico(item) {
      historico.unshift(item);
      if (historico.length > 10) historico.pop();
      renderizarHistorico();
      
      // Salvar no localStorage
      localStorage.setItem('gps_historico', JSON.stringify(historico));
    }
    
    // Carregar histórico salvo
    function carregarHistorico() {
      try {
        const salvo = localStorage.getItem('gps_historico');
        if (salvo) {
          historico = JSON.parse(salvo);
          renderizarHistorico();
        }
      } catch (err) {
        console.error('Erro ao carregar histórico:', err);
      }
    }

    function atualizarUltimoHistorico(enviado) {
      if (historico.length > 0) {
        historico[0].enviado = enviado;
        renderizarHistorico();
      }
    }

    function renderizarHistorico() {
      const lista = document.getElementById('historicoLista');
      
      if (historico.length === 0) {
        lista.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">' + (typeof window.t === 'function' ? window.t('rastreamento.nenhumaPosicaoEnviada') : 'Nenhuma posição enviada ainda') + '</p>';
        return;
      }

      var lblEnviado = typeof window.t === 'function' ? window.t('rastreamento.enviado') : 'Enviado';
      var lblAguardando = typeof window.t === 'function' ? window.t('rastreamento.aguardando') : 'Aguardando';
      lista.innerHTML = historico.map(h => `
        <div class="historico-item">
          <div>
            <div class="historico-hora">📍 ${h.hora}</div>
            ${h.lat ? `<div style="font-size: 11px; color: #999; margin-top: 2px;">${h.lat}, ${h.lng}</div>` : ''}
          </div>
          <span class="historico-status ${h.enviado ? 'enviado' : 'aguardando'}">
            ${h.enviado ? '✅ ' + lblEnviado : '⏳ ' + lblAguardando}
          </span>
        </div>
      `).join('');
    }

    async function voltar() {
      if (rastreando) {
        const resposta = await mostrarModal(
          _t('rastreamento.rastreamentoAtivo'),
          _t('rastreamento.desejaSair'),
          [_t('rastreamento.cancelar'), _t('rastreamento.sair')]
        );
        
        if (resposta === _t('rastreamento.sair')) {
          pausarRastreamento();
          window.location.href = 'dashboard.html';
        }
        return;
      }
      window.location.href = 'dashboard.html';
    }

    // CARREGAR INFO DA VIAGEM
    // TODO: Buscar viagem aceita/confirmada do motorista
    document.getElementById('infoViagem').textContent = '#82250';
    document.getElementById('infoDestino').textContent = 'Itapevi - SP';
    document.getElementById('infoDistancia').textContent = '34 km';

    // Carregar histórico salvo
    carregarHistorico();

    // AUTO-SINCRONIZAR
    setInterval(() => {
      if (window.OfflineDB && window.OfflineDB.isOnline()) {
        window.OfflineDB.sincronizarTudo();
      }
    }, 30000);
    
    // SIMULAR GPS (para desenvolvimento em HTTP)
    async function simularGPS() {
      console.log('🎮 Simulando GPS...');
      
      // Coordenadas simuladas (Curitiba, PR)
      const latitudes = [-25.4284, -25.4290, -25.4295, -25.4300];
      const longitudes = [-49.2733, -49.2740, -49.2745, -49.2750];
      const random = Math.floor(Math.random() * latitudes.length);
      
      const dados = {
        idviagem: idViagem,
        idmotorista: motorista.id,
        latitude: latitudes[random],
        longitude: longitudes[random],
        velocidade: Math.random() * 80,
        precisao: Math.round(Math.random() * 20 + 5),
        bateria: await getBateria() || 85
      };

      console.log('📦 GPS Simulado:', dados);

      // Adicionar ao histórico
      adicionarHistorico({
        hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
        lat: dados.latitude.toFixed(6),
        lng: dados.longitude.toFixed(6),
        enviado: false
      });

      // Tentar enviar
      try {
        if (window.OfflineDB.isOnline()) {
          const response = await fetch('/api/motorista/gps', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(dados)
          });

          if (response.ok) {
            console.log('✅ GPS simulado enviado!');
            atualizarUltimoHistorico(true);
            mostrarToast(_t('rastreamento.posicaoSimuladaEnviada') + '\n\n' + 
                  'Lat: ' + dados.latitude.toFixed(6) + '\nLng: ' + dados.longitude.toFixed(6));
            document.getElementById('gpsDetalhe').textContent = 
              '✅ ' + (_t('rastreamento.ultimaPosicao') || 'Última posição') + ' (simulada): ' + new Date().toLocaleTimeString('pt-BR');
          } else {
            await window.OfflineDB.adicionarFila('filaGPS', dados);
            atualizarUltimoHistorico(false);
          }
        } else {
          await window.OfflineDB.adicionarFila('filaGPS', dados);
          atualizarUltimoHistorico(false);
          mostrarToast(_t('rastreamento.offlineGpsFila'), 'warning');
        }
      } catch (err) {
        console.error('Erro ao enviar GPS simulado:', err);
        mostrarToast(_t('rastreamento.erroEnviar'), 'error');
      }
    }
    
    // Log para debug
    console.log('📱 Página GPS carregada');
    console.log('👤 Motorista:', motorista);
    console.log('🔑 Token:', token ? 'Presente' : 'Ausente');
    console.log('⚠️ AVISO: GPS real só funciona em HTTPS (produção)');
  </script>
</body>
</html>
