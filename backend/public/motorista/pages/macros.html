<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macros - Motorista</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    .viagem-selector {
      background: #f8fafc;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .viagem-label { font-size: 11px; color: #64748b; font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .viagem-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      background: #fff;
    }
    .viagem-info {
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      padding: 10px 0;
    }

    .macros-container { margin-bottom: 20px; }
    .macro-categoria { margin-bottom: 18px; }
    /* Divisor no estilo do web: barra escura com ícone e título */
    .macro-divisor {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1c212f;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .macro-divisor-icon {
      font-size: 18px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .macro-divisor-icon.bx { font-family: 'boxicons' !important; }
    .macro-divisor-text {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.02em;
    }
    .macro-list { display: flex; flex-direction: column; gap: 2px; }
    .macro-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
      position: relative;
    }
    /* Disponíveis para clique: destaque com barra esquerda e fundo suave */
    .macro-btn:not(:disabled) {
      border-left: 3px solid #2563eb;
      background: #f0f9ff;
      border-color: #bae6fd #e2e8f0 #e2e8f0 #2563eb;
      font-weight: 600;
      color: #1e3a8a;
    }
    .macro-btn:not(:disabled):hover {
      background: #e0f2fe;
      border-color: #7dd3fc #cbd5e1 #cbd5e1 #2563eb;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.12);
    }
    .macro-btn:not(:disabled):active { background: #bae6fd; }
    .macro-btn:disabled {
      background: #f8fafc;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #f1f5f9;
    }
    .macro-btn .macro-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      color: #64748b;
      background: #f1f5f9;
    }
    .macro-btn:not(:disabled) .macro-icon-wrap {
      color: #2563eb;
      background: #e0f2fe;
    }
    .macro-btn .macro-label { flex: 1; min-width: 0; }
    .macro-btn .macro-status {
      flex-shrink: 0;
      font-size: 14px;
      color: #94a3b8;
    }
    .macro-btn:disabled .macro-status { color: #cbd5e1; }
    .macro-btn.macro-done .macro-status { color: #16a34a; }
    /* Seta azul nos disponíveis (ainda não registrados) */
    .macro-btn:not(:disabled):not(.macro-done) .macro-status { color: #2563eb; }
    .macro-icon-wrap.bx { font-family: 'boxicons' !important; }
    .lock-badge { display: none; }

    .historico-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .historico-item:last-child { border-bottom: none; }
    .historico-texto { font-size: 13px; color: #334155; flex: 1; }
    .historico-hora { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← Voltar</button>
    <h1><i class="bx bx-edit-alt"></i></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online">Online - Sincronizado</div>
    <button class="btn-voltar" onclick="forcarAtualizacao()" style="font-size: 20px; padding: 8px 12px; margin-left: 0;">🔄</button>
  </div>

  <div class="container">
    <!-- Seletor de Viagem -->
    <div class="viagem-selector" id="viagemSelector"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p data-i18n="common.carregando">Carregando...</p>
    </div>

    <!-- Macros por categoria -->
    <div class="macros-container" id="macrosContainer" style="display: none;"></div>

    <!-- Histórico -->
    <div class="card" id="historicoCard" style="display: none; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
      <div class="card-header" style="background: #f8fafc; padding: 10px 14px; border-bottom: 1px solid #e2e8f0;">
        <div class="card-title" data-i18n="macros.historico" style="font-size: 12px; font-weight: 600; color: #334155;">Histórico</div>
        <div class="card-subtitle" style="font-size: 11px; color: #64748b;">Todas as ocorrências da viagem</div>
      </div>
      <div class="card-body" id="historicoLista" style="padding: 8px 14px;"></div>
    </div>
  </div>

  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) { var k = el.getAttribute('data-i18n'); if (k) el.textContent = window.t(k); });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el) { var k = el.getAttribute('data-i18n-title'); if (k) el.title = window.t(k); });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);
  </script>
  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/cache-helper.js"></script>
  
  <script>
    if (!verificarAuth()) window.location.href = '../index.html';

    const motorista = getMotorista();
    // Preferir ID do JWT (tipo motorista) para bater com requireMotoristaAuth / assertSameMotorista
    const idMotorista =
      getMotoristaIdDoToken() ?? motorista?.CDCADASTRO ?? motorista?.id ?? motorista?.cdcadastro ?? null;
    let macros = [];
    let historico = [];
    let viagens = [];
    let viagemSelecionada = null;

    // Forçar atualização
    async function forcarAtualizacao() {
      const loading = mostrarLoading('Atualizando viagens...');
      
      try {
        viagemSelecionada = null;
        await carregarViagens(true); // Força online
        await renderizarSeletorViagem();
        
        esconderLoading();
        mostrarToast('Viagens atualizadas!', 'success');
      } catch (error) {
        esconderLoading();
        mostrarToast('Erro ao atualizar', 'error');
      }
    }

    function voltar() {
      window.location.href = 'dashboard.html';
    }

    // Inicializar
    (async () => {
      await carregarViagens();
      await carregarMacros();
      await atualizarStatusBar();
    })();

    // Carregar viagens do motorista
    async function carregarViagens(forcarOnline = false) {
      try {
        console.log(`🚛 Carregando viagens do motorista #${idMotorista}...`);
        
        let resultado;
        
        if (forcarOnline) {
          // Forçar busca online (ignora cache)
          console.log('🔄 Forçando busca online (ignorando cache)...');
          const response = await fetch(`/api/motorista/viagens-andamento/${idMotorista}`, {
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          
          if (response.ok) {
            const dados = await response.json();
            await window.OfflineDB.salvarCache('viagens', {
              dados,
              timestamp: Date.now(),
              url: `/api/motorista/viagens-andamento/${idMotorista}`,
              version: '2.0'
            });
            resultado = { dados, fonte: 'online' };
          } else {
            throw new Error('Erro ao buscar viagens');
          }
        } else {
          // Usar cache normal
          resultado = await fetchComCache(
            `/api/motorista/viagens-andamento/${idMotorista}`,
            'viagens',
            300000
          );
        }

        viagens = resultado.dados;
        console.log(`✅ ${viagens.length} viagens carregadas (fonte: ${resultado.fonte || 'online'})`);
        console.log('📋 IDs das viagens:', viagens.map(v => `#${v.IDVIAGEM}`).join(', '));

        // Verificar URL (se veio de outra página com ?viagem=123)
        const urlParams = new URLSearchParams(window.location.search);
        const viagemParam = urlParams.get('viagem');

        if (viagemParam) {
          const viagem = viagens.find(v => v.IDVIAGEM == viagemParam);
          if (viagem) {
            viagemSelecionada = viagem;
          }
        }

        await renderizarSeletorViagem();
        
      } catch (error) {
        console.error('Erro ao carregar viagens:', error);
        mostrarToast('Erro ao carregar suas viagens', 'error');
      }
    }

    // Renderizar seletor de viagem
    async function renderizarSeletorViagem() {
      const selector = document.getElementById('viagemSelector');

      if (viagens.length === 0) {
        selector.innerHTML = `
          <div style="text-align: center; color: #dc3545; padding: 20px;">
            <div style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
            <div style="font-size: 16px; font-weight: 600;">Nenhuma viagem em andamento</div>
            <div style="font-size: 14px; color: #666; margin-top: 8px;">
              Você precisa ter uma viagem ativa para registrar macros
            </div>
          </div>
        `;
        return;
      }

      // Se só tem 1 viagem, selecionar automaticamente
      if (viagens.length === 1 && !viagemSelecionada) {
        viagemSelecionada = viagens[0];
      }

      // Se tem mais de 1, mostrar select
      if (viagens.length > 1) {
        selector.innerHTML = `
          <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #94a3b8; margin-bottom: 6px;">Selecione a viagem</div>
          <select id="selectViagem" onchange="selecionarViagem()" class="viagem-select">
            <option value="">— Escolha uma viagem —</option>
            ${viagens.map(v => `
              <option value="${v.IDVIAGEM}" ${viagemSelecionada?.IDVIAGEM === v.IDVIAGEM ? 'selected' : ''}>
                #${v.IDVIAGEM} · ${v.ROTEIRO || 'Sem roteiro'}
              </option>
            `).join('')}
          </select>
        `;
      } else {
        // Só 1 viagem, mostrar info
        selector.innerHTML = `
          <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #94a3b8; margin-bottom: 4px;">Viagem atual</div>
          <div style="font-size: 14px; font-weight: 500; color: #334155;">
            #${viagemSelecionada.IDVIAGEM} · ${viagemSelecionada.ROTEIRO || 'Sem roteiro'}
          </div>
        `;
      }

      // Se tem viagem selecionada, carregar histórico
      if (viagemSelecionada) {
        await carregarHistorico(viagemSelecionada.IDVIAGEM);
        renderizarMacros();
      }
    }

    async function selecionarViagem() {
      const select = document.getElementById('selectViagem');
      const idViagem = select.value;

      if (!idViagem) {
        viagemSelecionada = null;
        renderizarMacros(); // Esconde os botões
        return;
      }

      viagemSelecionada = viagens.find(v => v.IDVIAGEM == idViagem);
      
      if (viagemSelecionada) {
        mostrarToast(`Viagem #${viagemSelecionada.IDVIAGEM} selecionada`, 'success');
        
        // AGUARDAR histórico carregar ANTES de renderizar
        await carregarHistorico(viagemSelecionada.IDVIAGEM);
        renderizarMacros();
      }
    }

    // Carregar macros
    async function carregarMacros() {
      try {
        const resultado = await fetchComCache(
          '/api/motorista/macros',
          'macros',
          600000
        );

        macros = resultado.dados;
        console.log('✅ Macros carregadas:', macros.length);
        
        document.getElementById('loading').style.display = 'none';
        renderizarMacros();
        
      } catch (error) {
        console.error('Erro ao carregar macros:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #dc3545; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">
              Erro ao carregar macros
            </div>
            <div style="font-size: 14px; color: #666; margin-bottom: 20px;">
              Verifique se a tabela TIPOOCORRENCIA foi criada no banco de dados
            </div>
            <button class="btn-primary" onclick="location.reload()">
              🔄 Tentar Novamente
            </button>
          </div>
        `;
      }
    }

    // Ícone Boxicons por tipo (visual mais neutro)
    function getMacroIconClass(macro) {
      const s = (macro.FGSITUACAO || macro.fgsituacao || '').toUpperCase().trim();
      const seq = macro.SEQ != null ? macro.SEQ : macro.seq;
      const desc = (macro.DSTIPOOCORRENCIA || macro.dstipocorrencia || '').toLowerCase();
      if (s === 'T') return seq === 2 ? 'bx-refresh' : 'bx-play-circle';
      if (s === 'F') return 'bx-flag';
      if (s === 'C') return seq === 1 ? 'bx-map-pin' : seq === 2 ? 'bx-package' : 'bx-check-circle';
      if (s === 'D') return seq === 1 ? 'bx-map-pin' : seq === 2 ? 'bx-upload' : 'bx-check-circle';
      if (s === 'P') {
        if (desc.includes('abastecimento')) return 'bx-gas-pump';
        if (desc.includes('alimentação') || desc.includes('banheiro')) return 'bx-bowl-rice';
        if (desc.includes('manutenção')) return 'bx-wrench';
        if (desc.includes('fiscal') || desc.includes('polícia') || desc.includes('retido')) return 'bx-shield-alt';
        if (desc.includes('descanso') || desc.includes('pernoite')) return 'bx-bed';
        return 'bx-stop-circle';
      }
      return 'bx-circle';
    }

    // Ordem e rótulos das categorias (FGSITUACAO) + ícone para o divisor
    const CATEGORIAS = [
      { id: 'T', titulo: 'Partida', icon: 'bx-play-circle' },
      { id: 'P', titulo: 'Paradas', icon: 'bx-stop-circle' },
      { id: 'C', titulo: 'Carregamento', icon: 'bx-package' },
      { id: 'D', titulo: 'Descarga', icon: 'bx-upload' },
      { id: 'F', titulo: 'Final', icon: 'bx-flag' }
    ];

    // Renderizar macros agrupadas por categoria
    function renderizarMacros() {
      const container = document.getElementById('macrosContainer');
      
      if (!viagemSelecionada) {
        container.style.display = 'none';
        return;
      }

      container.innerHTML = '';
      container.style.display = 'block';

      const situacao = (m) => (m.FGSITUACAO || m.fgsituacao || '').toUpperCase().trim();
      const seq = (m) => (m.SEQ != null ? m.SEQ : m.seq);

      CATEGORIAS.forEach(cat => {
        const itens = macros.filter(m => situacao(m) === cat.id);
        if (itens.length === 0) return;

        const sec = document.createElement('div');
        sec.className = 'macro-categoria';
        sec.innerHTML = `
          <div class="macro-divisor">
            <span class="macro-divisor-icon bx ${cat.icon}"></span>
            <span class="macro-divisor-text">${cat.titulo}</span>
          </div>
          <div class="macro-list"></div>
        `;
        const list = sec.querySelector('.macro-list');

        itens.sort((a, b) => {
          const sa = seq(a), sb = seq(b);
          if (sa !== sb) return sa - sb;
          return (a.CDTIPOOCORRENCIA || a.cdtipocorrencia || 0) - (b.CDTIPOOCORRENCIA || b.cdtipocorrencia || 0);
        });

        itens.forEach(macro => {
          const validacao = validarSequencia(macro);
          const btn = document.createElement('button');
          btn.className = 'macro-btn';
          if (historico.some(h => (h.CDTIPOOCORRENCIA || h.cdtipocorrencia) === (macro.CDTIPOOCORRENCIA || macro.cdtipocorrencia))) btn.classList.add('macro-done');
          btn.disabled = !validacao.valido;
          btn.onclick = () => selecionarMacro(macro);
          const jaRegistrada = historico.some(h => (h.CDTIPOOCORRENCIA || h.cdtipocorrencia) === (macro.CDTIPOOCORRENCIA || macro.cdtipocorrencia));
          const nome = macro.DSTIPOOCORRENCIA || macro.dstipocorrencia || 'Macro';
          const iconClass = getMacroIconClass(macro);
          const statusIcon = jaRegistrada ? 'bx-check' : (!validacao.valido ? 'bx-lock-alt' : 'bx-chevron-right');
          btn.innerHTML = `
            <span class="macro-icon-wrap bx ${iconClass}"></span>
            <span class="macro-label">${nome}</span>
            <span class="macro-status bx ${statusIcon}"></span>
          `;
          list.appendChild(btn);
        });

        container.appendChild(sec);
      });
    }

    // Carregar histórico
    async function carregarHistorico(idViagem) {
      // Resetar histórico ao trocar de viagem
      historico = [];
      
      // Esconder card de histórico
      const card = document.getElementById('historicoCard');
      card.style.display = 'none';
      
      console.log(`📋 Carregando histórico da viagem #${idViagem}...`);
      
      try {
        const response = await fetch(`/api/motorista/historico-macros/${idViagem}`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });

        if (response.ok) {
          let raw = await response.json();
          // Ordenar por data/hora DESC e por ID DESC: mesma data = desempate por ID (última registrada = primeira)
          historico = [...raw].sort((a, b) => {
            const da = new Date(a.DTOCORRENCIA || a.dtocorrencia || 0).getTime();
            const db = new Date(b.DTOCORRENCIA || b.dtocorrencia || 0).getTime();
            if (db !== da) return db - da;
            const ia = a.IDVIAGEM_OCORRENCIA ?? a.idviagem_ocorrencia ?? 0;
            const ib = b.IDVIAGEM_OCORRENCIA ?? b.idviagem_ocorrencia ?? 0;
            return Number(ib) - Number(ia);
          });
          console.log(`📋 Histórico carregado: ${historico.length} macros para viagem #${idViagem}`);
          console.log(`📋 Macros:`, historico.map(h => h.DSTIPOOCORRENCIA || h.dstipocorrencia).join(', '));
          
          if (historico.length > 0) {
            card.style.display = 'block';
            const lista = document.getElementById('historicoLista');
            lista.innerHTML = historico.map(h => `
              <div class="historico-item">
                <span class="historico-texto">${h.DSTIPOOCORRENCIA || h.dstipocorrencia || 'Ocorrência'}</span>
                <span class="historico-hora">${formatarData(h.DTOCORRENCIA || h.dtocorrencia)}</span>
              </div>
            `).join('');
          } else {
            console.log(`📋 Viagem #${idViagem} sem macros registradas`);
          }
          
          renderizarMacros();
        } else {
          // Erro no servidor, mas não quebra a página
          console.warn(`⚠️ Histórico não disponível para viagem #${idViagem}`);
          historico = [];
        }
      } catch (error) {
        // Silencioso - histórico é opcional
        console.warn(`⚠️ Erro ao carregar histórico da viagem #${idViagem}:`, error.message);
        historico = [];
      }
    }

    var TZ_MACRO_HISTORICO = 'America/Sao_Paulo';

    function formatarData(data) {
      if (!data) return '-';
      try {
        return new Date(data).toLocaleString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          timeZone: TZ_MACRO_HISTORICO
        });
      } catch (e) {
        return new Date(data).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      }
    }

    // Normalizar chaves do histórico (PostgreSQL pode retornar minúsculas; SEQ como número)
    function norm(h) {
      const seqRaw = h.SEQ != null ? h.SEQ : h.seq;
      return {
        FGSITUACAO: (h.FGSITUACAO || h.fgsituacao || '').toUpperCase().trim(),
        SEQ: seqRaw != null ? Number(seqRaw) : null,
        CDTIPOOCORRENCIA: h.CDTIPOOCORRENCIA != null ? h.CDTIPOOCORRENCIA : h.cdtipocorrencia
      };
    }

    // Validar sequência (regras por FGSITUACAO + SEQ)
    function validarSequencia(macro) {
      const s = (macro.FGSITUACAO || macro.fgsituacao || '').toUpperCase().trim();
      const seqMacro = macro.SEQ != null ? macro.SEQ : macro.seq;

      // Viagem encerrada só quando existir macro "Viagem - Fim" (FGSITUACAO F, SEQ 1). C = Carregamento (fase normal), não encerra.
      if (historico.some(h => { const x = norm(h); return x.FGSITUACAO === 'F' && x.SEQ === 1; })) {
        return { valido: false, mensagem: 'Viagem encerrada. Não é permitido registrar mais macros.' };
      }

      // Sem histórico: só permite T, SEQ 1 (Início de viagem)
      if (historico.length === 0) {
        const valido = s === 'T' && seqMacro === 1;
        return valido ? { valido: true } : { valido: false, mensagem: 'Primeira macro deve ser: Início de viagem' };
      }

      // historico já vem ordenado: mais recente primeiro (DESC por DTOCORRENCIA + ID)
      const ultima = norm(historico[0]);

      // T, SEQ 1 (Início de viagem): só uma vez na viagem — se já existe no histórico, desabilitar
      if (s === 'T' && seqMacro === 1) {
        const jaInicio = historico.some(h => norm(h).FGSITUACAO === 'T' && norm(h).SEQ === 1);
        return jaInicio ? { valido: false, mensagem: 'Início de viagem já registrado' } : { valido: true };
      }

      // T, SEQ 2 (Reinício): só quando última for P ou (C/D com SEQ 3)
      if (s === 'T' && seqMacro === 2) {
        const ok = ultima.FGSITUACAO === 'P' || (ultima.FGSITUACAO === 'C' && ultima.SEQ === 3) || (ultima.FGSITUACAO === 'D' && ultima.SEQ === 3);
        return ok ? { valido: true } : { valido: false, mensagem: 'Reinício só após parada ou fim de carga/descarga' };
      }

      // P (Paradas): só quando última for T
      if (s === 'P') {
        return ultima.FGSITUACAO === 'T' ? { valido: true } : { valido: false, mensagem: 'Parada só após Partida (T)' };
      }

      // C, SEQ 1 (Chegada carga): só quando última for T (em trânsito — Início ou Reinício)
      if (s === 'C' && seqMacro === 1) {
        return ultima.FGSITUACAO === 'T' ? { valido: true } : { valido: false, mensagem: 'Chegada ao carregamento só quando estiver em trânsito (Partida T)' };
      }
      // C, SEQ 2: só quando última for C, SEQ 1
      if (s === 'C' && seqMacro === 2) {
        return ultima.FGSITUACAO === 'C' && ultima.SEQ === 1 ? { valido: true } : { valido: false, mensagem: 'Registre a chegada ao carregamento primeiro' };
      }
      // C, SEQ 3: só quando última for C, SEQ 2
      if (s === 'C' && seqMacro === 3) {
        return ultima.FGSITUACAO === 'C' && ultima.SEQ === 2 ? { valido: true } : { valido: false, mensagem: 'Registre o início do carregamento primeiro' };
      }

      // D: só habilitar se já houve ciclo completo de C (pelo menos um C, SEQ 3 no histórico)
      const teveCicloCarga = historico.some(h => norm(h).FGSITUACAO === 'C' && norm(h).SEQ === 3);
      // D, SEQ 1 (Chegada descarga): última T e já teve ciclo de carga
      if (s === 'D' && seqMacro === 1) {
        const ok = ultima.FGSITUACAO === 'T' && teveCicloCarga;
        return ok ? { valido: true } : { valido: false, mensagem: 'Descarga só após Partida e um ciclo completo de carregamento' };
      }
      // D, SEQ 2: só quando última for D, SEQ 1
      if (s === 'D' && seqMacro === 2) {
        return ultima.FGSITUACAO === 'D' && ultima.SEQ === 1 ? { valido: true } : { valido: false, mensagem: 'Registre a chegada à descarga primeiro' };
      }
      // D, SEQ 3: só quando última for D, SEQ 2
      if (s === 'D' && seqMacro === 3) {
        return ultima.FGSITUACAO === 'D' && ultima.SEQ === 2 ? { valido: true } : { valido: false, mensagem: 'Registre o início da descarga primeiro' };
      }

      // F, SEQ 1 (Fim de rota): quando última for T ou D, SEQ 3
      if (s === 'F' && seqMacro === 1) {
        const ok = ultima.FGSITUACAO === 'T' || (ultima.FGSITUACAO === 'D' && ultima.SEQ === 3);
        return ok ? { valido: true } : { valido: false, mensagem: 'Fim de rota só após Partida ou fim da descarga' };
      }

      return { valido: false, mensagem: 'Sequência não permitida' };
    }

    // Selecionar macro
    async function selecionarMacro(macro) {
      if (!viagemSelecionada) {
        mostrarToast('Selecione uma viagem primeiro', 'warning');
        return;
      }

      const opcao = await mostrarModal(
        macro.DSTIPOOCORRENCIA,
        'Deseja registrar esta ocorrência?',
        ['Cancelar', 'Sem Foto', 'Com Foto']
      );

      if (opcao === 'Sem Foto') {
        registrarMacro(macro, null);
      } else if (opcao === 'Com Foto') {
        tirarFoto(macro);
      }
    }

    // Tirar foto
    function tirarFoto(macro) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const base64 = event.target.result.split(',')[1];
            registrarMacro(macro, base64);
          };
          reader.readAsDataURL(file);
        }
      };
      
      input.click();
    }

    // Flag para evitar múltiplos registros simultâneos
    let registrandoMacro = false;
    let ultimaMacroRegistrada = null;
    const TEMPO_MINIMO_ENTRE_MACROS = 2000; // 2 segundos entre macros

    // Registrar macro
    async function registrarMacro(macro, fotoBase64) {
      // Proteção contra múltiplos cliques
      if (registrandoMacro) {
        console.warn('⚠️ Já existe um registro em andamento. Aguarde...');
        mostrarToast('Aguarde... Registro em andamento', 'warning');
        return;
      }

      // Verificar se a mesma macro foi registrada recentemente
      const agora = Date.now();
      if (ultimaMacroRegistrada && 
          ultimaMacroRegistrada.cdTipoOcorrencia === macro.CDTIPOOCORRENCIA &&
          ultimaMacroRegistrada.idViagem === viagemSelecionada.IDVIAGEM &&
          (agora - ultimaMacroRegistrada.timestamp) < TEMPO_MINIMO_ENTRE_MACROS) {
        console.warn('⚠️ Macro duplicada detectada. Aguarde antes de registrar novamente.');
        mostrarToast('Aguarde alguns segundos antes de registrar a mesma macro novamente', 'warning');
        return;
      }

      registrandoMacro = true;
      const loading = mostrarLoading('Capturando GPS...');

      try {
        // Tentar obter GPS (opcional)
        let posicao = null;
        try {
          posicao = await obterGPSCompleto();
          console.log('✅ GPS obtido:', posicao);
        } catch (gpsError) {
          console.warn('⚠️ GPS não disponível:', gpsError.message);
          console.log('📝 Registrando macro SEM GPS');
        }

        loading.querySelector('.loading-text').textContent = 'Registrando macro...';

        const payload = {
          idViagem: viagemSelecionada.IDVIAGEM,
          cdMotorista: idMotorista,
          cdTipoOcorrencia: macro.CDTIPOOCORRENCIA,
          dtoCorrencia: new Date().toISOString(),
          latitude: posicao?.latitude || null,
          longitude: posicao?.longitude || null,
          altitude: posicao?.altitude || null,
          precisao: posicao?.precisao || null,
          velocidade: posicao?.velocidade || null,
          status: posicao?.status || 'P',
          direcao: posicao?.direcao || null,
          fotoBase64: fotoBase64
        };

        const resultado = await postComFila('/api/motorista/macro', payload, 'macro');
        
        // Registrar timestamp da última macro
        ultimaMacroRegistrada = {
          cdTipoOcorrencia: macro.CDTIPOOCORRENCIA,
          idViagem: viagemSelecionada.IDVIAGEM,
          timestamp: agora
        };

        esconderLoading();

        if (resultado.online) {
          let mensagem = `✅ ${macro.DSTIPOOCORRENCIA}`;
          
          if (posicao) {
            mensagem += `\n📍 ${posicao.statusTexto}\n🚗 ${posicao.velocidade || 0} km/h`;
          } else {
            mensagem += `\n📍 Sem GPS`;
          }
          
          if (fotoBase64) {
            mensagem += '\n📸 Com foto';
          }
          
          mostrarToast(mensagem, 'success');
        } else {
          mostrarToast(
            `💾 ${macro.DSTIPOOCORRENCIA} salva!\nSerá enviada quando houver conexão`,
            'warning'
          );
        }
        
        await carregarHistorico(viagemSelecionada.IDVIAGEM);
        await atualizarStatusBar();
        
      } catch (error) {
        console.error('Erro:', error);
        esconderLoading();
        mostrarToast(error.message || 'Erro ao registrar macro', 'error');
      } finally {
        // Liberar flag após um pequeno delay para evitar cliques muito rápidos
        setTimeout(() => {
          registrandoMacro = false;
        }, 1000);
      }
    }

    async function obterGPSCompleto() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('GPS não disponível'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const coords = position.coords;
            const velocidadeKmH = coords.speed !== null ? (coords.speed * 3.6).toFixed(2) : null;
            const status = !velocidadeKmH || parseFloat(velocidadeKmH) < 5 ? 'P' : 'M';

            resolve({
              latitude: coords.latitude.toFixed(7),
              longitude: coords.longitude.toFixed(7),
              altitude: coords.altitude ? coords.altitude.toFixed(2) : null,
              velocidade: velocidadeKmH,
              direcao: coords.heading !== null ? coords.heading.toFixed(2) : null,
              precisao: coords.accuracy ? coords.accuracy.toFixed(2) : null,
              status: status,
              statusTexto: status === 'P' ? 'Parado' : 'Em Movimento'
            });
          },
          (error) => reject(new Error('Erro ao obter GPS')),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }
  </script>
