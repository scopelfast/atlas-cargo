<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Motorista</title>
  <script>
    (function(){ try { if (localStorage.getItem('temaPadraoClaro') !== '1') { localStorage.setItem('tema', 'claro'); localStorage.setItem('temaPadraoClaro', '1'); } var t = localStorage.getItem('tema'); if (t == null || t === '' || t === 'auto') t = 'claro'; var dark = t === 'escuro'; document.documentElement.classList.toggle('tema-escuro', !!dark); document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); document.documentElement.style.colorScheme = dark ? 'dark' : 'light'; } catch(e) { document.documentElement.classList.remove('tema-escuro'); document.documentElement.setAttribute('data-theme', 'light'); document.documentElement.style.colorScheme = 'light'; } })();
  </script>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body.page-recuperar-senha {
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      background: var(--app-bg);
      color: var(--app-text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
    }

    html[data-theme="dark"] body.page-recuperar-senha,
    html.tema-escuro body.page-recuperar-senha {
      background: var(--app-bg);
    }

    .page-recuperar-senha .container {
      background: var(--app-card);
      color: var(--app-text);
      border: 1px solid var(--app-card-border);
      border-radius: var(--radius-card, 20px);
      box-shadow: var(--shadow-lg);
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
    }

    .page-recuperar-senha .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-recuperar-senha .logo-icon {
      font-size: 60px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .page-recuperar-senha h1 {
      font-size: var(--font-size-2xl, 24px);
      font-weight: var(--font-weight-bold, 700);
      color: var(--app-text);
      margin-bottom: 10px;
      text-align: center;
    }

    .page-recuperar-senha .subtitle {
      font-size: var(--font-size-sm, 14px);
      color: var(--app-text-secondary);
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .page-recuperar-senha .modo-login {
      display: flex;
      gap: 8px;
      margin: 0 0 16px;
    }
    .page-recuperar-senha .modo-login .btn-modo {
      flex: 1;
      min-height: 40px;
      padding: 8px 6px;
      border-radius: 999px;
      border: 1px solid #e7e3da;
      background: #fff;
      color: #5d594f;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
    }
    .page-recuperar-senha .modo-login .btn-modo[aria-pressed="true"] {
      background: #506d48;
      color: #fff;
      border-color: #506d48;
    }
    html[data-theme="dark"] .page-recuperar-senha .modo-login .btn-modo,
    html.tema-escuro .page-recuperar-senha .modo-login .btn-modo {
      background: #272620;
      border-color: #33312a;
      color: #f5f4ef;
    }
    html[data-theme="dark"] .page-recuperar-senha .modo-login .btn-modo[aria-pressed="true"],
    html.tema-escuro .page-recuperar-senha .modo-login .btn-modo[aria-pressed="true"] {
      background: #82a077;
      border-color: #82a077;
      color: #161510;
    }

    .page-recuperar-senha .form-group {
      margin-bottom: 20px;
    }

    .page-recuperar-senha label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--app-text);
      margin-bottom: 8px;
    }

    .page-recuperar-senha input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--app-input-border);
      border-radius: var(--radius-sm, 10px);
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--app-input-bg);
      color: var(--app-input-text);
    }

    .page-recuperar-senha input::placeholder {
      color: var(--app-input-placeholder);
    }

    .page-recuperar-senha input:focus {
      outline: none;
      border-color: var(--app-input-focus);
      box-shadow: 0 0 0 3px var(--app-accent-muted, rgba(13, 148, 136, 0.2));
    }

    .page-recuperar-senha .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm, 10px);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      margin-bottom: 12px;
    }

    /* Antes: fundo cinza-claro + color:white → ilegível em claro e escuro */
    .page-recuperar-senha .btn-primary {
      background: linear-gradient(135deg, var(--app-primary-dark) 0%, var(--app-primary) 55%, var(--app-primary-hover) 100%);
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .page-recuperar-senha .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: var(--shadow-md);
    }

    .page-recuperar-senha .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .page-recuperar-senha .btn-secondary {
      background: var(--gray-100);
      color: var(--app-text-secondary);
      border: 1px solid var(--app-card-border);
    }

    .page-recuperar-senha .btn-secondary:hover {
      background: var(--gray-200);
      color: var(--app-text);
    }

    html[data-theme="dark"] .page-recuperar-senha .btn-secondary,
    html.tema-escuro .page-recuperar-senha .btn-secondary {
      background: var(--gray-200);
      color: var(--app-text);
    }

    html[data-theme="dark"] .page-recuperar-senha .btn-secondary:hover,
    html.tema-escuro .page-recuperar-senha .btn-secondary:hover {
      background: var(--gray-300);
    }

    .page-recuperar-senha .info-box {
      background: var(--info-bg);
      padding: 15px;
      border-radius: var(--radius-sm, 10px);
      margin-top: 20px;
      font-size: 13px;
      color: var(--app-primary);
      border: 1px solid var(--app-card-border);
      line-height: 1.5;
    }

    .page-recuperar-senha .info-box strong {
      color: var(--app-primary);
    }

    .page-recuperar-senha .success-message {
      background: var(--success-bg);
      color: var(--success);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid transparent;
    }

    .page-recuperar-senha .error-message {
      background: var(--error-bg);
      color: var(--error);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid transparent;
    }

    html[data-theme="dark"] .page-recuperar-senha .success-message,
    html.tema-escuro .page-recuperar-senha .success-message {
      color: #6ee7b7;
      border-color: rgba(110, 231, 183, 0.35);
    }

    html[data-theme="dark"] .page-recuperar-senha .error-message,
    html.tema-escuro .page-recuperar-senha .error-message {
      color: #fca5a5;
      border-color: rgba(252, 165, 165, 0.35);
    }

    .page-recuperar-senha .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .page-recuperar-senha .loading p {
      margin-top: 15px;
      color: var(--app-text-muted);
    }

    .page-recuperar-senha .spinner {
      border: 4px solid var(--gray-200);
      border-top: 4px solid var(--app-primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="motorista-page page-recuperar-senha">
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <h1 data-i18n="recuperarSenha.titulo">Recuperar Senha</h1>
      <div class="subtitle" data-i18n="recuperarSenha.descricao">Escolha CPF, CNPJ ou celular. O código vai no WhatsApp.</div>
    </div>

    <div id="successMessage" class="success-message"></div>
    <div id="errorMessage" class="error-message"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Processando...</p>
    </div>

    <form id="formRecuperar" style="display: block;">
      <div class="modo-login" role="group" aria-label="Como recuperar">
        <button type="button" class="btn-modo" data-modo="celular" aria-pressed="false">Celular</button>
        <button type="button" class="btn-modo" data-modo="cpf" aria-pressed="true">CPF</button>
        <button type="button" class="btn-modo" data-modo="cnpj" aria-pressed="false">CNPJ</button>
      </div>
      <div class="form-group">
        <label for="identificacao" id="labelIdentificacao">CPF</label>
        <input 
          type="tel" 
          id="identificacao" 
          placeholder="000.000.000-00"
          required
          inputmode="numeric"
          maxlength="14"
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        📧 <span data-i18n="recuperarSenha.enviarCodigo">Enviar código</span>
      </button>

      <button type="button" class="btn btn-secondary" onclick="voltar()">
        ← <span data-i18n="common.voltar">Voltar</span>
      </button>

      <div class="info-box">
        💡 <strong>Dica:</strong> O código vai no WhatsApp do celular cadastrado.
      </div>
    </form>

    <form id="formCodigo" style="display: none;">
      <div class="form-group">
        <label for="codigo">Código de Verificação</label>
        <input 
          type="text" 
          id="codigo" 
          placeholder="Digite o código recebido"
          required
          maxlength="6"
        >
      </div>

      <div class="form-group">
        <label for="novaSenha">Nova Senha</label>
        <input 
          type="password" 
          id="novaSenha" 
          placeholder="Digite a nova senha"
          autocomplete="new-password"
          required
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <input 
          type="password" 
          id="confirmarSenha" 
          placeholder="Digite novamente a senha"
          autocomplete="new-password"
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        ✅ Redefinir Senha
      </button>

      <button type="button" class="btn btn-secondary" onclick="voltar()">
        ← Voltar para Login
      </button>
    </form>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js?v=20261125claro"></script>
  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) { var k = el.getAttribute('data-i18n'); if (k) el.textContent = window.t(k); });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el) { var k = el.getAttribute('data-i18n-title'); if (k) el.title = window.t(k); });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);

    var modoRecuperar = 'cpf';
    function mascaraCpf(d) {
      d = String(d || '').replace(/\D/g, '').slice(0, 11);
      if (d.length > 9) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      if (d.length > 6) return d.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      if (d.length > 3) return d.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      return d;
    }
    function mascaraCnpj(d) {
      d = String(d || '').replace(/\D/g, '').slice(0, 14);
      return d.replace(/^(\d{2})(\d{0,3})(\d{0,3})(\d{0,4})(\d{0,2}).*/, function(_, a, b, c, e, f) {
        var s = a;
        if (b) s += '.' + b;
        if (c) s += '.' + c;
        if (e) s += '/' + e;
        if (f) s += '-' + f;
        return s;
      });
    }
    function mascaraCelular(d) {
      d = String(d || '').replace(/\D/g, '').slice(0, 11);
      if (d.length > 10) return d.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
      if (d.length > 6) return d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
      if (d.length > 2) return d.replace(/(\d{2})(\d{0,5})/, '($1) $2');
      return d;
    }
    function aplicarModoRecuperar(modo) {
      modoRecuperar = modo;
      var rotulos = {
        celular: ['Celular', '(00) 00000-0000', 16],
        cpf: ['CPF', '000.000.000-00', 14],
        cnpj: ['CNPJ', '00.000.000/0000-00', 18]
      };
      document.querySelectorAll('.modo-login .btn-modo').forEach(function(btn) {
        btn.setAttribute('aria-pressed', btn.getAttribute('data-modo') === modo ? 'true' : 'false');
      });
      var r = rotulos[modo];
      var label = document.getElementById('labelIdentificacao');
      var input = document.getElementById('identificacao');
      if (label) label.textContent = r[0];
      if (input) {
        input.placeholder = r[1];
        input.maxLength = r[2];
        input.value = '';
      }
    }
    document.querySelectorAll('.modo-login .btn-modo').forEach(function(btn) {
      btn.addEventListener('click', function() { aplicarModoRecuperar(btn.getAttribute('data-modo')); });
    });
    var campoId = document.getElementById('identificacao');
    if (campoId) {
      campoId.addEventListener('input', function() {
        var d = campoId.value.replace(/\D/g, '');
        if (modoRecuperar === 'celular') campoId.value = mascaraCelular(d);
        else if (modoRecuperar === 'cnpj') campoId.value = mascaraCnpj(d);
        else campoId.value = mascaraCpf(d);
      });
    }

    function voltar() {
      window.location.href = '../index.html';
    }

    function mostrarMensagem(tipo, mensagem) {
      const successDiv = document.getElementById('successMessage');
      const errorDiv = document.getElementById('errorMessage');
      
      successDiv.style.display = 'none';
      errorDiv.style.display = 'none';
      
      if (tipo === 'success') {
        successDiv.textContent = mensagem;
        successDiv.style.display = 'block';
      } else {
        errorDiv.textContent = mensagem;
        errorDiv.style.display = 'block';
      }
    }

    document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identificacao = document.getElementById('identificacao').value;
      const loading = document.getElementById('loading');
      const form = document.getElementById('formRecuperar');
      
      loading.style.display = 'block';
      form.style.display = 'none';
      
      try {
        const response = await fetch('/api/motorista/recuperar-senha', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ identificacao, tipo: modoRecuperar }),
        });

        const data = await response.json();
        
        loading.style.display = 'none';
        
        if (response.ok) {
          mostrarMensagem('success', data.message || 'Se o cadastro existir, o código foi para o WhatsApp do celular cadastrado.');
          document.getElementById('formCodigo').style.display = 'block';
        } else {
          form.style.display = 'block';
          const msg = (data.errorKey && typeof window.t === 'function') ? window.t(data.errorKey) : (data.error || 'Erro ao enviar código');
          mostrarMensagem('error', msg);
        }
      } catch (error) {
        loading.style.display = 'none';
        form.style.display = 'block';
        mostrarMensagem('error', (typeof window.t === 'function' && window.t('common.erro')) ? window.t('common.erro') + '. ' + (window.t('common.tentarNovamente') || 'Tente novamente.') : 'Erro de conexão. Tente novamente.');
      }
    });

    document.getElementById('formCodigo').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identificacao = document.getElementById('identificacao').value;
      const codigo = document.getElementById('codigo').value;
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      
      if (novaSenha !== confirmarSenha) {
        mostrarMensagem('error', '❌ As senhas não coincidem');
        return;
      }
      
      if (novaSenha.length < 6) {
        mostrarMensagem('error', '❌ A senha deve ter pelo menos 6 caracteres');
        return;
      }
      
      const loading = document.getElementById('loading');
      const form = document.getElementById('formCodigo');
      
      loading.style.display = 'block';
      form.style.display = 'none';
      
      try {
        const response = await fetch('/api/motorista/redefinir-senha', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ identificacao, codigo, novaSenha, tipo: modoRecuperar }),
        });

        const data = await response.json();
        
        loading.style.display = 'none';
        
        if (response.ok) {
          mostrarMensagem('success', '✅ Senha redefinida com sucesso! Redirecionando...');
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 2000);
        } else {
          form.style.display = 'block';
          const msg = (data.errorKey && typeof window.t === 'function') ? window.t(data.errorKey) : (data.error || 'Erro ao redefinir senha');
          mostrarMensagem('error', msg);
        }
      } catch (error) {
        loading.style.display = 'none';
        form.style.display = 'block';
        mostrarMensagem('error', (typeof window.t === 'function' && window.t('common.erro')) ? window.t('common.erro') + '. ' + (window.t('common.tentarNovamente') || 'Tente novamente.') : 'Erro de conexão. Tente novamente.');
      }
    });
  </script>
</body>
</html>
