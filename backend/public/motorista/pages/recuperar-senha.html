<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Motorista</title>
  <script>
    (function(){ try { var t = localStorage.getItem('tema'); if (t == null || t === '') t = 'auto'; var dark = t === 'escuro' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.classList.toggle('tema-escuro', !!dark); document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); document.documentElement.style.colorScheme = dark ? 'dark' : 'light'; } catch(e) { var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)'); if (m) { document.documentElement.classList.toggle('tema-escuro', m.matches); document.documentElement.setAttribute('data-theme', m.matches ? 'dark' : 'light'); document.documentElement.style.colorScheme = m.matches ? 'dark' : 'light'; } } })();
  </script>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body.page-recuperar-senha {
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      background: var(--app-bg);
      color: var(--app-text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
    }

    html[data-theme="dark"] body.page-recuperar-senha,
    html.tema-escuro body.page-recuperar-senha {
      background: var(--app-bg);
    }

    .page-recuperar-senha .container {
      background: var(--app-card);
      color: var(--app-text);
      border: 1px solid var(--app-card-border);
      border-radius: var(--radius-card, 20px);
      box-shadow: var(--shadow-lg);
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
    }

    .page-recuperar-senha .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-recuperar-senha .logo-icon {
      font-size: 60px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .page-recuperar-senha h1 {
      font-size: var(--font-size-2xl, 24px);
      font-weight: var(--font-weight-bold, 700);
      color: var(--app-text);
      margin-bottom: 10px;
      text-align: center;
    }

    .page-recuperar-senha .subtitle {
      font-size: var(--font-size-sm, 14px);
      color: var(--app-text-secondary);
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .page-recuperar-senha .form-group {
      margin-bottom: 20px;
    }

    .page-recuperar-senha label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--app-text);
      margin-bottom: 8px;
    }

    .page-recuperar-senha input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--app-input-border);
      border-radius: var(--radius-sm, 10px);
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--app-input-bg);
      color: var(--app-input-text);
    }

    .page-recuperar-senha input::placeholder {
      color: var(--app-input-placeholder);
    }

    .page-recuperar-senha input:focus {
      outline: none;
      border-color: var(--app-input-focus);
      box-shadow: 0 0 0 3px var(--app-accent-muted, rgba(13, 148, 136, 0.2));
    }

    .page-recuperar-senha .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm, 10px);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      margin-bottom: 12px;
    }

    /* Antes: fundo cinza-claro + color:white → ilegível em claro e escuro */
    .page-recuperar-senha .btn-primary {
      background: linear-gradient(135deg, var(--app-primary-dark) 0%, var(--app-primary) 55%, var(--app-primary-hover) 100%);
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .page-recuperar-senha .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: var(--shadow-md);
    }

    .page-recuperar-senha .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .page-recuperar-senha .btn-secondary {
      background: var(--gray-100);
      color: var(--app-text-secondary);
      border: 1px solid var(--app-card-border);
    }

    .page-recuperar-senha .btn-secondary:hover {
      background: var(--gray-200);
      color: var(--app-text);
    }

    html[data-theme="dark"] .page-recuperar-senha .btn-secondary,
    html.tema-escuro .page-recuperar-senha .btn-secondary {
      background: var(--gray-200);
      color: var(--app-text);
    }

    html[data-theme="dark"] .page-recuperar-senha .btn-secondary:hover,
    html.tema-escuro .page-recuperar-senha .btn-secondary:hover {
      background: var(--gray-300);
    }

    .page-recuperar-senha .info-box {
      background: var(--info-bg);
      padding: 15px;
      border-radius: var(--radius-sm, 10px);
      margin-top: 20px;
      font-size: 13px;
      color: var(--app-primary);
      border: 1px solid var(--app-card-border);
      line-height: 1.5;
    }

    .page-recuperar-senha .info-box strong {
      color: var(--app-primary);
    }

    .page-recuperar-senha .success-message {
      background: var(--success-bg);
      color: var(--success);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid transparent;
    }

    .page-recuperar-senha .error-message {
      background: var(--error-bg);
      color: var(--error);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid transparent;
    }

    html[data-theme="dark"] .page-recuperar-senha .success-message,
    html.tema-escuro .page-recuperar-senha .success-message {
      color: #6ee7b7;
      border-color: rgba(110, 231, 183, 0.35);
    }

    html[data-theme="dark"] .page-recuperar-senha .error-message,
    html.tema-escuro .page-recuperar-senha .error-message {
      color: #fca5a5;
      border-color: rgba(252, 165, 165, 0.35);
    }

    .page-recuperar-senha .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .page-recuperar-senha .loading p {
      margin-top: 15px;
      color: var(--app-text-muted);
    }

    .page-recuperar-senha .spinner {
      border: 4px solid var(--gray-200);
      border-top: 4px solid var(--app-primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="motorista-page page-recuperar-senha">
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <h1 data-i18n="recuperarSenha.titulo">Recuperar Senha</h1>
      <div class="subtitle" data-i18n="recuperarSenha.descricao">Informe seu e-mail ou documento para receber o código</div>
    </div>

    <div id="successMessage" class="success-message"></div>
    <div id="errorMessage" class="error-message"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Processando...</p>
    </div>

    <form id="formRecuperar" style="display: block;">
      <div class="form-group">
        <label for="identificacao">CPF ou Celular</label>
        <input 
          type="tel" 
          id="identificacao" 
          placeholder="Digite seu CPF ou celular"
          required
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        📧 <span data-i18n="recuperarSenha.enviarCodigo">Enviar código</span>
      </button>

      <button type="button" class="btn btn-secondary" onclick="voltar()">
        ← <span data-i18n="common.voltar">Voltar</span>
      </button>

      <div class="info-box">
        💡 <strong>Dica:</strong> O código será enviado por SMS para o celular cadastrado ou por email.
      </div>
    </form>

    <form id="formCodigo" style="display: none;">
      <div class="form-group">
        <label for="codigo">Código de Verificação</label>
        <input 
          type="text" 
          id="codigo" 
          placeholder="Digite o código recebido"
          required
          maxlength="6"
        >
      </div>

      <div class="form-group">
        <label for="novaSenha">Nova Senha</label>
        <input 
          type="password" 
          id="novaSenha" 
          placeholder="Digite a nova senha"
          autocomplete="new-password"
          required
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <input 
          type="password" 
          id="confirmarSenha" 
          placeholder="Digite novamente a senha"
          autocomplete="new-password"
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        ✅ Redefinir Senha
      </button>

      <button type="button" class="btn btn-secondary" onclick="voltar()">
        ← Voltar para Login
      </button>
    </form>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) { var k = el.getAttribute('data-i18n'); if (k) el.textContent = window.t(k); });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el) { var k = el.getAttribute('data-i18n-title'); if (k) el.title = window.t(k); });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);
    function voltar() {
      window.location.href = '../index.html';
    }

    function mostrarMensagem(tipo, mensagem) {
      const successDiv = document.getElementById('successMessage');
      const errorDiv = document.getElementById('errorMessage');
      
      successDiv.style.display = 'none';
      errorDiv.style.display = 'none';
      
      if (tipo === 'success') {
        successDiv.textContent = mensagem;
        successDiv.style.display = 'block';
      } else {
        errorDiv.textContent = mensagem;
        errorDiv.style.display = 'block';
      }
    }

    document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identificacao = document.getElementById('identificacao').value;
      const loading = document.getElementById('loading');
      const form = document.getElementById('formRecuperar');
      
      loading.style.display = 'block';
      form.style.display = 'none';
      
      try {
        const response = await fetch('/api/motorista/recuperar-senha', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ identificacao }),
        });

        const data = await response.json();
        
        loading.style.display = 'none';
        
        if (response.ok) {
          mostrarMensagem('success', '✅ Código enviado com sucesso! Verifique seu celular.');
          document.getElementById('formCodigo').style.display = 'block';
        } else {
          form.style.display = 'block';
          const msg = (data.errorKey && typeof window.t === 'function') ? window.t(data.errorKey) : (data.error || 'Erro ao enviar código');
          mostrarMensagem('error', msg);
        }
      } catch (error) {
        loading.style.display = 'none';
        form.style.display = 'block';
        mostrarMensagem('error', (typeof window.t === 'function' && window.t('common.erro')) ? window.t('common.erro') + '. ' + (window.t('common.tentarNovamente') || 'Tente novamente.') : 'Erro de conexão. Tente novamente.');
      }
    });

    document.getElementById('formCodigo').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identificacao = document.getElementById('identificacao').value;
      const codigo = document.getElementById('codigo').value;
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      
      if (novaSenha !== confirmarSenha) {
        mostrarMensagem('error', '❌ As senhas não coincidem');
        return;
      }
      
      if (novaSenha.length < 6) {
        mostrarMensagem('error', '❌ A senha deve ter pelo menos 6 caracteres');
        return;
      }
      
      const loading = document.getElementById('loading');
      const form = document.getElementById('formCodigo');
      
      loading.style.display = 'block';
      form.style.display = 'none';
      
      try {
        const response = await fetch('/api/motorista/redefinir-senha', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ identificacao, codigo, novaSenha }),
        });

        const data = await response.json();
        
        loading.style.display = 'none';
        
        if (response.ok) {
          mostrarMensagem('success', '✅ Senha redefinida com sucesso! Redirecionando...');
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 2000);
        } else {
          form.style.display = 'block';
          const msg = (data.errorKey && typeof window.t === 'function') ? window.t(data.errorKey) : (data.error || 'Erro ao redefinir senha');
          mostrarMensagem('error', msg);
        }
      } catch (error) {
        loading.style.display = 'none';
        form.style.display = 'block';
        mostrarMensagem('error', (typeof window.t === 'function' && window.t('common.erro')) ? window.t('common.erro') + '. ' + (window.t('common.tentarNovamente') || 'Tente novamente.') : 'Erro de conexão. Tente novamente.');
      }
    });
  </script>
</body>
</html>
