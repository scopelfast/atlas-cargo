<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS - Motorista</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    .config-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .config-item:last-child {
      border-bottom: none;
    }
    
    .config-label {
      flex: 1;
      margin-right: 15px;
    }
    
    .config-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    
    .config-desc {
      font-size: 13px;
      color: #666;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 28px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #28a745;
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    .input-field {
      width: 80px;
      height: 45px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 16px;
      text-align: center;
      background: #f9f9f9;
    }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }
    
    .checkbox {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      cursor: pointer;
    }
    
    .info-box {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    
    .info-box-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    
    .info-box-text {
      font-size: 13px;
      color: #666;
      line-height: 20px;
    }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← <span data-i18n="gps.voltar">Voltar</span></button>
    <h1><i class="bx bx-cog"></i> <span data-i18n="gps.titulo">GPS</span></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online" data-i18n="dashboard.onlineSincronizado">Online - Sincronizado</div>
  </div>

  <div class="container">
    <!-- Status GPS Automático -->
    <div id="statusGPS" style="margin-bottom: 16px;"></div>

    <div class="card">
      <div class="card-body">
        <!-- Toggle -->
        <div class="config-item">
          <div class="config-label">
            <div class="config-title" data-i18n="gps.posicionamentoAutomatico">📍 Posicionamento Automático</div>
            <div class="config-desc" data-i18n="gps.enviarLocalizacaoAutomaticamente">Enviar localização automaticamente</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="gpsAtivo">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Intervalo -->
        <div class="config-item">
          <div class="config-label">
            <div class="config-title" data-i18n="gps.intervaloEnvio">⏱️ Intervalo de Envio</div>
            <div class="config-desc" data-i18n="gps.emMinutos">Em minutos (mínimo 1)</div>
          </div>
          <input type="number" class="input-field" id="intervalo" value="15" min="1" max="999">
        </div>

        <!-- Termos -->
        <div class="checkbox-container" id="termosContainer" style="display: none;">
          <input type="checkbox" class="checkbox" id="aceitoTermos">
          <label for="aceitoTermos" style="flex: 1; font-size: 14px; color: #333; cursor: pointer;" data-i18n="gps.concordoTermos">
            Concordo com os termos de utilização do APP
          </label>
        </div>

        <!-- Info -->
        <div class="info-box">
          <div class="info-box-title" data-i18n="gps.informacoes">ℹ️ Informações:</div>
          <div class="info-box-text">
            <span data-i18n="gps.info1">• O GPS funcionará em segundo plano</span><br>
            <span data-i18n="gps.info2">• Consumo moderado de bateria</span><br>
            <span data-i18n="gps.info3">• Funciona offline (sincroniza depois)</span><br>
            <span data-i18n="gps.info4">• Você pode pausar a qualquer momento</span>
          </div>
        </div>
      </div>
    </div>

    <button class="btn-primary btn-success" onclick="salvar()" data-i18n="gps.salvarConfiguracoes">💾 Salvar Configurações</button>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/gps-auto.js"></script>
  
  <script>
    if (!verificarAuth()) window.location.href = '../index.html';

    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k) el.textContent = window.t(k);
      });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);

    function voltar() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('from') === 'config') {
        window.location.href = 'configuracoes.html';
        return;
      }
      window.location.href = 'dashboard.html';
    }

    // Carregar configurações
    function carregarConfiguracoes() {
      try {
        // Garantir que os elementos existem
        const gpsAtivoEl = document.getElementById('gpsAtivo');
        const intervaloEl = document.getElementById('intervalo');
        const termosEl = document.getElementById('aceitoTermos');
        
        if (!gpsAtivoEl || !intervaloEl || !termosEl) {
          console.warn('⚠️ Elementos do formulário não encontrados, tentando novamente...');
          setTimeout(carregarConfiguracoes, 200);
          return;
        }

        // Carregar do localStorage com valores padrão
        let gpsAtivo = localStorage.getItem('gps_ativo');
        let intervalo = localStorage.getItem('gps_intervalo');
        let termos = localStorage.getItem('gps_termos');
        
        // Se não existir no localStorage, usar valores padrão e salvar
        if (gpsAtivo === null) {
          gpsAtivo = 'false';
          localStorage.setItem('gps_ativo', 'false');
          console.log('📝 Valor padrão para gps_ativo: false');
        }
        
        if (intervalo === null || intervalo === '') {
          intervalo = '900';
          localStorage.setItem('gps_intervalo', '900');
          console.log('📝 Valor padrão para gps_intervalo: 900 (15 min)');
        }
        
        if (termos === null) {
          termos = 'false';
          localStorage.setItem('gps_termos', 'false');
          console.log('📝 Valor padrão para gps_termos: false');
        }

        // Converter para boolean
        const gpsAtivoBool = gpsAtivo === 'true';
        const termosBool = termos === 'true';

        // Aplicar valores aos elementos (localStorage em segundos; input exibe minutos)
        gpsAtivoEl.checked = gpsAtivoBool;
        const intervaloNum = parseInt(intervalo, 10);
        const intervaloEmMinutos = intervaloNum >= 60 ? Math.round(intervaloNum / 60) : (intervaloNum || 15);
        intervaloEl.value = Math.max(1, intervaloEmMinutos);
        termosEl.checked = termosBool;
        
        // Atualizar visibilidade dos termos
        atualizarTermos();
        
        console.log('✅ Configurações GPS carregadas e aplicadas:', { 
          gpsAtivo: gpsAtivoBool, 
          intervalo, 
          termos: termosBool,
          localStorage: {
            gps_ativo: localStorage.getItem('gps_ativo'),
            gps_intervalo: localStorage.getItem('gps_intervalo'),
            gps_termos: localStorage.getItem('gps_termos')
          },
          elementos: {
            gpsAtivoEl_checked: gpsAtivoEl.checked,
            intervaloEl_value: intervaloEl.value,
            termosEl_checked: termosEl.checked
          }
        });
      } catch (error) {
        console.error('❌ Erro ao carregar configurações:', error);
        console.error('Stack:', error.stack);
      }
    }
    
    // Carregar quando o DOM estiver pronto (múltiplas estratégias)
    function iniciarCarregamento() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          setTimeout(carregarConfiguracoes, 100);
        });
      } else {
        // DOM já está pronto
        setTimeout(carregarConfiguracoes, 100);
      }
      
      // Também carregar após delays progressivos para garantir
      setTimeout(carregarConfiguracoes, 300);
      setTimeout(carregarConfiguracoes, 600);
      setTimeout(carregarConfiguracoes, 1000);
    }
    
    iniciarCarregamento();

    function atualizarTermos() {
      const ativo = document.getElementById('gpsAtivo').checked;
      document.getElementById('termosContainer').style.display = ativo ? 'flex' : 'none';
    }

    document.getElementById('gpsAtivo').addEventListener('change', atualizarTermos);
    atualizarTermos();

    // Atualizar status GPS
    function atualizarStatusGPS() {
      const statusDiv = document.getElementById('statusGPS');
      
      if (!statusDiv) {
        console.warn('⚠️ Elemento statusGPS não encontrado');
        return;
      }

      // Verificar se a função existe
      if (typeof obterEstatisticasGPS !== 'function') {
        console.warn('⚠️ obterEstatisticasGPS não está disponível ainda, tentando novamente...');
        // Tentar novamente após um delay
        setTimeout(() => {
          if (typeof obterEstatisticasGPS === 'function') {
            atualizarStatusGPS();
          } else {
            var carregando = typeof window.t === 'function' ? window.t('gps.carregandoEstatisticas') : 'Carregando estatísticas...';
            statusDiv.innerHTML = `
              <div style="background: #fff3cd; padding: 16px; border-radius: 10px; border-left: 4px solid #ffc107; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <div style="font-size: 14px; font-weight: 600; color: #856404;">
                  ⚠️ ` + carregando + `
                </div>
              </div>
            `;
          }
        }, 500);
        return;
      }
      
      let stats;
      try {
        stats = obterEstatisticasGPS();
      } catch (error) {
        console.error('❌ Erro ao obter estatísticas GPS:', error);
        var errStats = typeof window.t === 'function' ? window.t('gps.erroCarregarEstatisticas') : 'Erro ao carregar estatísticas';
        statusDiv.innerHTML = `
          <div style="background: #f8d7da; padding: 16px; border-radius: 10px; border-left: 4px solid #dc3545; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="font-size: 14px; font-weight: 600; color: #721c24;">
              ❌ ` + errStats + `
            </div>
          </div>
        `;
        return;
      }

      if (!stats || !stats.ativo) {
        var gpsDesativado = typeof window.t === 'function' ? window.t('gps.gpsDesativado') : 'GPS Automático Desativado';
        statusDiv.innerHTML = `
          <div style="background: #f5f5f5; padding: 16px; border-radius: 10px; border-left: 4px solid #999; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="font-size: 14px; font-weight: 600; color: #666;">
              ⏸️ ` + gpsDesativado + `
            </div>
          </div>
        `;
        return;
      }

      const agora = new Date();
      const ultimo = stats.ultimoEnvio;
      const proximo = stats.proximoEnvio;

      var t = typeof window.t === 'function' ? window.t : function(k) { return k; };
      let tempoProximo = t('gps.aguarde');
      if (proximo) {
        // Garantir que é um Date válido
        const proximoDate = proximo instanceof Date ? proximo : new Date(proximo);
        
        if (!isNaN(proximoDate.getTime())) {
          const difMs = proximoDate.getTime() - agora.getTime();
          
          if (difMs > 0) {
            const difMin = Math.floor(difMs / 60000);
            const difSeg = Math.floor((difMs % 60000) / 1000);
            
            if (difMin > 0) {
              tempoProximo = difMin + 'min ' + difSeg + 's';
            } else if (difSeg > 0) {
              tempoProximo = difSeg + 's';
            } else {
              tempoProximo = t('gps.agora');
            }
          } else {
            tempoProximo = t('gps.agora');
          }
        }
      }

      // Formatar último envio
      let ultimoFormatado = '';
      if (ultimo) {
        const ultimoDate = ultimo instanceof Date ? ultimo : new Date(ultimo);
        if (!isNaN(ultimoDate.getTime())) {
          ultimoFormatado = ultimoDate.toLocaleTimeString('pt-BR', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
      }

      var lblAtivo = typeof window.t === 'function' ? window.t('gps.gpsAutomaticoAtivo') : 'GPS Automático Ativo';
      var lblCada = (typeof window.t === 'function' ? window.t('gps.enviandoCadaXMinutos') : 'Enviando a cada {{n}} minutos').replace('{{n}}', stats.intervalo || 5);
      var lblTotal = typeof window.t === 'function' ? window.t('gps.totalEnvios') : 'Total de Envios';
      var lblProximo = typeof window.t === 'function' ? window.t('gps.proximoEm') : 'Próximo em';
      var lblUltimo = typeof window.t === 'function' ? window.t('gps.ultimoEnvio') : 'Último envio:';
      statusDiv.innerHTML = `
        <div style="background: linear-gradient(165deg, #061428 0%, #0d2137 50%, #1a365d 100%); padding: 16px; border-radius: 10px; box-shadow: 0 4px 12px rgba(13,33,55,0.3); color: white;">
          <div style="display: flex; align-items: center; margin-bottom: 12px;">
            <div style="font-size: 24px; margin-right: 10px;">📡</div>
            <div style="flex: 1;">
              <div style="font-size: 14px; font-weight: 600;">` + lblAtivo + `</div>
              <div style="font-size: 12px; opacity: 0.9;">` + lblCada + `</div>
            </div>
          </div>
          
          <div style="background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; margin-top: 12px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12px;">
              <div>
                <div style="opacity: 0.8; margin-bottom: 4px;">📊 ` + lblTotal + `</div>
                <div style="font-size: 20px; font-weight: 700;">${stats.contador || 0}</div>
              </div>
              <div>
                <div style="opacity: 0.8; margin-bottom: 4px;">⏱️ ` + lblProximo + `</div>
                <div style="font-size: 20px; font-weight: 700;">${tempoProximo}</div>
              </div>
            </div>
            
            ${ultimoFormatado ? `
              <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 11px; opacity: 0.9;">
                ` + lblUltimo + ` ${ultimoFormatado}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // Atualizar a cada segundo
    setInterval(atualizarStatusGPS, 1000);
    
    // Atualizar imediatamente ao carregar (com delay para garantir que scripts carregaram)
    setTimeout(() => {
      atualizarStatusGPS();
    }, 1000);
    
    // Atualizar novamente após mais tempo para garantir sincronização
    setTimeout(() => {
      atualizarStatusGPS();
    }, 2000);

    // Listener para eventos de GPS
    window.addEventListener('gpsEnviado', (e) => {
      console.log('🎉 GPS enviado!', e.detail);
      atualizarStatusGPS();
      
      // Piscar o indicador
      const statusDiv = document.getElementById('statusGPS');
      if (statusDiv) {
        statusDiv.style.transform = 'scale(1.02)';
        setTimeout(() => {
          statusDiv.style.transform = 'scale(1)';
        }, 300);
      }
    });
    
    // Atualizar quando a página ganhar foco (voltar de outra aba)
    window.addEventListener('focus', () => {
      console.log('🔄 Página ganhou foco, recarregando configurações...');
      setTimeout(() => {
        carregarConfiguracoes(); // Recarregar configurações também
        atualizarStatusGPS();
      }, 100);
    });
    
    // Recarregar configurações quando a página for exibida (visibilidade)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        console.log('🔄 Página ficou visível, recarregando configurações...');
        setTimeout(() => {
          carregarConfiguracoes();
          atualizarStatusGPS();
        }, 100);
      }
    });
    
    // Recarregar periodicamente (a cada 5 segundos) para garantir sincronização
    setInterval(() => {
      const gpsAtivoEl = document.getElementById('gpsAtivo');
      const intervaloEl = document.getElementById('intervalo');
      const termosEl = document.getElementById('aceitoTermos');
      
      if (gpsAtivoEl && intervaloEl && termosEl) {
        const localStorageAtivo = localStorage.getItem('gps_ativo') === 'true';
        const localStorageIntervalo = localStorage.getItem('gps_intervalo') || '900';
        
        // Verificar se há divergência entre localStorage e elementos
        if (gpsAtivoEl.checked !== localStorageAtivo || intervaloEl.value !== localStorageIntervalo) {
          console.warn('⚠️ Divergência detectada entre localStorage e elementos. Recarregando...');
          carregarConfiguracoes();
        }
      }
    }, 5000);

    async function salvar() {
      const ativo = document.getElementById('gpsAtivo').checked;
      const intervaloVal = document.getElementById('intervalo').value;
      const termosAceitos = document.getElementById('aceitoTermos').checked;
      const intervaloMin = Math.max(1, parseInt(intervaloVal, 10) || 15);
      const intervaloEmSegundos = (intervaloMin * 60).toString();

      if (!intervaloVal || parseInt(intervaloVal, 10) < 1) {
        mostrarToast(typeof window.t === 'function' ? window.t('gps.intervaloMinimo') : 'Intervalo deve ser no mínimo 1 minuto', 'error');
        return;
      }

      if (ativo && !termosAceitos) {
        mostrarToast(typeof window.t === 'function' ? window.t('gps.aceitarTermos') : 'Você precisa aceitar os termos de utilização', 'warning');
        return;
      }

      // Salvar configurações (intervalo em segundos para compatibilidade com Configurações e gps-auto)
      try {
        // Salvar no localStorage
        localStorage.setItem('gps_ativo', ativo ? 'true' : 'false');
        localStorage.setItem('gps_intervalo', intervaloEmSegundos);
        localStorage.setItem('gps_termos', termosAceitos ? 'true' : 'false');
        
        // Aguardar um pouco para garantir que foi salvo
        await new Promise(resolve => setTimeout(resolve, 50));
        
        // Verificar se salvou corretamente (múltiplas verificações)
        let tentativas = 0;
        let salvouCorretamente = false;
        
        while (tentativas < 3 && !salvouCorretamente) {
          const verificarAtivo = localStorage.getItem('gps_ativo') === 'true';
          const verificarIntervalo = localStorage.getItem('gps_intervalo');
          const verificarTermos = localStorage.getItem('gps_termos') === 'true';
          
          salvouCorretamente = (
            verificarAtivo === ativo && 
            verificarIntervalo === intervaloEmSegundos &&
            verificarTermos === termosAceitos
          );
          
          if (!salvouCorretamente) {
            tentativas++;
            console.warn(`⚠️ Tentativa ${tentativas}: Configurações não conferem, tentando salvar novamente...`);
            
            // Tentar salvar novamente
            localStorage.setItem('gps_ativo', ativo ? 'true' : 'false');
            localStorage.setItem('gps_intervalo', intervaloEmSegundos);
            localStorage.setItem('gps_termos', termosAceitos ? 'true' : 'false');
            
            await new Promise(resolve => setTimeout(resolve, 50));
          }
        }
        
        if (!salvouCorretamente) {
          console.error('❌ Erro: Configurações não foram salvas corretamente após 3 tentativas!');
          console.error('Valores esperados:', { ativo, intervaloSeg: intervaloEmSegundos, termos: termosAceitos });
          console.error('Valores no localStorage:', {
            gps_ativo: localStorage.getItem('gps_ativo'),
            gps_intervalo: localStorage.getItem('gps_intervalo'),
            gps_termos: localStorage.getItem('gps_termos')
          });
          mostrarToast(typeof window.t === 'function' ? window.t('gps.erroSalvarConfig') : 'Erro ao salvar configurações. Tente novamente.', 'error');
          return;
        }
        
        console.log('✅ Configurações GPS salvas com sucesso:', {
          ativo,
          intervaloMin,
          intervaloSeg: intervaloEmSegundos,
          termos: termosAceitos,
          localStorage: {
            gps_ativo: localStorage.getItem('gps_ativo'),
            gps_intervalo: localStorage.getItem('gps_intervalo'),
            gps_termos: localStorage.getItem('gps_termos')
          }
        });
      } catch (error) {
        console.error('❌ Erro ao salvar no localStorage:', error);
        mostrarToast((typeof window.t === 'function' ? window.t('gps.erroSalvarConfig') : 'Erro ao salvar configurações') + ': ' + error.message, 'error');
        return;
      }

      // Se desativado, limpar estatísticas
      if (!ativo) {
        localStorage.removeItem('gps_contador');
        localStorage.removeItem('gps_ultimo_envio');
        localStorage.removeItem('gps_proximo_envio');
        
        // Atualizar variáveis globais se existirem
        if (typeof window.gpsAuto !== 'undefined') {
          if (window.gpsAuto.contadorEnvios !== undefined) window.gpsAuto.contadorEnvios = 0;
          if (window.gpsAuto.ultimoEnvio !== undefined) window.gpsAuto.ultimoEnvio = null;
          if (window.gpsAuto.proximoEnvio !== undefined) window.gpsAuto.proximoEnvio = null;
        }
      }

      var msgSucesso = ativo 
        ? (typeof window.t === 'function' ? window.t('gps.gpsAtivadoSucesso') : 'GPS ativado com sucesso!')
        : (typeof window.t === 'function' ? window.t('gps.gpsDesativadoSucesso') : 'GPS desativado com sucesso!');
      mostrarToast(msgSucesso + '\nIntervalo: ' + intervaloMin + ' min', 'success');

      // Recarregar configurações na tela para confirmar (com delay para garantir)
      setTimeout(() => {
        carregarConfiguracoes();
        console.log('🔄 Configurações recarregadas após salvar');
      }, 200);
      
      // Reiniciar GPS automático com as novas configurações
      if (typeof pararGPSAutomatico === 'function') {
        pararGPSAutomatico();
      }
      
      if (ativo && typeof iniciarGPSAutomatico === 'function') {
        // Aguardar um pouco antes de reiniciar
        setTimeout(() => {
          iniciarGPSAutomatico();
          
          // Aguardar mais um pouco para as estatísticas serem atualizadas
          setTimeout(() => {
            atualizarStatusGPS();
          }, 1500);
        }, 500);
      } else {
        // Se desativado, atualizar status imediatamente
        atualizarStatusGPS();
      }
      
      // Não redirecionar automaticamente, deixar usuário ver o resultado
      // setTimeout(() => voltar(), 2000);
    }
  </script>
