<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Viagem - Motorista</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="../../js/map-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid #e0e0e0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .tab {
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    
    .tab.active {
      color: #0ea5e9;
      border-bottom-color: #0ea5e9;
    }
    
    .tab-panels {
      min-height: min(420px, 55vh);
      position: relative;
    }
    
    .tab-content {
      display: none;
      min-height: min(400px, 50vh);
      animation: tabFade 0.2s ease;
    }
    
    .tab-content.active {
      display: block;
    }
    
    @keyframes tabFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .map-container {
      height: 300px;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    
    #map {
      width: 100%;
      height: 100%;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    .stat-unit {
      font-size: 14px;
      color: #999;
      margin-left: 4px;
    }
    
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .foto-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #f0f0f0;
      cursor: pointer;
    }
    
    .foto-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .foto-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      padding: 12px;
      color: white;
      font-size: 11px;
    }
    
    .historico-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .historico-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid #0ea5e9;
    }
    
    .historico-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .historico-tipo {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    
    .historico-hora {
      font-size: 12px;
      color: #999;
    }
    
    .historico-descricao {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
    
    .alertas-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .alerta-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid #ffc107;
    }
    
    .alerta-item.critico {
      border-left-color: #dc3545;
      background: #fff5f5;
    }
    
    .alerta-item.medio {
      border-left-color: #ffc107;
      background: #fffbf0;
    }
    
    .alerta-item.baixo {
      border-left-color: #28a745;
      background: #f0fff4;
    }
    
    .alerta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .alerta-tipo {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    
    .alerta-status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #e9ecef;
      color: #666;
    }
    
    .alerta-descricao {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
    
    .sem-dados {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .sem-dados-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body class="motorista-page">
  <div class="navbar">
    <button class="btn-voltar" onclick="voltar()">← <span data-i18n="common.voltar">Voltar</span></button>
    <h1 id="tituloViagem"><i class="bx bx-trip"></i></h1>
    <div id="statusIndicador" class="status-badge-navbar status-online" data-i18n="dashboard.onlineSincronizado">Online - Sincronizado</div>
  </div>

  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="mostrarTab('mapa')" data-i18n="detalhesViagem.mapa">📍 Mapa</button>
      <button class="tab" onclick="mostrarTab('estatisticas')" data-i18n="detalhesViagem.estatisticas">📊 Estatísticas</button>
      <button class="tab" onclick="mostrarTab('galeria')" data-i18n="detalhesViagem.galeria">📸 Galeria</button>
      <button class="tab" onclick="mostrarTab('historico')" data-i18n="detalhesViagem.historico">📝 Histórico</button>
      <button class="tab" onclick="mostrarTab('alertas')" data-i18n="detalhesViagem.alertas">🚨 Alertas</button>
    </div>

    <div class="tab-panels">
    <!-- Tab: Mapa -->
    <div id="tab-mapa" class="tab-content active">
      <div class="map-container">
        <div id="map"></div>
      </div>
      <div style="font-size: 12px; color: #666; text-align: center; margin-top: 8px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
        <span data-i18n="detalhesViagem.origem">📍 Origem</span>
        <span data-i18n="detalhesViagem.destino">🏁 Destino</span>
        <span data-i18n="detalhesViagem.posicaoAtual">🔴 Posição Atual</span>
        <span data-i18n="detalhesViagem.rotaPercorrida">🔵 Rota Percorrida</span>
      </div>
      <div id="botoesNavegacao" style="display: flex; gap: 8px; margin-top: 12px; justify-content: center;"></div>
    </div>

    <!-- Tab: Estatísticas -->
    <div id="tab-estatisticas" class="tab-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label" data-i18n="detalhesViagem.distanciaPercorrida">📏 Distância Percorrida</div>
          <div class="stat-value" id="distanciaPercorrida">-</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label" data-i18n="detalhesViagem.tempoTotal">⏱️ Tempo Total</div>
          <div class="stat-value" id="tempoTotal">-</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label" data-i18n="detalhesViagem.velocidadeMedia">🚗 Velocidade Média</div>
          <div class="stat-value" id="velocidadeMedia">-</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label" data-i18n="detalhesViagem.totalPosicoes">📍 Total de Posições</div>
          <div class="stat-value" id="totalPosicoes">-</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label" data-i18n="detalhesViagem.totalMacros">📝 Total de Macros</div>
          <div class="stat-value" id="totalMacros">-</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label" data-i18n="detalhesViagem.totalFotos">📸 Total de Fotos</div>
          <div class="stat-value" id="totalFotos">-</div>
        </div>
      </div>
    </div>

    <!-- Tab: Galeria -->
    <div id="tab-galeria" class="tab-content">
      <div id="galeriaContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p data-i18n="detalhesViagem.carregandoFotos">Carregando fotos...</p>
        </div>
      </div>
    </div>

    <!-- Tab: Histórico -->
    <div id="tab-historico" class="tab-content">
      <div id="historicoContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p data-i18n="detalhesViagem.carregandoHistorico">Carregando histórico...</p>
        </div>
      </div>
    </div>

    <!-- Tab: Alertas -->
    <div id="tab-alertas" class="tab-content">
      <div id="alertasContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p data-i18n="detalhesViagem.carregandoAlertas">Carregando alertas...</p>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- URL Helper - DEVE ser o primeiro script para garantir interceptor de fetch -->
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/offline.js"></script>
  
  <script>
    if (!verificarAuth()) window.location.href = '../index.html';

    function applyI18n() {
      if (typeof window.t !== 'function') return;
      function t(k) { return k; } // fallback no detalhe da viagem
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k && typeof window.t === 'function') {
          var val = window.t(k);
          if(val !== k) el.textContent = val;
        }
      });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);

    const motorista = getMotorista();
    const token = localStorage.getItem('token');
    let idViagem = null;
    let map = null;
    let posicoesGPS = [];

    // Obter ID da viagem da URL
    const params = new URLSearchParams(window.location.search);
    idViagem = params.get('viagem');

    if (!idViagem) {
      mostrarToast(typeof window.t === 'function' ? window.t('detalhesViagem.viagemNaoEspecificada') : 'Viagem não especificada. Redirecionando...', 'error');
      setTimeout(() => {
        window.location.href = 'viagens.html';
      }, 2000);
    }

    window.voltar = function() {
      window.location.href = 'viagens.html';
    };

    function mostrarTab(tabName) {
      // Esconder todas as tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab').forEach(btn => {
        btn.classList.remove('active');
      });
      
      // Mostrar tab selecionada
      document.getElementById(`tab-${tabName}`).classList.add('active');
      var btn = event && (event.currentTarget || event.target);
      if (btn) btn.classList.add('active');
      
      // Se for mapa, redimensionar
      if (tabName === 'mapa' && map) {
        setTimeout(() => {
          map.invalidateSize();
        }, 100);
      }
    }

    // Inicializar
    (async () => {
      await carregarDadosViagem();
      await inicializarMapa();
      await carregarEstatisticas();
      await carregarGaleria();
      await carregarHistorico();
      await carregarAlertas();
    })();

    let dadosViagem = null;

    // Carregar dados da viagem
    async function carregarDadosViagem() {
      try {
        const response = await fetch(`/api/motorista/viagem/${idViagem}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          dadosViagem = await response.json();
          var titulo = typeof window.t === 'function' ? window.t('detalhesViagem.titulo') : 'Detalhes da Viagem';
          document.getElementById('tituloViagem').textContent = '🚛 ' + titulo + ' #' + dadosViagem.IDVIAGEM;
          
          // Adicionar botões de navegação se houver coordenadas
          atualizarBotoesNavegacao();
        }
      } catch (err) {
        console.error('Erro ao carregar dados da viagem:', err);
      }
    }

    // Inicializar mapa
    async function inicializarMapa() {
      if (typeof L === 'undefined') {
        console.warn('⚠️ Leaflet não carregado');
        return;
      }

      map = L.map('map').setView([-14.2350, -51.9253], 10);

      // Adicionar tiles do servidor próprio
      // IMPORTANTE: Forçar HTTP (não HTTPS) para evitar ERR_SSL_PROTOCOL_ERROR
      // IMPORTANTE: Usar APENAS getTileServerUrl() do map-config.js
      console.log('🗺️ [DETALHES VIAGEM] Inicializando mapa...');
      console.log('🗺️ [DETALHES VIAGEM] MAP_CONFIG disponível:', !!window.MAP_CONFIG);
      console.log('🗺️ [DETALHES VIAGEM] getTileServerUrl disponível:', typeof window.getTileServerUrl === 'function');
      
      let tileServer = window.getTileServerUrl ? window.getTileServerUrl() : (window.MAP_CONFIG?.tileServer || 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
      console.log('🗺️ [DETALHES VIAGEM] Tile server selecionado:', tileServer);
      
      const tileOptions = {
        attribution: window.MAP_CONFIG?.attribution || '© OpenStreetMap contributors',
        maxZoom: window.MAP_CONFIG?.maxZoom || 19
      };
      
      // Se usar servidor OpenStreetMap com {s}, adicionar subdomínios
      if (tileServer.includes('{s}')) {
        tileOptions.subdomains = ['a', 'b', 'c'];
        console.log('🗺️ [DETALHES VIAGEM] Adicionando subdomínios para OpenStreetMap');
      }
      
      L.tileLayer(tileServer, tileOptions).addTo(map);
      console.log('✅ [DETALHES VIAGEM] TileLayer adicionado ao mapa');

      // Aguardar dados da viagem antes de renderizar mapa
      await carregarDadosViagem();
      await carregarPosicoesGPS();
    }

    // Carregar posições GPS
    async function carregarPosicoesGPS() {
      try {
        const response = await fetch(`/api/motorista/posicoes/${idViagem}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          posicoesGPS = data.posicoes || [];
        }
        await renderizarMapa();
      } catch (err) {
        console.error('Erro ao carregar posições GPS:', err);
        await renderizarMapa();
      }
    }

    // Renderizar mapa (origem, destino, rota prevista OSRM/ORS e rota percorrida)
    async function renderizarMapa() {
      if (!map) return;

      const routeCoordinates = [];
      const bounds = [];

      // Adicionar marcador de origem (se disponível)
      if (dadosViagem && dadosViagem.ORIGEM_LATITUDE && dadosViagem.ORIGEM_LATITUDE != 0) {
        const origemPos = [parseFloat(dadosViagem.ORIGEM_LATITUDE), parseFloat(dadosViagem.ORIGEM_LONGITUDE)];
        bounds.push(origemPos);
        
        const origemIcon = L.divIcon({
          className: 'origem-marker',
          html: `<div style="
            background: #10b981;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
          ">📍</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 32]
        });
        
        var lblOrigem = typeof window.t === 'function' ? window.t('detalhesViagem.origem') : 'Origem';
        L.marker(origemPos, { icon: origemIcon })
          .bindPopup(`
            <div style="padding: 8px; min-width: 150px;">
              <strong>📍 ` + lblOrigem + `</strong><br>
              <small>${dadosViagem.ORIGEM_CIDADE || ''}, ${dadosViagem.ORIGEM_ESTADO || ''}</small>
            </div>
          `)
          .addTo(map);
      }

      // Adicionar posições GPS (rota percorrida)
      if (posicoesGPS.length > 0) {
        posicoesGPS.forEach((pos, index) => {
          const lat = parseFloat(pos.LATITUDE);
          const lng = parseFloat(pos.LONGITUDE);
          
          if (isNaN(lat) || isNaN(lng)) return;

          const position = [lat, lng];
          routeCoordinates.push(position);
          bounds.push(position);

          const isUltima = index === 0;
          const marker = L.marker(position, {
            title: `Posição ${posicoesGPS.length - index}`
          });

          var lblPos = (typeof window.t === 'function' ? window.t('detalhesViagem.posicao') : 'Posição') + ' ' + (posicoesGPS.length - index);
          var lblVel = typeof window.t === 'function' ? window.t('detalhesViagem.velocidade') : 'Velocidade';
          const popupContent = `
            <div style="padding: 8px; min-width: 150px;">
              <strong>` + lblPos + `</strong><br>
              <small>${new Date(pos.DHPOSICAO || pos.DHREGISTRO).toLocaleString('pt-BR')}</small><br>
              ${pos.VELOCIDADE ? `<small>` + lblVel + `: ${parseFloat(pos.VELOCIDADE).toFixed(1)} km/h</small>` : ''}
            </div>
          `;
          marker.bindPopup(popupContent).addTo(map);

          if (isUltima) {
            L.circleMarker(position, {
              radius: 10,
              fillColor: '#e74c3c',
              color: '#fff',
              weight: 2,
              opacity: 1,
              fillOpacity: 1
            }).addTo(map);
          }
        });
      }

      // Adicionar marcador de destino (se disponível)
      if (dadosViagem && dadosViagem.DESTINO_LATITUDE && dadosViagem.DESTINO_LATITUDE != 0) {
        const destinoPos = [parseFloat(dadosViagem.DESTINO_LATITUDE), parseFloat(dadosViagem.DESTINO_LONGITUDE)];
        bounds.push(destinoPos);
        
        const destinoIcon = L.divIcon({
          className: 'destino-marker',
          html: `<div style="
            background: #3b82f6;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
          ">🏁</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 32]
        });
        
        var lblDestino = typeof window.t === 'function' ? window.t('detalhesViagem.destino') : 'Destino';
        L.marker(destinoPos, { icon: destinoIcon })
          .bindPopup(`
            <div style="padding: 8px; min-width: 150px;">
              <strong>🏁 ` + lblDestino + `</strong><br>
              <small>${dadosViagem.DESTINO_CIDADE || ''}, ${dadosViagem.DESTINO_ESTADO || ''}</small>
            </div>
          `)
          .addTo(map);
      }

      // Desenhar rota prevista (OSRM/ORS) entre origem e destino para traçar a rota nas estradas
      const origemLat = dadosViagem && dadosViagem.ORIGEM_LATITUDE && dadosViagem.ORIGEM_LATITUDE != 0 ? parseFloat(dadosViagem.ORIGEM_LATITUDE) : null;
      const origemLon = dadosViagem && dadosViagem.ORIGEM_LONGITUDE ? parseFloat(dadosViagem.ORIGEM_LONGITUDE) : null;
      const destinoLat = dadosViagem && dadosViagem.DESTINO_LATITUDE && dadosViagem.DESTINO_LATITUDE != 0 ? parseFloat(dadosViagem.DESTINO_LATITUDE) : null;
      const destinoLon = dadosViagem && dadosViagem.DESTINO_LONGITUDE ? parseFloat(dadosViagem.DESTINO_LONGITUDE) : null;
      if (origemLat != null && origemLon != null && destinoLat != null && destinoLon != null &&
          !isNaN(origemLat) && !isNaN(origemLon) && !isNaN(destinoLat) && !isNaN(destinoLon) &&
          typeof window.getOSRMUrl === 'function') {
        try {
          const osrmUrl = window.getOSRMUrl([
            { lat: origemLat, lon: origemLon },
            { lat: destinoLat, lon: destinoLon }
          ], { overview: 'full', geometries: 'geojson' });
          const config = window.MAP_CONFIG || {};
          const timeout = config.routeTimeout || 15000;
          const res = await fetch(osrmUrl, { signal: AbortSignal.timeout(timeout) });
          const data = await res.json();
          if (data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates) {
            const coords = data.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
            coords.forEach(function(p) { bounds.push(p); });
            L.polyline(coords, {
              color: '#6366f1',
              weight: 5,
              opacity: 0.9,
              dashArray: '10, 10'
            }).addTo(map);
          }
        } catch (e) {
          console.warn('Rota prevista (OSRM/ORS) não disponível, desenhando linha reta:', e.message);
          L.polyline([[origemLat, origemLon], [destinoLat, destinoLon]], {
            color: '#6366f1',
            weight: 4,
            opacity: 0.7,
            dashArray: '8, 8'
          }).addTo(map);
        }
      }

      // Desenhar rota percorrida (polyline dos pontos GPS)
      if (routeCoordinates.length > 1) {
        L.polyline(routeCoordinates, {
          color: '#0ea5e9',
          weight: 4,
          opacity: 0.8,
          smoothFactor: 1
        }).addTo(map);
      }

      // Ajustar zoom para mostrar tudo
      if (bounds.length > 0) {
        const boundsGroup = L.latLngBounds(bounds);
        map.fitBounds(boundsGroup, { padding: [30, 30] });
      }
    }

    // Carregar estatísticas
    async function carregarEstatisticas() {
      try {
        // Distância e velocidade (já temos posicoesGPS)
        if (posicoesGPS.length > 0) {
          let distanciaTotal = 0;
          for (let i = 1; i < posicoesGPS.length; i++) {
            const prev = posicoesGPS[i];
            const curr = posicoesGPS[i - 1];
            
            if (prev.LATITUDE && prev.LONGITUDE && curr.LATITUDE && curr.LONGITUDE) {
              const dist = calcularDistancia(
                parseFloat(prev.LATITUDE),
                parseFloat(prev.LONGITUDE),
                parseFloat(curr.LATITUDE),
                parseFloat(curr.LONGITUDE)
              );
              distanciaTotal += dist;
            }
          }
          
          document.getElementById('distanciaPercorrida').innerHTML = 
            `${distanciaTotal.toFixed(2)}<span class="stat-unit"> km</span>`;

          const velocidades = posicoesGPS
            .filter(p => p.VELOCIDADE)
            .map(p => parseFloat(p.VELOCIDADE));
          
          if (velocidades.length > 0) {
            const velocidadeMedia = velocidades.reduce((a, b) => a + b, 0) / velocidades.length;
            document.getElementById('velocidadeMedia').innerHTML = 
              `${velocidadeMedia.toFixed(1)}<span class="stat-unit"> km/h</span>`;
          }

          const primeira = posicoesGPS[posicoesGPS.length - 1];
          const ultima = posicoesGPS[0];
          const primeiraData = new Date(primeira.DHPOSICAO || primeira.DHREGISTRO);
          const ultimaData = new Date(ultima.DHPOSICAO || ultima.DHREGISTRO);
          const tempoTotalMs = ultimaData - primeiraData;
          const horas = Math.floor(tempoTotalMs / 3600000);
          const minutos = Math.floor((tempoTotalMs % 3600000) / 60000);
          
          document.getElementById('tempoTotal').innerHTML = 
            horas > 0 ? `${horas}h ${minutos}min` : `${minutos}min`;
        }

        document.getElementById('totalPosicoes').textContent = posicoesGPS.length;

        // Total de macros
        try {
          const macrosResponse = await fetch(`/api/motorista/historico-macros/${idViagem}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (macrosResponse.ok) {
            const macros = await macrosResponse.json();
            document.getElementById('totalMacros').textContent = macros.length || 0;
          }
        } catch (err) {
          console.warn('Erro ao carregar macros:', err);
        }

        // Total de fotos
        try {
          const fotosResponse = await fetch(`/api/motorista/delivery-proof/viagem/${idViagem}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (fotosResponse.ok) {
            const fotos = await fotosResponse.json();
            document.getElementById('totalFotos').textContent = fotos.length || 0;
          }
        } catch (err) {
          console.warn('Erro ao carregar fotos:', err);
        }
      } catch (err) {
        console.error('Erro ao carregar estatísticas:', err);
      }
    }

    // Atualizar botões de navegação
    function atualizarBotoesNavegacao() {
      const container = document.getElementById('botoesNavegacao');
      if (!container || !dadosViagem) return;

      const temOrigem = dadosViagem.ORIGEM_LATITUDE && dadosViagem.ORIGEM_LATITUDE != 0;
      const temDestino = dadosViagem.DESTINO_LATITUDE && dadosViagem.DESTINO_LATITUDE != 0;

      if (!temOrigem && !temDestino) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      var navOrigem = typeof window.t === 'function' ? window.t('detalhesViagem.navegarOrigem') : 'Navegar para Origem';
      var navDestino = typeof window.t === 'function' ? window.t('detalhesViagem.navegarDestino') : 'Navegar para Destino';
      if (temOrigem) {
        html += `
          <button class="btn-primary" onclick="abrirNavegacao('origem', ${dadosViagem.ORIGEM_LATITUDE}, ${dadosViagem.ORIGEM_LONGITUDE}, '${(dadosViagem.ORIGEM_CIDADE || '').replace(/'/g, "\\'")}', ${dadosViagem.IDVIAGEM})" style="padding: 8px 16px; font-size: 13px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
            🗺️ ` + navOrigem + `
          </button>
        `;
      }
      if (temDestino) {
        html += `
          <button class="btn-primary" onclick="abrirNavegacao('destino', ${dadosViagem.DESTINO_LATITUDE}, ${dadosViagem.DESTINO_LONGITUDE}, '${(dadosViagem.DESTINO_CIDADE || '').replace(/'/g, "\\'")}', ${dadosViagem.IDVIAGEM})" style="padding: 8px 16px; font-size: 13px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);">
            🗺️ ` + navDestino + `
          </button>
        `;
      }
      container.innerHTML = html;
    }

    // Navegação integrada melhorada (Google Maps / Waze / Apple Maps)
    window.abrirNavegacao = async function(tipo, latitude, longitude, cidade, idViagem) {
      if (!latitude || latitude == 0 || !longitude || longitude == 0) {
        mostrarToast(typeof window.t === 'function' ? window.t('detalhesViagem.coordenadasNaoDisponiveis') : 'Coordenadas não disponíveis para esta localização', 'warning');
        return;
      }

      const destino = `${latitude},${longitude}`;
      const nomeDestino = cidade ? encodeURIComponent(cidade) : encodeURIComponent(`${tipo === 'origem' ? 'Origem' : 'Destino'} - Viagem #${idViagem}`);
      
      // Detectar sistema operacional para mostrar opções relevantes
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);
      
      // Opções de navegação baseadas no dispositivo
      let opcoes = [];
      if (isIOS) {
        opcoes = ['Apple Maps', 'Google Maps', 'Waze', 'Cancelar'];
      } else if (isAndroid) {
        opcoes = ['Google Maps', 'Waze', 'Cancelar'];
      } else {
        opcoes = ['Google Maps', 'Waze', 'Cancelar'];
      }
      
      // Mostrar opções de navegação
      var tituloModal = typeof window.t === 'function' ? window.t('detalhesViagem.escolherAppNavegacao') : 'Escolher Aplicativo de Navegação';
      var msgModal = (typeof window.t === 'function' ? (tipo === 'origem' ? window.t('detalhesViagem.abrirNavegacaoOrigem') : window.t('detalhesViagem.abrirNavegacaoDestino')) : (tipo === 'origem' ? 'Abrir navegação para Origem da viagem?' : 'Abrir navegação para Destino da viagem?'));
      const escolha = await mostrarModal(tituloModal, msgModal, opcoes);
      
      if (escolha === 'Google Maps') {
        // Google Maps: usar direções (funciona em app e web)
        const url = `https://www.google.com/maps/dir/?api=1&destination=${destino}&destination_place_id=${nomeDestino}`;
        // Tentar abrir app primeiro (Android/iOS)
        const urlApp = isAndroid 
          ? `google.navigation:q=${destino}`
          : isIOS
          ? `comgooglemaps://?daddr=${destino}&directionsmode=driving`
          : url;
        
        if (isAndroid || isIOS) {
          const link = document.createElement('a');
          link.href = urlApp;
          link.target = '_blank';
          link.click();
          
          // Fallback para web após 500ms
          setTimeout(() => {
            window.open(url, '_blank');
          }, 500);
        } else {
          window.open(url, '_blank');
        }
      } else if (escolha === 'Waze') {
        // Waze: formato waze://?ll=latitude,longitude&navigate=yes
        const urlWaze = `waze://?ll=${destino}&navigate=yes`;
        const urlWeb = `https://www.waze.com/ul?ll=${destino}&navigate=yes`;
        
        // Tentar abrir app Waze
        const link = document.createElement('a');
        link.href = urlWaze;
        link.target = '_blank';
        link.click();
        
        // Fallback para web após 500ms
        setTimeout(() => {
          window.open(urlWeb, '_blank');
        }, 500);
      } else if (escolha === 'Apple Maps' && isIOS) {
        // Apple Maps: apenas iOS
        const url = `maps://?daddr=${destino}&dirflg=d`;
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.click();
      }
    };

    // Calcular distância
    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Carregar galeria
    async function carregarGaleria() {
      try {
        const response = await fetch(`/api/motorista/delivery-proof/viagem/${idViagem}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const container = document.getElementById('galeriaContainer');

        if (response.ok) {
          const dados = await response.json();
          
          // O endpoint retorna { success: true, comprovantes: [...], total: ... }
          const fotos = Array.isArray(dados) 
            ? dados 
            : (dados.comprovantes || dados.fotos || dados.data || []);
          
          if (!Array.isArray(fotos)) {
            console.error('❌ Resposta não é um array:', dados);
            var errFotos = typeof window.t === 'function' ? window.t('detalhesViagem.erroCarregarFotos') : 'Erro ao carregar fotos';
            container.innerHTML = `
              <div class="sem-dados">
                <div class="sem-dados-icon">⚠️</div>
                <p>` + errFotos + `</p>
              </div>
            `;
            return;
          }

          if (fotos.length === 0) {
            var nenhumaFoto = typeof window.t === 'function' ? window.t('detalhesViagem.nenhumaFotoRegistrada') : 'Nenhuma foto registrada';
            container.innerHTML = `
              <div class="sem-dados">
                <div class="sem-dados-icon">📸</div>
                <p>` + nenhumaFoto + `</p>
              </div>
            `;
            return;
          }

          container.innerHTML = `
            <div class="galeria-grid">
              ${fotos.map(foto => {
                const data = new Date(foto.RECORDED_AT || foto.CREATED_AT || foto.DHREGISTRO).toLocaleString('pt-BR', {
                  day: '2-digit',
                  month: '2-digit',
                  hour: '2-digit',
                  minute: '2-digit'
                });
                return `
                  <div class="foto-item" onclick="abrirFoto('${foto.ID || foto.IDPROOF}', '${idViagem}')">
                    <img src="/api/motorista/delivery-proof/${foto.ID || foto.IDPROOF}/photo" 
                         alt="Foto ${foto.ID || foto.IDPROOF}" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3E📸%3C/text%3E%3C/svg%3E'">
                    <div class="foto-overlay">
                      <div>${data}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else {
            var nenhumaFoto2 = typeof window.t === 'function' ? window.t('detalhesViagem.nenhumaFotoRegistrada') : 'Nenhuma foto registrada';
            container.innerHTML = `
            <div class="sem-dados">
              <div class="sem-dados-icon">📸</div>
              <p>` + nenhumaFoto2 + `</p>
            </div>
          `;
        }
      } catch (err) {
        console.error('Erro ao carregar galeria:', err);
        var errFotos2 = typeof window.t === 'function' ? window.t('detalhesViagem.erroCarregarFotos') : 'Erro ao carregar fotos';
        document.getElementById('galeriaContainer').innerHTML = `
          <div class="sem-dados">
            <div class="sem-dados-icon">⚠️</div>
            <p>` + errFotos2 + `</p>
          </div>
        `;
      }
    }

    function abrirFoto(idFoto, idViagem) {
      window.open(`/api/motorista/delivery-proof/${idFoto}/photo`, '_blank');
    }

          if (eventos.length === 0) {

              <div class="sem-dados">
                <div class="sem-dados-icon">📝</div>
                <p>` + nenhumEvento + `</p>
              </div>

            <div class="historico-list">
              ${eventos.map(evento => {

                  day: '2-digit',

    // Carregar alertas
    async function carregarAlertas() {
      try {
        const response = await fetch(`/api/alertas/viagem/${idViagem}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const container = document.getElementById('alertasContainer');

        if (response.ok) {
          const data = await response.json();
          const alertasArray = Array.isArray(data) ? data : (data.alertas || data.data || []);

          if (alertasArray.length === 0) {
            var nenhumAlerta = typeof window.t === 'function' ? window.t('detalhesViagem.nenhumAlertaRegistrado') : 'Nenhum alerta registrado';
            var tudoCerto = typeof window.t === 'function' ? window.t('detalhesViagem.tudoCerto') : 'Tudo certo!';
            container.innerHTML = `
              <div class="sem-dados">
                <div class="sem-dados-icon">🚨</div>
                <p>` + nenhumAlerta + `</p>
                <p style="font-size: 12px; margin-top: 8px; color: #28a745;">` + tudoCerto + ` ✅</p>
              </div>
            `;
            return;
          }

          container.innerHTML = `
            <div class="alertas-list">
              ${alertasArray.map(alerta => {
                const hora = new Date(alerta.CREATED_AT || alerta.DHREGISTRO).toLocaleString('pt-BR', {
                  day: '2-digit',
                  month: '2-digit',
                  hour: '2-digit',
                  minute: '2-digit'
                });
                
                const tipoClasse = alerta.TYPE === 'CRITICAL' || alerta.SEVERITY === 'HIGH' ? 'critico' :
                                  alerta.TYPE === 'WARNING' || alerta.SEVERITY === 'MEDIUM' ? 'medio' : 'baixo';
                
                let statusFormatado = alerta.STATUS || (typeof window.t === 'function' ? window.t('detalhesViagem.ativo') : 'Ativo');
                if (statusFormatado.toLowerCase() === 'resolved' || statusFormatado.toLowerCase() === 'resolvido') {
                  statusFormatado = (typeof window.t === 'function' && window.t('detalhesViagem.resolvido') && window.t('detalhesViagem.resolvido') !== 'detalhesViagem.resolvido') ? window.t('detalhesViagem.resolvido') : 'Resolvido';
                } else if (statusFormatado.toLowerCase() === 'active' || statusFormatado.toLowerCase() === 'ativo') {
                  statusFormatado = (typeof window.t === 'function' && window.t('detalhesViagem.ativo') && window.t('detalhesViagem.ativo') !== 'detalhesViagem.ativo') ? window.t('detalhesViagem.ativo') : 'Ativo';
                }

                return `
                  <div class="alerta-item ${tipoClasse}">
                    <div class="alerta-header">
                      <div class="alerta-tipo">🚨 ${alerta.TYPE || alerta.TIPO || 'Alerta'}</div>
                      <div class="alerta-status">${statusFormatado}</div>
                    </div>
                    <div class="alerta-descricao">
                      ${alerta.MESSAGE || alerta.MENSAGEM || 'Sem descrição'}
                    </div>
                    <div style="font-size: 11px; color: #999; margin-top: 8px;">${hora}</div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else {
            var nenhumAlerta2 = typeof window.t === 'function' ? window.t('detalhesViagem.nenhumAlertaRegistrado') : 'Nenhum alerta registrado';
            container.innerHTML = `
            <div class="sem-dados">
              <div class="sem-dados-icon">🚨</div>
              <p>` + nenhumAlerta2 + `</p>
            </div>
          `;
        }
      } catch (err) {
        console.error('Erro ao carregar alertas:', err);
        var errAlertas = typeof window.t === 'function' ? window.t('detalhesViagem.erroCarregarAlertas') : 'Erro ao carregar alertas';
        document.getElementById('alertasContainer').innerHTML = `
          <div class="sem-dados">
            <div class="sem-dados-icon">⚠️</div>
            <p>` + errAlertas + `</p>
          </div>
        `;
      }
    }
