<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico - PWA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }
    
    .status {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .status-ok {
      background: #d4edda;
      color: #155724;
    }
    
    .status-warning {
      background: #fff3cd;
      color: #856404;
    }
    
    .status-error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    
    pre {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🔧 Diagnóstico PWA</h1>
  
  <div class="card">
    <div class="card-title">📦 Service Worker</div>
    <div id="swStatus" class="status status-warning">⏳ Verificando...</div>
    <div id="swDetails"></div>
  </div>
  
  <div class="card">
    <div class="card-title">🌐 Status de Conexão</div>
    <div id="netStatus" class="status status-warning">⏳ Verificando...</div>
  </div>
  
  <div class="card">
    <div class="card-title">💾 Cache Storage</div>
    <div id="cacheStatus" class="status status-warning">⏳ Verificando...</div>
    <div id="cacheList"></div>
  </div>
  
  <div class="card">
    <div class="card-title">🗄️ IndexedDB</div>
    <div id="idbStatus" class="status status-warning">⏳ Verificando...</div>
  </div>
  
  <div class="card">
    <div class="card-title">⚙️ Ações</div>
    <button class="btn btn-primary" onclick="forcarAtualizacaoSW()">🔄 Atualizar Service Worker</button>
    <button class="btn btn-danger" onclick="limparTudo()">🧹 Limpar TUDO e Reinstalar</button>
    <button class="btn btn-primary" onclick="location.href='dashboard.html'">← Voltar Dashboard</button>
  </div>
  
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  
  <script>
    async function diagnosticar() {
      // Service Worker
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.getRegistration('/motorista/');
          
          if (registration) {
            const sw = registration.active || registration.installing || registration.waiting;
            
            if (sw) {
              document.getElementById('swStatus').className = 'status status-ok';
              document.getElementById('swStatus').textContent = `✅ Service Worker Ativo (${sw.state})`;
              
              const cacheNames = await caches.keys();
              const motoristaCache = cacheNames.find(name => name.startsWith('motorista-'));
              
              document.getElementById('swDetails').innerHTML = `
                <pre>Versão: ${motoristaCache || 'N/A'}
Estado: ${sw.state}
Scope: ${registration.scope}
Última atualização: ${new Date(registration.updateViaCache).toLocaleString('pt-BR')}</pre>
              `;
            } else {
              document.getElementById('swStatus').className = 'status status-warning';
              document.getElementById('swStatus').textContent = '⚠️ Service Worker Registrado mas Inativo';
            }
          } else {
            document.getElementById('swStatus').className = 'status status-error';
            document.getElementById('swStatus').textContent = '❌ Service Worker NÃO Registrado';
          }
        } catch (error) {
          document.getElementById('swStatus').className = 'status status-error';
          document.getElementById('swStatus').textContent = '❌ Erro: ' + error.message;
        }
      } else {
        document.getElementById('swStatus').className = 'status status-error';
        document.getElementById('swStatus').textContent = '❌ Service Worker não suportado';
      }
      
      // Conexão
      const online = navigator.onLine;
      document.getElementById('netStatus').className = online ? 'status status-ok' : 'status status-error';
      document.getElementById('netStatus').textContent = online ? '✅ Online' : '🔴 Offline';
      
      // Cache Storage
      try {
        const cacheNames = await caches.keys();
        document.getElementById('cacheStatus').className = 'status status-ok';
        document.getElementById('cacheStatus').textContent = `✅ ${cacheNames.length} cache(s) encontrado(s)`;
        
        document.getElementById('cacheList').innerHTML = '<pre>' + cacheNames.join('\n') + '</pre>';
        
        // Listar itens de cada cache
        for (const cacheName of cacheNames) {
          const cache = await caches.open(cacheName);
          const keys = await cache.keys();
          console.log(`📦 Cache ${cacheName}: ${keys.length} itens`);
        }
      } catch (error) {
        document.getElementById('cacheStatus').className = 'status status-error';
        document.getElementById('cacheStatus').textContent = '❌ Erro: ' + error.message;
      }
      
      // IndexedDB
      if ('indexedDB' in window) {
        document.getElementById('idbStatus').className = 'status status-ok';
        document.getElementById('idbStatus').textContent = '✅ IndexedDB Disponível';
      } else {
        document.getElementById('idbStatus').className = 'status status-error';
        document.getElementById('idbStatus').textContent = '❌ IndexedDB não suportado';
      }
    }
    
    async function forcarAtualizacaoSW() {
      const loading = mostrarLoading('Atualizando Service Worker...');
      
      try {
        const registration = await navigator.serviceWorker.getRegistration('/motorista/');
        
        if (registration) {
          await registration.unregister();
          console.log('🗑️ Service Worker antigo removido');
          
          // Re-registrar
          await navigator.serviceWorker.register('/motorista/sw.js');
          console.log('✅ Service Worker v2 registrado!');
          
          esconderLoading();
          mostrarToast('✅ Service Worker atualizado! Recarregando...', 'success');
          
          setTimeout(() => location.reload(), 2000);
        } else {
          esconderLoading();
          mostrarToast('⚠️ Service Worker não encontrado. Registrando...', 'warning');
          
          await navigator.serviceWorker.register('/motorista/sw.js');
          
          setTimeout(() => location.reload(), 2000);
        }
      } catch (error) {
        esconderLoading();
        mostrarToast('❌ Erro: ' + error.message, 'error');
      }
    }
    
    async function limparTudo() {
      const resposta = await mostrarModal(
        '🚨 Limpar TUDO',
        'ATENÇÃO! Isso vai:\n\n• Desregistrar o Service Worker\n• Limpar TODOS os caches\n• Limpar dados offline\n• Fazer logout\n\nTem certeza?',
        ['Cancelar', 'Sim, Limpar TUDO']
      );
      
      if (resposta !== 'Sim, Limpar TUDO') {
        return;
      }
      
      const loading = mostrarLoading('Limpando tudo...');
      
      try {
        // Desregistrar Service Worker
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) {
          await registration.unregister();
          console.log('🗑️ Service Worker removido');
        }
        
        // Limpar todos os caches
        const cacheNames = await caches.keys();
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          console.log('🗑️ Cache removido:', cacheName);
        }
        
        // Limpar IndexedDB
        if (window.indexedDB) {
          indexedDB.deleteDatabase('MotoristaDB');
          console.log('🗑️ IndexedDB removido');
        }
        
        // Limpar localStorage
        localStorage.clear();
        console.log('🗑️ LocalStorage limpo');
        
        esconderLoading();
        mostrarToast('✅ Tudo limpo! Redirecionando...', 'success');
        
        // Redirecionar para login
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 2000);
        
      } catch (error) {
        esconderLoading();
        mostrarToast('❌ Erro: ' + error.message, 'error');
      }
    }
    
    // Executar diagnóstico
    diagnosticar();
    
    // Re-diagnosticar a cada 5 segundos
    setInterval(diagnosticar, 5000);
