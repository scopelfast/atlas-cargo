<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico - PWA</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/padrao-telas.css">
  <script src="../js/i18n.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }
    
    .status {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .status-ok {
      background: #d4edda;
      color: #155724;
    }
    
    .status-warning {
      background: #fff3cd;
      color: #856404;
    }
    
    .status-error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(165deg, #061428 0%, #0d2137 50%, #1a365d 100%);
      color: white;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    
    pre {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body class="motorista-page">
  <h1 data-i18n="diagnostico.titulo">🔧 Diagnóstico PWA</h1>
  
  <div class="card">
    <div class="card-title" data-i18n="diagnostico.serviceWorker">📦 Service Worker</div>
    <div id="swStatus" class="status status-warning" data-i18n="diagnostico.verificando">⏳ Verificando...</div>
    <div id="swDetails"></div>
  </div>
  
  <div class="card">
    <div class="card-title" data-i18n="diagnostico.statusConexao">🌐 Status de Conexão</div>
    <div id="netStatus" class="status status-warning" data-i18n="diagnostico.verificando">⏳ Verificando...</div>
  </div>
  
  <div class="card">
    <div class="card-title" data-i18n="diagnostico.cacheStorage">💾 Cache Storage</div>
    <div id="cacheStatus" class="status status-warning" data-i18n="diagnostico.verificando">⏳ Verificando...</div>
    <div id="cacheList"></div>
  </div>
  
  <div class="card">
    <div class="card-title" data-i18n="diagnostico.indexedDB">🗄️ IndexedDB</div>
    <div id="idbStatus" class="status status-warning" data-i18n="diagnostico.verificando">⏳ Verificando...</div>
  </div>
  
  <div class="card">
    <div class="card-title" data-i18n="diagnostico.acoes">⚙️ Ações</div>
    <button class="btn btn-primary" onclick="forcarAtualizacaoSW()" data-i18n="diagnostico.atualizarSW">🔄 Atualizar Service Worker</button>
    <button class="btn btn-danger" onclick="limparTudo()" data-i18n="diagnostico.limparTudo">🧹 Limpar TUDO e Reinstalar</button>
    <button class="btn btn-primary" onclick="location.href='dashboard.html'" data-i18n="diagnostico.voltarDashboard">← Voltar Dashboard</button>
  </div>
  
  <script src="../js/url-helper.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  
  <script>
    function applyI18n() {
      if (typeof window.t !== 'function') return;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (k) el.textContent = window.t(k);
      });
    }
    if (window.i18nReady) window.i18nReady.then(applyI18n);
    function t(k) { return typeof window.t === 'function' ? window.t(k) : k; }

    async function diagnosticar() {
      // Service Worker
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.getRegistration('/motorista/');
          
          if (registration) {
            const sw = registration.active || registration.installing || registration.waiting;
            
            if (sw) {
              document.getElementById('swStatus').className = 'status status-ok';
              document.getElementById('swStatus').textContent = '✅ ' + t('diagnostico.swAtivo') + ' (' + sw.state + ')';
              
              const cacheNames = await caches.keys();
              const motoristaCache = cacheNames.find(name => name.startsWith('motorista-'));
              
              document.getElementById('swDetails').innerHTML = `
                <pre>Versão: ${motoristaCache || 'N/A'}
Estado: ${sw.state}
Scope: ${registration.scope}
Última atualização: ${new Date(registration.updateViaCache).toLocaleString('pt-BR')}</pre>
              `;
            } else {
              document.getElementById('swStatus').className = 'status status-warning';
              document.getElementById('swStatus').textContent = '⚠️ ' + t('diagnostico.swRegistradoInativo');
            }
          } else {
            document.getElementById('swStatus').className = 'status status-error';
            document.getElementById('swStatus').textContent = '❌ ' + t('diagnostico.swNaoRegistrado');
          }
        } catch (error) {
          document.getElementById('swStatus').className = 'status status-error';
          document.getElementById('swStatus').textContent = '❌ Erro: ' + error.message;
        }
      } else {
        document.getElementById('swStatus').className = 'status status-error';
        document.getElementById('swStatus').textContent = '❌ ' + t('diagnostico.swNaoSuportado');
      }
      
      // Conexão
      const online = navigator.onLine;
      document.getElementById('netStatus').className = online ? 'status status-ok' : 'status status-error';
      document.getElementById('netStatus').textContent = online ? '✅ ' + t('diagnostico.online') : '🔴 ' + t('diagnostico.offline');
      
      // Cache Storage
      try {
        const cacheNames = await caches.keys();
        document.getElementById('cacheStatus').className = 'status status-ok';
        document.getElementById('cacheStatus').textContent = '✅ ' + cacheNames.length + ' ' + t('diagnostico.cacheEncontrados');
        
        document.getElementById('cacheList').innerHTML = '<pre>' + cacheNames.join('\n') + '</pre>';
        
        // Listar itens de cada cache
        for (const cacheName of cacheNames) {
          const cache = await caches.open(cacheName);
          const keys = await cache.keys();
          console.log(`📦 Cache ${cacheName}: ${keys.length} itens`);
        }
      } catch (error) {
        document.getElementById('cacheStatus').className = 'status status-error';
        document.getElementById('cacheStatus').textContent = '❌ Erro: ' + error.message;
      }
      
      // IndexedDB
      if ('indexedDB' in window) {
        document.getElementById('idbStatus').className = 'status status-ok';
        document.getElementById('idbStatus').textContent = '✅ IndexedDB Disponível';
      } else {
        document.getElementById('idbStatus').className = 'status status-error';
        document.getElementById('idbStatus').textContent = '❌ ' + t('diagnostico.idbNaoSuportado');
      }
    }
    
    async function forcarAtualizacaoSW() {
      const loading = mostrarLoading(t('diagnostico.atualizandoSW'));
      
      try {
        // Usar baseUrl para garantir o caminho correto do Service Worker
        const baseUrl = window.__BASE_URL__ || window.location.origin;
        const pathname = window.location.pathname;
        let pathBase = '/';
        
        // Detectar caminho base (ex: /cargas/)
        if (pathname.includes('/cargas')) {
          pathBase = '/cargas/';
        } else if (pathname.includes('/motorista')) {
          const indexMotorista = pathname.indexOf('/motorista');
          pathBase = pathname.substring(0, indexMotorista);
          if (!pathBase || pathBase === '') pathBase = '/';
          if (pathBase !== '/' && !pathBase.endsWith('/')) pathBase = pathBase + '/';
        }
        
        const swPath = baseUrl + (pathBase === '/' ? '' : pathBase.replace(/\/$/, '')) + '/motorista/sw.js';
        const scopePath = (pathBase === '/' ? '' : pathBase.replace(/\/$/, '')) + '/motorista/';
        
        const registration = await navigator.serviceWorker.getRegistration(scopePath);
        
        if (registration) {
          await registration.unregister();
          console.log('🗑️ Service Worker antigo removido');
          
          // Re-registrar
          await navigator.serviceWorker.register(swPath, { scope: scopePath });
          console.log('✅ Service Worker v2 registrado!');
          
          esconderLoading();
          mostrarToast(t('diagnostico.swAtualizado'), 'success');
          
          setTimeout(() => location.reload(), 2000);
        } else {
          esconderLoading();
          mostrarToast(t('diagnostico.swNaoEncontrado'), 'warning');
          
          await navigator.serviceWorker.register(swPath, { scope: scopePath });
          
          setTimeout(() => location.reload(), 2000);
        }
      } catch (error) {
        esconderLoading();
        mostrarToast('Erro: ' + error.message, 'error');
      }
    }
    
    async function limparTudo() {
      const resposta = await mostrarModal(
        '🚨 ' + t('diagnostico.limparTudoTitulo'),
        t('diagnostico.limparTudoMsg'),
        [t('diagnostico.cancelar'), t('diagnostico.simLimpar')]
      );
      
      if (resposta !== t('diagnostico.simLimpar')) {
        return;
      }
      
      const loading = mostrarLoading(t('diagnostico.limpando'));
      
      try {
        // Desregistrar Service Worker
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) {
          await registration.unregister();
          console.log('🗑️ Service Worker removido');
        }
        
        // Limpar todos os caches
        const cacheNames = await caches.keys();
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          console.log('🗑️ Cache removido:', cacheName);
        }
        
        // Limpar IndexedDB
        if (window.indexedDB) {
          indexedDB.deleteDatabase('MotoristaDB');
          console.log('🗑️ IndexedDB removido');
        }
        
        // Limpar localStorage
        localStorage.clear();
        console.log('🗑️ LocalStorage limpo');
        
        esconderLoading();
        mostrarToast(t('diagnostico.tudoLimpo'), 'success');
        
        // Redirecionar para login
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 2000);
        
      } catch (error) {
        esconderLoading();
        mostrarToast('Erro: ' + error.message, 'error');
      }
    }
    
    // Executar diagnóstico
    diagnosticar();
    
    // Re-diagnosticar a cada 5 segundos
    setInterval(diagnosticar, 5000);
