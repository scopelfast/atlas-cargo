<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="App DivulgaCarga para Motoristas">
  <title>DivulgaCarga - Motorista</title>
  <script>
    // CRÍTICO: Executar ANTES de qualquer outro código para detectar ambiente
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const isIntegraBrasil = hostname === 'app.integrabrasil.com' || 
                              hostname === 'beta.integrabrasil.com' || 
                              hostname.includes('integrabrasil.com');
      
      // IMPORTANTE: Usar o protocolo atual da página (transparente)
      // Se acessar via HTTP, usar HTTP; se via HTTPS, usar HTTPS
      const protocoloAtual = window.location.protocol;
      
      // Se estiver em local e HTTPS, redirecionar para HTTP
      if (isLocal && protocoloAtual === 'https:') {
        const httpUrl = 'http:' + window.location.href.substring(window.location.protocol.length);
        window.location.replace(httpUrl);
        return;
      }
      
      // Usar o protocolo atual (HTTP ou HTTPS) - transparente
      const host = window.location.host;
      const baseUrl = (isLocal ? 'http:' : protocoloAtual) + '//' + host;
      
      // Criar e injetar recursos ANTES do navegador tentar fazer upgrade
      const head = document.head || document.getElementsByTagName('head')[0];
      
      console.log('✅ [MOTORISTA] Usando baseUrl:', baseUrl, '| Protocol:', protocoloAtual);
      
      // Favicon
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/png';
      favicon.href = baseUrl + '/img/logo7.png';
      console.log('📦 Carregando favicon:', favicon.href);
      head.appendChild(favicon);
      
      // Manifest
      const manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = baseUrl + '/motorista/manifest.json';
      head.appendChild(manifest);
      
      // CSS - Design System primeiro, depois style.css
      const designSystem = document.createElement('link');
      designSystem.rel = 'stylesheet';
      designSystem.href = baseUrl + '/motorista/css/design-system.css';
      head.appendChild(designSystem);
      
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = baseUrl + '/motorista/css/style.css';
      console.log('📦 Carregando CSS:', css.href);
      head.appendChild(css);
      
      // Armazenar baseUrl globalmente para uso posterior
      window.__BASE_URL__ = baseUrl;
    })();
  </script>
</head>
<body>
  <!-- Script crítico: redirecionar apenas se for localhost em HTTPS -->
  <script>
    // Redirecionar apenas se for localhost em HTTPS (desenvolvimento)
    const hostname = window.location.hostname;
    const isLocal = hostname === 'localhost' || 
                    hostname === '127.0.0.1' || 
                    hostname.startsWith('192.168.');
    if (isLocal && window.location.protocol === 'https:') {
      window.location.replace('http:' + window.location.href.substring(window.location.protocol.length));
    }
  </script>
  <div class="login-container">
    <div class="logo-section">
      <img id="logoImg" alt="Logo DivulgaCarga" class="logo" src="">
      <h1>DivulgaCarga</h1>
      <p class="subtitle">Motorista</p>
    </div>

    <div class="form-section">
      <h2>Bem-vindo!</h2>
      <p class="description">Entre com seus dados para acessar o sistema</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="cpf">CPF</label>
          <input 
            type="text" 
            id="cpf" 
            placeholder="000.000.000-00" 
            maxlength="14"
            required
          >
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            placeholder="Digite sua senha" 
            required
          >
        </div>

        <button type="submit" class="btn-primary">
          <span>Entrar</span>
        </button>
      </form>

      <div id="message" class="message"></div>

      <div class="links">
        <a href="pages/cadastro.html">Cadastrar-se</a>
        <a href="pages/recuperar-senha.html">Esqueci minha senha</a>
      </div>
    </div>

    <div class="footer">
      <p>© 2025 DivulgaCarga - Sistema para Motoristas</p>
      <p class="version">Versão 1.0.0</p>
    </div>
  </div>

  <script>
    // Carregar scripts e imagem com URLs absolutas forçando HTTP
    (function() {
      // Usar baseUrl global ou criar novo
      const baseUrl = window.__BASE_URL__ || ('http://' + window.location.host);
      
      // Carregar logo imediatamente
      const logoImg = document.getElementById('logoImg');
      if (logoImg) {
        logoImg.src = baseUrl + '/img/logo7.png';
      }
      
      // Carregar script auth.js
      function loadScript(src) {
        const script = document.createElement('script');
        let url = baseUrl + '/motorista/' + src;
        // Forçar http:// explicitamente
        url = url.replace(/^https:/, 'http:');
        script.src = url;
        script.onerror = function() {
          console.error('❌ Erro ao carregar script:', this.src);
          // Tentar novamente forçando HTTP
          this.src = this.src.replace(/^https:/, 'http:');
        };
        console.log('📜 Carregando script:', url);
        document.body.appendChild(script);
      }
      
      // Carregar Background Sync Manager (melhoria opcional)
      loadScript('js/background-sync-manager.js');
      
      loadScript('js/auth.js');
    })();
  </script>
  
  <script>
    // Desregistrar Service Workers antigos que possam estar forçando HTTPS
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister().then(function(boolean) {
            console.log('Service Worker desregistrado:', boolean);
          });
        }
      });
    }
    
    // Registrar Service Worker (após limpar os antigos)
    if ('serviceWorker' in navigator) {
      // Aguardar um pouco antes de registrar para garantir que recursos HTTP sejam carregados primeiro
      setTimeout(() => {
        // Usar sw-workbox.js (versão melhorada com cache inteligente)
        // Para voltar ao sistema anterior, altere para '/motorista/sw.js'
        navigator.serviceWorker.register('/motorista/sw-workbox.js')
        .then((registration) => {
          console.log('✅ Service Worker registrado');
          
          // Verificar atualizações a cada 60 segundos
          setInterval(() => {
            registration.update();
          }, 60000);
          
          // Atualizar imediatamente
          registration.update();
          
          // Listener para quando houver atualização
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('🆕 Nova versão disponível! Recarregando...');
                
                // Recarregar página para usar nova versão
                setTimeout(() => {
                  window.location.reload();
                }, 1000);
              }
            });
          });
        })
        .catch(err => console.error('❌ Erro ao registrar SW:', err));
      }, 2000); // Aguardar 2 segundos antes de registrar SW
    }
  </script>
</body>
</html>
