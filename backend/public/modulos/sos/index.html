  /* ========== FORMULÁRIOS - Padrão do Sistema ========== */

<div class="sos-container">
  <!-- Cabeçalho -->
  <div class="sos-header">
    <h2><i class='bx bx-error-circle'></i> <span data-i18n="web.modulos.sos.titulo">Alertas SOS</span></h2>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="btnToggleSomSOS" class="btn" onclick="toggleSomNotificacaoSOS()" title="Ativar/Desativar som de notificação" style="background: #28a745; color: white;">
        <i class='bx bx-volume-full'></i> <span data-i18n="web.modulos.sos.som">Som</span>
      </button>
      <button class="btn btn-primary" onclick="recarregarSOS()">
        <i class='bx bx-refresh'></i> <span data-i18n="web.modulos.sos.atualizar">Atualizar</span>
      </button>
    </div>
  </div>

  <!-- Estatísticas -->
  <div class="sos-stats">
    <div class="stat-card ativos">
      <div class="stat-label" data-i18n="web.modulos.sos.ativos">Ativos</div>
      <div class="stat-value" id="statAtivos">0</div>
    </div>
    <div class="stat-card em-tratamento" style="border-left-color: #f39c12;">
      <div class="stat-label" data-i18n="web.modulos.sos.emTratamento">Em Tratamento</div>
      <div class="stat-value" id="statEmTratamento">0</div>
    </div>
    <div class="stat-card resolvidos">
      <div class="stat-label" data-i18n="web.modulos.sos.resolvidos">Resolvidos</div>
      <div class="stat-value" id="statResolvidos">0</div>
    </div>
    <div class="stat-card total">
      <div class="stat-label" data-i18n="web.modulos.sos.total">Total</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros-box">
    <h3><i class='bx bx-filter'></i> <span data-i18n="web.modulos.sos.filtros">Filtros</span></h3>
    <div class="filtros-grid">
      <div>
        <label data-i18n="web.modulos.sos.status">Status</label>
        <select id="filtroStatus" class="form-control">
          <option value="">Todos</option>
          <option value="active">Ativo</option>
          <option value="in_progress">Em Tratamento</option>
          <option value="resolved">Resolvido</option>
          <option value="cancelled">Cancelado</option>
        </select>
      </div>
      <div class="input-date-wrapper">
        <label data-i18n="web.modulos.sos.dataInicio">Data Início</label>
        <input type="date" id="filtroDataInicio" class="form-control">
      </div>
      <div class="input-date-wrapper">
        <label data-i18n="web.modulos.sos.dataFim">Data Fim</label>
        <input type="date" id="filtroDataFim" class="form-control">
      </div>
      <div>
        <label data-i18n="web.modulos.sos.idViagem">ID Viagem</label>
        <input type="number" id="filtroIdViagem" class="form-control" placeholder="Opcional">
      </div>
      <div>
        <label data-i18n="web.modulos.sos.idMotorista">ID Motorista</label>
        <input type="number" id="filtroIdMotorista" class="form-control" placeholder="Opcional">
      </div>
    </div>
    <div class="filtros-actions">
      <button class="btn btn-secondary" onclick="limparFiltros()">
        <i class='bx bx-x'></i> <span data-i18n="web.modulos.sos.limpar">Limpar</span>
      </button>
      <button class="btn btn-primary" onclick="aplicarFiltros()">
        <i class='bx bx-search'></i> <span data-i18n="web.modulos.sos.filtrar">Filtrar</span>
      </button>
    </div>
  </div>

  <!-- Lista de SOS -->
  <div id="sosList" class="sos-list">
    <!-- Será preenchido dinamicamente -->
  </div>

  <!-- Paginação -->
  <div class="pagination" id="paginationContainer" style="display: none;">
    <button id="btnPrev" onclick="paginarAnterior()" disabled>
      <i class='bx bx-chevron-left'></i> <span data-i18n="web.modulos.sos.anterior">Anterior</span>
    </button>
    <span class="page-info" id="pageInfo">Página 1 de 1</span>
    <button id="btnNext" onclick="paginarProximo()">
      <span data-i18n="web.modulos.sos.proximo">Próxima</span> <i class='bx bx-chevron-right'></i>
    </button>
  </div>
</div>

<!-- Modal de Tratamento -->
<div id="modalTratamento" class="modal-tratamento">
  <div class="modal-content-tratamento">
    <div class="modal-header-tratamento">
      <h3 data-i18n="web.modulos.sos.tratarAlertaSOS">Tratar Alerta SOS</h3>
      <button class="close-modal" onclick="fecharModalTratamento()">
        <i class='bx bx-x'></i>
      </button>
    </div>
    <div id="modalTratamentoContent">
      <!-- Conteúdo será preenchido dinamicamente -->
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <p data-i18n="web.modulos.sos.carregandoSOS">Carregando alertas SOS...</p>
</div>

<!-- Modal de Localização (padrão: Localização do Motorista – Relatório de Convocações) -->
<div id="modalLocalizacao" class="modal-mapa-motorista">
  <div class="modal-mapa-motorista-content">
    <div class="modal-mapa-motorista-header">
      <h3><i class="bx bx-map-pin" style="vertical-align: middle;"></i> <span data-i18n="web.modulos.sos.localizacaoSOS">Localização do SOS</span></h3>
      <button class="btn-fechar" onclick="fecharModalLocalizacao()"><i class="bx bx-x"></i> Fechar</button>
    </div>
    <div class="modal-mapa-motorista-body">
      <div class="modal-mapa-motorista-info">
        <div class="modal-mapa-motorista-info-grid modal-mapa-motorista-info-grid-sos">
          <div class="modal-mapa-motorista-info-item">
            <label>Endereço</label>
            <span id="enderecoLocalizacao"><i class='bx bx-loader-alt bx-spin'></i> Buscando endereço...</span>
          </div>
          <div class="modal-mapa-motorista-info-item">
            <label>Coordenadas</label>
            <span id="coordenadasLocalizacao">-</span>
          </div>
        </div>
      </div>
      <div class="modal-mapa-motorista-map">
        <div id="mapaLocalizacao"></div>
      </div>
    </div>
  </div>
</div>
