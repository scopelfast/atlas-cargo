<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="web.modulos.mapaViagem.titulo">Mapa de Viagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/modulos.css">
  <link rel="stylesheet" href="/css/dark-mode.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    /* ========== Mapa de Viagem - Identidade Atlas Cargo ========== */
    .mapa-viagem-container {
      padding: 20px;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
    }

    .mapa-viagem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--light-gray, #e2e8f0);
    }

    .mapa-viagem-header h2 {
      margin: 0;
      color: var(--ac-primary, #0d2137);
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mapa-viagem-header h2 i {
      color: inherit;
    }

    /* Abas com ícones – mesmo padrão dos demais módulos */
    .mapa-viagem-container .tabs.tabs-com-icones {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--light-gray, #e2e8f0);
      gap: 0;
    }
    .mapa-viagem-container .tabs.tabs-com-icones .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    .mapa-viagem-container .tabs.tabs-com-icones .tab-btn i {
      font-size: 1.15rem;
      color: inherit;
    }
    .mapa-viagem-container .tabs.tabs-com-icones .tab-btn:hover {
      color: #64748b;
    }
    .mapa-viagem-container .tabs.tabs-com-icones .tab-btn.active {
      color: var(--ac-primary, #0d2137);
      border-bottom-color: var(--ac-primary, #0d2137);
    }
    .mapa-viagem-container .tabs.tabs-com-icones .tab-btn.active i {
      color: var(--ac-primary, #0d2137);
    }

    .filtros-box {
      background: var(--white, #fff);
      border-radius: 12px;
      padding: 25px;
      box-shadow: var(--shadow, 0 4px 6px -1px rgba(0,0,0,0.08));
      margin-bottom: 25px;
      border: 1px solid var(--border, #e2e8f0);
    }

    .filtros-box h3 {
      margin: 0 0 20px 0;
      color: var(--ac-primary, #0d2137);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filtros-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .filtros-actions .btn {
      margin-right: 0;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-primary {
      background: var(--ac-accent, #0ea5e9);
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .btn-info {
      background: #17a2b8;
      color: white;
    }

    .btn-info:hover {
      background: #138496;
    }

    /* ========== MAPA ========== */
    .mapa-container {
      background: var(--white, #fff);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 0;
    }

    .mapa-container h3 {
      margin: 0 0 20px 0;
      color: var(--ac-primary, #0d2137);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mapa-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 15px;
    }

    /* ========== ABAS ========== */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--light-gray, #e2e8f0);
    }

    .tab-btn {
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: #6c757d;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }

    .tab-btn:hover {
      color: var(--ac-accent, #0ea5e9);
      background: #f8f9fa;
    }

    .tab-btn.active {
      color: var(--ac-accent, #0ea5e9);
      border-bottom-color: var(--ac-accent, #0ea5e9);
      background: #f8f9fa;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    #tab-mapa {
      height: calc(100vh - 200px);
      min-height: 600px;
    }

    #tab-mapa .mapa-container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #mapaVeiculos {
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }

    #mapaInfo {
      margin-top: 15px;
      padding: 15px;
      background: var(--white, #fff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      color: var(--dark, #1e293b);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #mapaInfo i {
      font-size: 1.25rem;
      color: var(--ac-accent, #0ea5e9);
      flex-shrink: 0;
    }

    /* ========== MODAL DE AJUDA ========== */
    .modal-tratamento {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content-tratamento {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-header-tratamento {
      padding: 20px 25px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-header-tratamento h3 {
      margin: 0;
      color: var(--ac-primary, #0d2137);
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-close-modal {
      background: none;
      border: none;
      font-size: 24px;
      color: #666;
      cursor: pointer;
      padding: 5px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-close-modal:hover {
      background: #f0f0f0;
      color: #333;
    }

    .modal-body-tratamento {
      padding: 25px;
      max-height: calc(90vh - 140px);
      overflow-y: auto;
      flex: 1;
    }

    .modal-body-tratamento h4 {
      color: var(--ac-primary, #0d2137);
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 600;
    }

    .modal-body-tratamento h4:first-child {
      margin-top: 0;
    }

    .modal-body-tratamento p {
      color: #495057;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .modal-body-tratamento ul {
      margin: 10px 0 20px 0;
      padding-left: 20px;
      color: #495057;
      line-height: 1.8;
    }

    .modal-body-tratamento li {
      margin: 8px 0;
    }

    .modal-footer-tratamento {
      padding: 20px 25px;
      border-top: 1px solid #e9ecef;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="mapa-viagem-container">
    <!-- Header Padronizado -->
    <div class="mapa-viagem-header">
      <h2>
        <i class='bx bx-map'></i>
        <span data-i18n="web.modulos.mapaViagem.titulo">Mapa de Viagem</span>
      </h2>
    </div>

    <!-- Abas (padrão com ícones como nos demais módulos) -->
    <div class="tabs tabs-com-icones">
      <button class="tab-btn active" data-tab="filtros" data-i18n="web.modulos.mapaViagem.tabFiltros"><i class='bx bx-filter-alt'></i> Filtros</button>
      <button class="tab-btn" data-tab="mapa" data-i18n="web.modulos.mapaViagem.tabMapa"><i class='bx bx-map'></i> Mapa</button>
    </div>

    <!-- Aba Filtros -->
    <div class="tab-content active" id="tab-filtros">
      <div class="filtros-box">
        <h3><i class='bx bx-filter'></i> <span data-i18n="web.modulos.mapaViagem.filtros">Filtros</span></h3>
        <form id="filtroForm" onsubmit="return false;">
        <!-- Linha 1: ID Viagem, Tipo Viagem, Situação Viagem, Classe Frota, Contratador -->
        <div class="input-group five-row">
          <div>
            <label for="filtroIdViagem" data-i18n="web.modulos.mapaViagem.idViagem">ID Viagem</label>
            <input type="number" id="filtroIdViagem" min="1" placeholder="Digite o ID...">
          </div>
          <div>
            <label for="filtroTipoViagem" data-i18n="web.modulos.mapaViagem.tipoViagem">Tipo Viagem</label>
            <select id="filtroTipoViagem">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="filtroSituacaoViagem" data-i18n="web.modulos.mapaViagem.situacaoViagem">Situação Viagem</label>
            <select id="filtroSituacaoViagem">
              <option value="">Todas</option>
              <option value="A">Aprovada</option>
              <option value="C">Cancelada</option>
              <option value="D">Preparação</option>
              <option value="E">Final de rota</option>
              <option value="F" data-i18n="web.modulos.mapaViagem.viagemFinalizada">Viagem finalizada</option>
              <option value="M">Emissão documentos</option>
              <option value="P">Programada</option>
              <option value="T">Em trânsito</option>
            </select>
          </div>
          <div>
            <label for="filtroClasseFrota" data-i18n="web.modulos.mapaViagem.classeFrota">Classe Frota</label>
            <select id="filtroClasseFrota">
              <option value="">Todas</option>
            </select>
          </div>
          <div>
            <label for="filtroContratador" data-i18n="web.modulos.mapaViagem.contratador">Contratador</label>
            <select id="filtroContratador">
              <option value="">Todos</option>
            </select>
          </div>
        </div>

        <!-- Linha 2: Origem e Destino -->
        <div class="input-group four-row">
          <div>
            <label for="filtroOrigemEstado" data-i18n="web.modulos.mapaViagem.origemEstado">Origem - UF - Estado</label>
            <select id="filtroOrigemEstado">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="filtroOrigemCidade" data-i18n="web.modulos.mapaViagem.origemCidade">Origem - Cidade</label>
            <input type="text" id="filtroOrigemCidade" maxlength="40" placeholder="Digite parte do nome...">
          </div>
          <div>
            <label for="filtroDestinoEstado" data-i18n="web.modulos.mapaViagem.destinoEstado">Destino - UF - Estado</label>
            <select id="filtroDestinoEstado">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="filtroDestinoCidade" data-i18n="web.modulos.mapaViagem.destinoCidade">Destino - Cidade</label>
            <input type="text" id="filtroDestinoCidade" maxlength="40" placeholder="Digite parte do nome...">
          </div>
        </div>

        <!-- Linha 3: Roteiro, Descrição Roteiro, Data Início, Data Fim e Exige Veículo Rastreado? -->
        <div class="input-group five-row">
          <div>
            <label for="filtroRoteiro" data-i18n="web.modulos.mapaViagem.roteiro">Roteiro</label>
            <select id="filtroRoteiro">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="filtroRoteiroDescricao" data-i18n="web.modulos.mapaViagem.descricaoRoteiro">Descrição Roteiro</label>
            <input type="text" id="filtroRoteiroDescricao" readonly>
          </div>
          <div>
            <label for="filtroDataInicio" data-i18n="web.modulos.mapaViagem.dataInicio">Data Início</label>
            <input type="date" id="filtroDataInicio">
          </div>
          <div>
            <label for="filtroDataFim" data-i18n="web.modulos.mapaViagem.dataFim">Data Fim</label>
            <input type="date" id="filtroDataFim">
          </div>
          <div>
            <label for="filtroRastreado" data-i18n="web.modulos.mapaViagem.exigeRastreado">Exige Veículo Rastreado</label>
            <select id="filtroRastreado">
              <option value="">Todos</option>
              <option value="S">Sim</option>
              <option value="N">Não</option>
            </select>
          </div>
          <div>
            <label for="filtroMotoristaConfirmado" data-i18n="web.modulos.mapaViagem.motoristaConfirmado">Motorista Confirmado</label>
            <select id="filtroMotoristaConfirmado">
              <option value="">Todos</option>
              <option value="S">Sim</option>
              <option value="N">Não</option>
            </select>
          </div>
        </div>

        <div class="filtros-actions">
          <button type="button" id="btnLimparFiltros" class="btn btn-secondary">
            <i class='bx bx-x'></i> <span data-i18n="web.modulos.mapaViagem.limpar">Limpar</span>
          </button>
          <button type="submit" class="btn btn-primary">
            <i class='bx bx-search'></i> <span data-i18n="web.modulos.mapaViagem.filtrar">Filtrar</span>
          </button>
        </div>
      </form>
      </div>
    </div>

    <!-- Aba Mapa -->
    <div class="tab-content" id="tab-mapa">
      <div class="mapa-container" style="padding: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0;">
          <h3><i class='bx bx-map'></i> <span data-i18n="web.modulos.mapaViagem.mapaVeiculos">Mapa de Veículos</span></h3>
          <div class="mapa-actions">
            <button type="button" id="btnAtualizarMapa" class="btn btn-primary">
              <i class='bx bx-refresh'></i> <span data-i18n="web.modulos.mapaViagem.atualizarMapa">Atualizar Mapa</span>
            </button>
            <button type="button" id="btnCentralizarMapa" class="btn btn-info">
              <i class='bx bx-crosshair'></i> <span data-i18n="web.modulos.mapaViagem.centralizarMapa">Centralizar</span>
            </button>
          </div>
        </div>
        <div id="mapaVeiculos"></div>
        <div id="mapaInfo" style="flex-shrink: 0; margin-top: 15px;">
          <i class='bx bx-info-circle'></i> 
          <span id="mapaInfoText" data-i18n="web.modulos.mapaViagem.mapaInfoApliqueFiltros">Aplique os filtros para carregar as posições dos veículos no mapa.</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlay de carregamento para init.sql -->
  <div id="loadingOverlayInitSQL" class="calculando-overlay" style="display: none;">
    <div class="calculando-content">
      <div class="calculando-spinner"></div>
      <h3 id="loadingTitleInitSQL">Processando Inicialização</h3>
      <p id="loadingTextInitSQL">Executando scripts de inicialização...</p>
      <p class="calculando-detalhe" id="loadingDetailInitSQL">Isso pode levar alguns segundos.</p>
      <button onclick="window.hideLoadingOverlayInitSQL()" class="btn btn-secondary" style="margin-top: 20px;">
        <i class='bx bx-x'></i> Cancelar e Continuar
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/cache-buster.js?v=202612091200"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/map-config.js"></script>
  <script src="/js/map-helper.js"></script>
  <script src="/js/log-helper.js"></script>
  <script src="/js/init-overlay-helper.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
