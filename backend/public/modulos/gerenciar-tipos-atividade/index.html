<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Tipos de Atividade</title>
  <link rel="stylesheet" href="/css/modulos.css">
</head>
<body>
  <!-- Overlay de carregamento para init.sql -->
  <div id="loadingOverlayInitSQL" class="calculando-overlay" style="display: none;">
    <div class="calculando-content">
      <div class="calculando-spinner"></div>
      <h3 id="loadingTitleInitSQL">Processando Inicialização</h3>
      <p id="loadingTextInitSQL">Executando scripts de inicialização...</p>
      <p class="calculando-detalhe" id="loadingDetailInitSQL">Isso pode levar alguns segundos.</p>
    </div>
  </div>

  <div class="modulo-container">
    <h1>Gerenciar Tipos de Atividade</h1>

    <!-- Abas -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="filtros">Filtros</button>
      <button class="tab-btn" data-tab="grid" data-permission-tab="3">Grid</button>
      <button class="tab-btn" data-tab="dados" data-permission-tab="3">Dados</button>
    </div>

    <!-- Filtros -->
    <div class="tab-content active" id="tab-filtros">
      <div class="form-box">
        <h2>Filtros de Busca</h2>
        <form id="filtroForm">
          <div class="input-group triple">
            <div>
              <label for="filtroCodigo">Código</label>
              <input type="number" id="filtroCodigo" min="1">
            </div>
            <div>
              <label for="filtroDescricao">Descrição</label>
              <input type="text" id="filtroDescricao" maxlength="40">
            </div>
          </div>
          <div class="input-group triple">
            <div>
              <label for="filtroSituacao">Situação</label>
              <select id="filtroSituacao">
                <option value="">Todas</option>
                <option value="S">Ativo</option>
                <option value="N">Inativo</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn save" data-permission="3">Aplicar Filtro</button>
          <button type="button" id="btnLimparFiltros" class="btn cancel">Limpar</button>
        </form>
      </div>
    </div>

    <!-- Grid -->
    <div class="tab-content" id="tab-grid">
      <div class="form-box">
        <h2>Tipos de Atividade - Visualização em Grid</h2>
        <div class="actions-top">
          <button type="button" id="btnVoltarGrid" class="btn cancel">← Voltar aos Filtros</button>
          <button type="button" id="btnNovoRegistroGrid" class="btn save" data-permission="3">+ Novo Registro</button>
        </div>
        <div id="tiposAtividadeGridCount" style="padding: 10px 0; color: #666; font-size: 14px; font-weight: 500;">
          <span id="tiposAtividadeGridCountText">0 registro(s) encontrado(s)</span>
        </div>
        <div id="tiposAtividadeGrid" class="grid-container">
          <p class="empty">Aplicar filtros para carregar o grid.</p>
        </div>
      </div>
    </div>

    <!-- Dados -->
    <div class="tab-content" id="tab-dados">
      <div class="form-box">
        <h2 id="formTitle">Novo Tipo de Atividade</h2>
        <form id="tipoAtividadeForm">
          <input type="hidden" id="tipoAtividadeCodigoOriginal">
          
          <div class="input-group triple">
            <div>
              <label for="tipoAtividadeCodigo">Código (CDTIPOATIVIDADE) *</label>
              <input type="number" id="tipoAtividadeCodigo" required min="1" max="32767">
            </div>
            <div>
              <label for="tipoAtividadeDescricao">Descrição (DSTIPOATIVIDADE) *</label>
              <input type="text" id="tipoAtividadeDescricao" required maxlength="40">
            </div>
          </div>
          <div class="input-group triple">
            <div>
              <label for="tipoAtividadeSituacao">Situação *</label>
              <select id="tipoAtividadeSituacao" required>
                <option value="S">Ativo</option>
                <option value="N">Inativo</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn save" data-permission="3">Salvar</button>
            <button type="button" id="btnCancelar" class="btn cancel">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Confirmação -->
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <h3>Confirmar Ação</h3>
        <p id="modalMessage"></p>
        <div class="modal-actions">
          <button id="confirmYes" class="btn delete">Sim</button>
          <button id="confirmNo" class="btn cancel">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="/js/grid-editor.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
