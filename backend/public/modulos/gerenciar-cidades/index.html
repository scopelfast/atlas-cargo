<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Cidades</title>
  <link rel="stylesheet" href="/css/modulos.css">
</head>
<body>
  <!-- Overlay de carregamento (mesmo estilo do Gerenciar Roteiros) -->
  <div id="loadingOverlay" class="calculando-overlay" style="display: none;">
    <div class="calculando-content">
      <div class="calculando-spinner"></div>
      <h3 id="loadingTitle">Carregando Cidades</h3>
      <p id="loadingText">Por favor, aguarde enquanto carregamos as cidades...</p>
      <p class="calculando-detalhe">Isso pode levar alguns segundos.</p>
    </div>
  </div>
  
  <div class="modulo-container">
    <h1>Gerenciar Cidades</h1>

    <!-- Abas -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="filtros">Filtros</button>
      <button class="tab-btn" data-tab="grid">Grid</button>
      <button class="tab-btn" data-tab="dados">Dados</button>
    </div>

    <!-- Filtros -->
    <div class="tab-content active" id="tab-filtros">
      <div class="form-box">
        <h2>Filtros de Busca</h2>
        <form id="filtroForm">
          <!-- Linha 1: País, Estado, Cidade, Área DDD -->
          <div class="input-group triple">
            <div>
              <label for="filtroPais">País</label>
              <select id="filtroPais">
                <option value="">Todos</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="filtroEstado">Estado</label>
              <select id="filtroEstado">
                <option value="">Todos</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="filtroCidade">Cidade</label>
              <input type="text" id="filtroCidade" maxlength="40" placeholder="Digite parte do nome...">
            </div>
            <div>
              <label for="filtroAreaDDD">Área DDD</label>
              <input type="number" id="filtroAreaDDD" min="0" placeholder="Ex: 11, 21...">
            </div>
          </div>

          <!-- Linha 2: Mesorregião, Microrregião, Região Fiscal, Situação -->
          <div class="input-group triple">
            <div>
              <label for="filtroMesoregiao">Mesorregião</label>
              <select id="filtroMesoregiao">
                <option value="">Todas</option>
                <!-- Preenchido dinamicamente baseado no Estado -->
              </select>
            </div>
            <div>
              <label for="filtroMicroregiao">Microrregião</label>
              <select id="filtroMicroregiao">
                <option value="">Todas</option>
                <!-- Preenchido dinamicamente baseado no Estado -->
              </select>
            </div>
            <div>
              <label for="filtroRegiaoFiscal">Região Fiscal</label>
              <select id="filtroRegiaoFiscal">
                <option value="">Todas</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="filtroSituacao">Situação</label>
              <select id="filtroSituacao">
                <option value="">Todas</option>
                <option value="S">Ativo</option>
                <option value="N">Inativo</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn save">Aplicar Filtro</button>
          <button type="button" id="btnLimparFiltros" class="btn cancel">Limpar</button>
        </form>
      </div>
    </div>


    <!-- Grid -->
    <div class="tab-content" id="tab-grid">
      <div class="form-box">
        <h2>Cidades Cadastradas - Grid</h2>
        <div class="actions-top">
          <button id="btnVoltarGrid" class="btn cancel">← Voltar aos Filtros</button>
          <button id="btnNovoRegistroGrid" class="btn save">+ Novo Registro</button>
        </div>
        <div id="cidadesGridCount" style="padding: 10px 0; color: #666; font-size: 14px; font-weight: 500;">
          <span id="cidadesGridCountText">0 registro(s) encontrado(s)</span>
        </div>
        <div id="cidadesGrid" class="grid-container"></div>
      </div>
    </div>

    <!-- Dados -->
    <div class="tab-content" id="tab-dados">
      <div class="form-box">
        <h2 id="formTitle">Nova Cidade</h2>
        <form id="cidadeForm">
          <input type="hidden" id="cidadeId">
          
          <!-- Linha 1: Código Município (IBGE), Código País (País), Estado, Cidade -->
          <div class="input-group triple">
            <div>
              <label for="cidadeMunicipio">Código IBGE *</label>
              <input type="number" id="cidadeMunicipio" required min="0">
            </div>
            <div>
              <label for="cidadePais">País</label>
              <select id="cidadePais">
                <option value="">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeEstado">Estado *</label>
              <select id="cidadeEstado" required>
                <option value="">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeNome">Cidade *</label>
              <input type="text" id="cidadeNome" required maxlength="40">
            </div>
          </div>

          <!-- Linha 2: Área DDD, Mesorregião, Microrregião, Região Fiscal -->
          <div class="input-group triple">
            <div>
              <label for="cidadeAreaDDD">Área DDD</label>
              <div style="display: flex; gap: 8px; align-items: flex-end;">
                <input type="number" id="cidadeAreaDDD" min="0" style="flex: 1;">
                <button type="button" id="btnBuscarDDD" class="btn" style="padding: 12px 20px; margin: 0; white-space: nowrap; background: #3498db; color: white; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;" title="Buscar DDD pelo código IBGE" onmouseover="this.style.background='#2980b9'" onmouseout="this.style.background='#3498db'">
                  🔍 Buscar
                </button>
              </div>
            </div>
            <div>
              <label for="cidadeMesoregiao">Mesorregião</label>
              <select id="cidadeMesoregiao">
                <option value="">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeMicroregiao">Microrregião</label>
              <select id="cidadeMicroregiao">
                <option value="">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeRegiaoFiscal">Região Fiscal</label>
              <select id="cidadeRegiaoFiscal">
                <option value="">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
          </div>

          <!-- Linha 3: Situação (com 3 colunas vazias) -->
          <div class="input-group triple">
            <div>
              <label for="cidadeSituacao">Situação *</label>
              <select id="cidadeSituacao" required>
                <option value="S">Ativo</option>
                <option value="N">Inativo</option>
              </select>
            </div>
            <div></div>
            <div></div>
            <div></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn save">Salvar</button>
            <button type="button" id="btnCancelar" class="btn cancel">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <h3>Confirmar Ação</h3>
        <p id="modalMessage"></p>
        <div class="modal-actions">
          <button id="confirmYes" class="btn delete">Sim</button>
          <button id="confirmNo" class="btn cancel">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="/js/grid-editor.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
