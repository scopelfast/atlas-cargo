<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Cidades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/modulos.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    /* ========== Gerenciar Cidades - Identidade Atlas Cargo ========== */
    .cidades-container {
      padding: 20px;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
    }

    .cidades-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--light-gray, #e2e8f0);
    }

    .cidades-header h2 {
      margin: 0;
      color: var(--ac-primary, #0d2137);
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filtros-box {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: var(--shadow, 0 4px 6px -1px rgba(0,0,0,0.08));
      margin-bottom: 25px;
      border: 1px solid var(--border, #e2e8f0);
    }

    .filtros-box h3 {
      margin: 0 0 20px 0;
      color: var(--ac-primary, #0d2137);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filtros-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .filtros-grid > div {
      display: flex;
      flex-direction: column;
    }

    .filtros-grid label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark, #1e293b);
      font-size: 14px;
    }

    .filtros-grid .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
      font-family: inherit;
      box-sizing: border-box;
      background-color: #fff;
    }

    .filtros-grid .form-control:focus {
      outline: none;
      border-color: var(--ac-accent, #0ea5e9);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .filtros-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .filtros-actions .btn {
      margin-right: 0;
    }

    /* ========== BOTÕES - Padrão do Sistema ========== */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--ac-accent, #0ea5e9);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ac-accent-hover, #0284c7);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    }

    /* Botão destaque para "Novo Registro" */
    .btn-primary.btn-novo-registro,
    button.btn-primary[id*="NovoRegistro"],
    button.btn-primary[id*="NovoEquipamento"] {
      background: var(--success, #059669);
      color: white;
    }

    .btn-primary.btn-novo-registro:hover:not(:disabled),
    button.btn-primary[id*="NovoRegistro"]:hover:not(:disabled),
    button.btn-primary[id*="NovoEquipamento"]:hover:not(:disabled) {
      background: #047857;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
    }

    .btn-secondary {
      background: var(--gray, #64748b);
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #475569;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(100, 116, 139, 0.3);
    }

    .btn-info {
      background: var(--ac-accent, #0ea5e9);
      color: white;
    }

    .btn-info:hover:not(:disabled) {
      background: var(--ac-accent-hover, #0284c7);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 14px;
    }

    /* ========== MODAL - Atlas Cargo ========== */
    .modal-content-tratamento {
      background: white;
      border-radius: 12px;
      padding: 0;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(13, 33, 55, 0.12);
      border: 1px solid var(--border, #e2e8f0);
    }

    .modal-content-tratamento .modal-header {
      padding: 20px 25px;
      border-bottom: 1px solid var(--border, #e2e8f0);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-content-tratamento .modal-header h3 {
      margin: 0;
      color: var(--ac-primary, #0d2137);
      font-size: 20px;
      font-weight: 600;
    }

    .modal-content-tratamento .modal-header .close {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--gray, #64748b);
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .modal-content-tratamento .modal-header .close:hover {
      background: var(--light-gray, #e2e8f0);
      color: var(--ac-primary, #0d2137);
    }

    .modal-content-tratamento .modal-body {
      padding: 25px;
    }

    .modal-content-tratamento .modal-actions {
      padding: 20px 25px;
      border-top: 1px solid var(--border, #e2e8f0);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-content-tratamento .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
      font-family: inherit;
      box-sizing: border-box;
      background-color: #fff;
    }

    .modal-content-tratamento .form-control:focus {
      outline: none;
      border-color: var(--ac-accent, #0ea5e9);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .modal-content-tratamento label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--ac-primary, #0d2137);
      font-size: 14px;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .filtros-grid {
        grid-template-columns: 1fr;
      }
      
      .filtros-actions {
        flex-direction: column;
      }
      
      .filtros-actions .btn {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Overlay de carregamento -->
  <div id="loadingOverlay" class="calculando-overlay" style="display: none;">
    <div class="calculando-content">
      <div class="calculando-spinner"></div>
      <h3 id="loadingTitle" data-i18n="web.modulos.cidades.loadingTitle">Carregando Cidades</h3>
      <p id="loadingText" data-i18n="web.modulos.cidades.loadingText">Por favor, aguarde enquanto carregamos as cidades...</p>
      <p class="calculando-detalhe" data-i18n="web.modulos.cidades.loadingDetalhe">Isso pode levar alguns segundos.</p>
    </div>
  </div>
  
  <div class="cidades-container">
    <div class="cidades-header">
      <h2><i class='bx bx-map'></i> <span data-i18n="web.modulos.cidades.titulo">Gerenciar Cidades</span></h2>
    </div>

    <!-- Abas -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="filtros" data-i18n="web.modulos.cidades.tabFiltros">Filtros</button>
      <button class="tab-btn" data-tab="grid" data-i18n="web.modulos.cidades.tabGrid">Grid</button>
      <button class="tab-btn" data-tab="dados" data-i18n="web.modulos.cidades.tabDados">Dados</button>
    </div>

    <!-- Filtros -->
    <div class="tab-content active" id="tab-filtros">
      <div class="filtros-box">
        <h3><i class='bx bx-filter'></i> <span data-i18n="web.modulos.cidades.filtrosBusca">Filtros de Busca</span></h3>
        <form id="filtroForm" onsubmit="return false;">
          <div class="filtros-grid">
            <div>
              <label for="filtroPais" data-i18n="web.modulos.cidades.pais">País</label>
              <select id="filtroPais" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.todos">Todos</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="filtroEstado" data-i18n="web.modulos.cidades.estado">Estado</label>
              <select id="filtroEstado" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.todos">Todos</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="filtroCidade" data-i18n="web.modulos.cidades.cidade">Cidade</label>
              <input type="text" id="filtroCidade" class="form-control" maxlength="40" data-i18n-placeholder="web.modulos.cidades.placeholderCidade" placeholder="Digite parte do nome...">
            </div>
            <div>
              <label for="filtroAreaDDD" data-i18n="web.modulos.cidades.areaDDD">Área DDD</label>
              <input type="number" id="filtroAreaDDD" class="form-control" min="0" data-i18n-placeholder="web.modulos.cidades.placeholderDDD" placeholder="Ex: 11, 21...">
            </div>
            <div>
              <label for="filtroMesoregiao" data-i18n="web.modulos.cidades.mesoregiao">Mesorregião</label>
              <select id="filtroMesoregiao" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.todas">Todas</option>
                <!-- Preenchido dinamicamente baseado no Estado -->
              </select>
            </div>
            <div>
              <label for="filtroMicroregiao" data-i18n="web.modulos.cidades.microregiao">Microrregião</label>
              <select id="filtroMicroregiao" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.todas">Todas</option>
                <!-- Preenchido dinamicamente baseado no Estado -->
              </select>
            </div>
            <div>
              <label for="filtroRegiaoFiscal" data-i18n="web.modulos.cidades.regiaoFiscal">Região Fiscal</label>
              <select id="filtroRegiaoFiscal" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.todas">Todas</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="filtroSituacao" data-i18n="web.modulos.cidades.situacao">Situação</label>
              <select id="filtroSituacao" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.todas">Todas</option>
                <option value="S" data-i18n="web.modulos.cidades.ativo">Ativo</option>
                <option value="N" data-i18n="web.modulos.cidades.inativo">Inativo</option>
              </select>
            </div>
          </div>
          <div class="filtros-actions">
            <button type="button" id="btnLimparFiltros" class="btn btn-secondary">
              <i class='bx bx-x'></i> <span data-i18n="web.modulos.cidades.limpar">Limpar</span>
            </button>
            <button type="submit" class="btn btn-primary">
              <i class='bx bx-search'></i> <span data-i18n="web.modulos.cidades.filtrar">Filtrar</span>
            </button>
          </div>
        </form>
      </div>
    </div>


    <!-- Grid -->
    <div class="tab-content" id="tab-grid">
      <div class="filtros-box">
        <h3 data-i18n="web.modulos.cidades.cidadesCadastradas">Cidades Cadastradas</h3>
        <div class="filtros-actions" style="justify-content: space-between; margin-top: 0; margin-bottom: 15px;">
          <button id="btnVoltarGrid" class="btn btn-secondary">
            <i class='bx bx-arrow-back'></i> <span data-i18n="web.modulos.cidades.voltarFiltros">Voltar aos Filtros</span>
          </button>
          <button id="btnNovoRegistroGrid" class="btn btn-primary">
            <i class='bx bx-plus'></i> <span data-i18n="web.modulos.cidades.novoRegistro">Novo Registro</span>
          </button>
        </div>
        <div id="cidadesGridCount" style="padding: 10px 0; color: #666; font-size: 14px; font-weight: 500;">
          <span id="cidadesGridCountText" data-i18n="web.modulos.cidades.registrosEncontrados">0 registro(s) encontrado(s)</span>
        </div>
        <div id="cidadesGrid" class="grid-container"></div>
      </div>
    </div>

    <!-- Dados -->
    <div class="tab-content" id="tab-dados">
      <div class="filtros-box">
        <h3 id="formTitle" data-i18n="web.modulos.cidades.novaCidade">Nova Cidade</h3>
        <form id="cidadeForm">
          <input type="hidden" id="cidadeId">
          
          <div class="filtros-grid">
            <div>
              <label for="cidadeMunicipio" data-i18n="web.modulos.cidades.codigoIBGE">Código IBGE *</label>
              <input type="number" id="cidadeMunicipio" class="form-control" required min="0">
            </div>
            <div>
              <label for="cidadePais" data-i18n="web.modulos.cidades.pais">País</label>
              <select id="cidadePais" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.selecione">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeEstado" data-i18n="web.modulos.cidades.estado">Estado *</label>
              <select id="cidadeEstado" class="form-control" required>
                <option value="" data-i18n="web.modulos.cidades.selecione">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeNome" data-i18n="web.modulos.cidades.cidadeObrigatorio">Cidade *</label>
              <input type="text" id="cidadeNome" class="form-control" required maxlength="40">
            </div>
            <div>
              <label for="cidadeAreaDDD" data-i18n="web.modulos.cidades.areaDDD">Área DDD</label>
              <div style="display: flex; gap: 8px; align-items: flex-end;">
                <input type="number" id="cidadeAreaDDD" class="form-control" min="0" style="flex: 1;">
                <button type="button" id="btnBuscarDDD" class="btn btn-info btn-sm" data-i18n-title="web.modulos.cidades.buscarDDDTitle" title="Buscar DDD pelo código IBGE">
                  <i class='bx bx-search'></i> <span data-i18n="web.modulos.cidades.buscar">Buscar</span>
                </button>
              </div>
            </div>
            <div>
              <label for="cidadeMesoregiao" data-i18n="web.modulos.cidades.mesoregiao">Mesorregião</label>
              <select id="cidadeMesoregiao" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.selecione">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeMicroregiao" data-i18n="web.modulos.cidades.microregiao">Microrregião</label>
              <select id="cidadeMicroregiao" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.selecione">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeRegiaoFiscal" data-i18n="web.modulos.cidades.regiaoFiscal">Região Fiscal</label>
              <select id="cidadeRegiaoFiscal" class="form-control">
                <option value="" data-i18n="web.modulos.cidades.selecione">Selecione</option>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
            <div>
              <label for="cidadeSituacao" data-i18n="web.modulos.cidades.situacao">Situação *</label>
              <select id="cidadeSituacao" class="form-control" required>
                <option value="S" data-i18n="web.modulos.cidades.ativo">Ativo</option>
                <option value="N" data-i18n="web.modulos.cidades.inativo">Inativo</option>
              </select>
            </div>
          </div>
          <div class="filtros-actions">
            <button type="submit" class="btn btn-primary">
              <i class='bx bx-save'></i> <span data-i18n="web.modulos.cidades.salvar">Salvar</span>
            </button>
            <button type="button" id="btnCancelar" class="btn btn-secondary">
              <i class='bx bx-x'></i> <span data-i18n="web.modulos.cidades.cancelar">Cancelar</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-content-tratamento">
        <div class="modal-header">
          <h3 data-i18n="web.modulos.cidades.confirmarAcao">Confirmar Ação</h3>
          <button class="close" onclick="document.getElementById('confirmModal').style.display='none'">
            <i class='bx bx-x'></i>
          </button>
        </div>
        <div class="modal-body">
          <p id="modalMessage"></p>
        </div>
        <div class="modal-actions">
          <button id="confirmYes" class="btn btn-primary" data-i18n="web.modulos.cidades.sim">Sim</button>
          <button id="confirmNo" class="btn btn-secondary" data-i18n="web.modulos.cidades.cancelar">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <!-- Cache Buster - deve ser o primeiro script -->
  <script src="/js/cache-buster.js?v=202612091200"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/log-helper.js"></script>
  <!-- GridEditor é carregado globalmente pelo dashboard.js -->
  <script src="js/script.js"></script>
</body>
</html>
