<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Marcas de Equipamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/modulos.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
      /* ========== Gerenciar Marcas - Identidade Atlas Cargo ========== */
      .marcas-container {
        padding: 20px;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      }

      .marcas-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--light-gray, #e2e8f0);
      }

      .marcas-header h2 {
        margin: 0;
        color: var(--ac-primary, #0d2137);
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* ========== BOTÕES - Atlas Cargo ========== */
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-right: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
        text-decoration: none;
        box-sizing: border-box;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        pointer-events: none;
      }

      .btn-primary {
        background: var(--ac-accent, #0ea5e9);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--ac-accent-hover, #0284c7);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
      }

      /* Botão destaque para "Novo Registro" */
      button.btn-primary[id*="NovoRegistro"],
      button.btn-primary[id*="NovoMarca"] {
        background: var(--success, #059669);
        color: white;
      }

      button.btn-primary[id*="NovoRegistro"]:hover:not(:disabled),
      button.btn-primary[id*="NovoMarca"]:hover:not(:disabled) {
        background: #047857;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
      }

      .btn-secondary {
        background: var(--gray, #64748b);
        color: white;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #475569;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(100, 116, 139, 0.3);
      }

      .btn-info {
        background: var(--ac-accent, #0ea5e9);
        color: white;
      }

      .btn-info:hover:not(:disabled) {
        background: var(--ac-accent-hover, #0284c7);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
      }

      .btn-sm {
        padding: 8px 16px;
        font-size: 14px;
      }

      .filtros-box {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: var(--shadow, 0 4px 6px -1px rgba(0,0,0,0.08));
        margin-bottom: 25px;
        border: 1px solid var(--border, #e2e8f0);
      }

      .filtros-box h3 {
        margin: 0 0 20px 0;
        color: var(--ac-primary, #0d2137);
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .filtros-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 15px;
      }

      .filtros-grid > div {
        display: flex;
        flex-direction: column;
      }

      .filtros-grid label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--dark, #1e293b);
        font-size: 14px;
      }

      .filtros-grid .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border, #e2e8f0);
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s;
        font-family: inherit;
        box-sizing: border-box;
        background-color: #fff;
      }

      .filtros-grid .form-control:focus {
        outline: none;
        border-color: var(--ac-accent, #0ea5e9);
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
      }

      .filtros-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 15px;
      }

      .filtros-actions .btn {
        margin-right: 0;
      }

      /* Ajustar largura da coluna de ações */
      #marcasGrid .grid-actions-header,
      #marcasGrid .grid-actions {
        width: 80px !important;
        min-width: 80px !important;
        max-width: 80px !important;
        text-align: center;
        padding: 8px 4px !important;
      }
      
      #marcasGrid .grid-actions {
        white-space: nowrap;
        justify-content: flex-start !important;
      }

      /* ========== MODAL DE AJUDA ========== */
      .modal-tratamento {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        align-items: center;
        justify-content: center;
      }

      .modal-tratamento.active {
        display: flex;
      }

      .modal-content-tratamento {
        background: white;
        border-radius: 12px;
        padding: 0;
        max-width: 800px;
        width: 90%;
        max-height: 90vh;
        box-shadow: 0 10px 40px rgba(13, 33, 55, 0.12);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border, #e2e8f0);
      }

      .modal-header-tratamento {
        padding: 20px 25px;
        border-bottom: 1px solid var(--border, #e2e8f0);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }

      .modal-header-tratamento h3 {
        margin: 0;
        color: var(--ac-primary, #0d2137);
        font-size: 24px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-close-modal {
        background: none;
        border: none;
        font-size: 24px;
        color: var(--gray, #64748b);
        cursor: pointer;
        padding: 5px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: all 0.2s;
      }

      .btn-close-modal:hover {
        background: var(--light-gray, #e2e8f0);
        color: var(--ac-primary, #0d2137);
      }

      .modal-body-tratamento {
        padding: 25px;
        max-height: calc(90vh - 140px);
        overflow-y: auto;
        flex: 1;
      }

      .modal-body-tratamento h4 {
        color: var(--ac-primary, #0d2137);
        margin-top: 20px;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: 600;
      }

      .modal-body-tratamento h4:first-child {
        margin-top: 0;
      }

      .modal-body-tratamento p {
        color: var(--dark, #1e293b);
        line-height: 1.6;
        margin-bottom: 15px;
      }

      .modal-body-tratamento ul {
        margin: 10px 0 20px 0;
        padding-left: 20px;
        color: var(--dark, #1e293b);
        line-height: 1.8;
      }

      .modal-body-tratamento li {
        margin: 8px 0;
      }

      .modal-body-tratamento strong {
        color: var(--ac-primary, #0d2137);
        font-weight: 600;
      }

      .modal-footer-tratamento {
        padding: 20px 25px;
        border-top: 1px solid var(--border, #e2e8f0);
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
      }
    </style>
</head>
<body>
    <div class="marcas-container">
      <!-- Header Padronizado -->
      <div class="marcas-header">
        <h2>
          <i class='bx bx-package'></i>
          <span data-i18n="web.modulos.marcas.titulo">Gerenciar Marcas de Equipamento</span>
        </h2>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button onclick="window.mostrarAjudaMarcas()" class="btn btn-info" title="Como funciona? Regras e instruções">
            <i class='bx bx-help-circle'></i> Ajuda
          </button>
        </div>
      </div>

      <!-- Abas -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="filtros" data-i18n="web.modulos.marcas.tabFiltros">Filtros</button>
        <button class="tab-btn" data-tab="grid" data-i18n="web.modulos.marcas.tabGrid">Grid</button>
        <button class="tab-btn" data-tab="dados" data-i18n="web.modulos.marcas.tabDados">Dados</button>
      </div>

      <!-- Filtros -->
      <div class="tab-content active" id="tab-filtros">
        <div class="filtros-box">
          <h3><i class='bx bx-filter'></i> Filtros</h3>
          <form id="filtroForm" onsubmit="return false;">
            <div class="filtros-grid">
              <div>
                <label for="filtroCodigo">Código</label>
                <input type="number" id="filtroCodigo" class="form-control" min="1">
              </div>
              <div>
                <label for="filtroDescricao">Descrição</label>
                <input type="text" id="filtroDescricao" class="form-control" maxlength="40">
              </div>
              <div>
                <label for="filtroSituacao">Situação</label>
                <select id="filtroSituacao" class="form-control">
                  <option value="">Todas</option>
                  <option value="S">Ativo</option>
                  <option value="N">Inativo</option>
                </select>
              </div>
            </div>
            <div class="filtros-actions">
              <button type="button" id="btnLimparFiltros" class="btn btn-secondary">
                <i class='bx bx-x'></i> Limpar
              </button>
              <button type="submit" class="btn btn-primary">
                <i class='bx bx-search'></i> Filtrar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Grid -->
      <div class="tab-content" id="tab-grid">
        <div class="form-box">
          <h2>Marcas de Equipamento - Visualização em Grid</h2>
          <div class="actions-top">
            <div style="display: flex; gap: 10px;">
              <button type="button" id="btnVoltarGrid" class="btn cancel">← <span data-i18n="web.modulos.cidades.voltarFiltros">Voltar aos Filtros</span></button>
            </div>
            <button type="button" id="btnNovoRegistroGrid" class="btn btn-primary">
              <i class='bx bx-plus'></i> <span data-i18n="web.modulos.marcas.novoRegistro">Novo Registro</span>
            </button>
          </div>
          <div id="marcasGridCount" style="padding: 10px 0; color: #666; font-size: 14px; font-weight: 500;">
            <span id="marcasGridCountText" data-i18n="web.modulos.cidades.registrosEncontrados">0 registro(s) encontrado(s)</span>
          </div>
          <div id="marcasGrid" class="grid-container">
            <p class="empty">Aplicar filtros para carregar o grid.</p>
          </div>
        </div>
      </div>

      <!-- Dados -->
      <div class="tab-content" id="tab-dados">
        <div class="form-box">
          <h2 id="formTitle" data-i18n="web.modulos.marcas.novaMarca">Nova Marca de Equipamento</h2>
          <form id="marcaForm">
            <div class="input-group triple">
              <div>
                <label for="marcaCodigo">Código</label>
                <input type="text" id="marcaCodigo" readonly>
              </div>
              <div>
                <label for="marcaDescricao">Descrição *</label>
                <input type="text" id="marcaDescricao" required maxlength="40">
              </div>
              <div>
                <label for="marcaSituacao">Situação *</label>
                <select id="marcaSituacao" required>
                  <option value="S">Ativo</option>
                  <option value="N">Inativo</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <i class='bx bx-save'></i> <span data-i18n="web.modulos.marcas.salvar">Salvar</span>
              </button>
              <button type="button" id="btnCancelar" class="btn btn-secondary">
                <i class='bx bx-x'></i> <span data-i18n="web.modulos.marcas.cancelar">Cancelar</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modal -->
      <div id="confirmModal" class="modal">
        <div class="modal-content">
          <h3 data-i18n="web.modulos.cidades.confirmarAcao">Confirmar Ação</h3>
          <p id="modalMessage"></p>
          <div class="modal-actions">
            <button id="confirmYes" class="btn delete" data-i18n="web.modulos.marcas.sim">Sim</button>
            <button id="confirmNo" class="btn cancel" data-i18n="web.modulos.marcas.cancelar">Cancelar</button>
          </div>
        </div>
      </div>

      <div id="message" class="message"></div>
    </div>

    <!-- Overlay de carregamento para init.sql -->
    <div id="loadingOverlayInitSQL" class="calculando-overlay" style="display: none;">
      <div class="calculando-content">
        <div class="calculando-spinner"></div>
        <h3 id="loadingTitleInitSQL">Processando Inicialização</h3>
        <p id="loadingTextInitSQL">Executando scripts de inicialização...</p>
        <p class="calculando-detalhe" id="loadingDetailInitSQL">Isso pode levar alguns segundos.</p>
      </div>
    </div>

    <!-- Cache Buster - deve ser o primeiro script -->
    <script src="/js/cache-buster.js?v=202612091200"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/grid-editor.js"></script>
    <script src="/js/log-helper.js"></script>
    <script src="/js/init-overlay-helper.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
