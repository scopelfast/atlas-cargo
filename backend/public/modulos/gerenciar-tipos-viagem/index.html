<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Tipos de Viagem</title>
    <link rel="stylesheet" href="/css/modulos.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
      /* ========== ESTILOS DO LAYOUT PADRONIZADO ========== */
      .tipos-viagem-container {
        padding: 20px;
      }

      .tipos-viagem-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e0e0e0;
      }

      .tipos-viagem-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* ========== BOTÕES - Padrão do Sistema ========== */
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-right: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
        text-decoration: none;
        box-sizing: border-box;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        pointer-events: none;
      }

      .btn-primary {
        background: #3498db;
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background: #2980b9;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
      }

      /* Botão verde para "Novo Registro" */
      button.btn-primary[id*="NovoRegistro"],
      button.btn-primary[id*="NovoTipo"] {
        background: #3DCC7F;
        color: white;
      }

      button.btn-primary[id*="NovoRegistro"]:hover:not(:disabled),
      button.btn-primary[id*="NovoTipo"]:hover:not(:disabled) {
        background: #2eb86b;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(61, 204, 127, 0.3);
      }

      .btn-secondary {
        background: #6c757d;
        color: white;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #5a6268;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
      }

      .btn-info {
        background: #17a2b8;
        color: white;
      }

      .btn-info:hover:not(:disabled) {
        background: #138496;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(23, 162, 184, 0.3);
      }

      .btn-cancel {
        background: #95a5a6;
        color: white;
      }

      .btn-cancel:hover:not(:disabled) {
        background: #7f8c8d;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(149, 165, 166, 0.3);
      }

      /* ========== FILTROS PADRONIZADOS ========== */
      .filtros-box {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin-bottom: 25px;
      }

      .filtros-box h3 {
        margin: 0 0 20px 0;
        color: #2c3e50;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .filtros-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 15px;
      }

      .filtros-grid > div {
        display: flex;
        flex-direction: column;
      }

      .filtros-grid label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #34495e;
        font-size: 14px;
      }

      .filtros-grid .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s;
        font-family: inherit;
        box-sizing: border-box;
        background-color: #fff;
        color: #2c3e50;
      }

      .filtros-grid .form-control:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }

      .filtros-grid .form-control:hover {
        border-color: #adb5bd;
      }

      .filtros-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 15px;
      }

      .filtros-actions .btn {
        margin-right: 0;
      }

      /* ========== MODAL DE AJUDA ========== */
      .modal-tratamento {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        align-items: center;
        justify-content: center;
      }

      .modal-content-tratamento {
        background: white;
        border-radius: 12px;
        padding: 0;
        max-width: 800px;
        width: 90%;
        max-height: 90vh;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
      }

      .modal-header-tratamento {
        padding: 20px 25px;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }

      .modal-header-tratamento h3 {
        margin: 0;
        color: #2c3e50;
        font-size: 24px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-close-modal {
        background: none;
        border: none;
        font-size: 24px;
        color: #666;
        cursor: pointer;
        padding: 5px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all 0.2s;
      }

      .btn-close-modal:hover {
        background: #f0f0f0;
        color: #333;
      }

      .modal-body-tratamento {
        padding: 25px;
        max-height: calc(90vh - 140px);
        overflow-y: auto;
        flex: 1;
      }

      .modal-body-tratamento h4 {
        color: #2c3e50;
        margin-top: 20px;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: 600;
      }

      .modal-body-tratamento h4:first-child {
        margin-top: 0;
      }

      .modal-body-tratamento p {
        color: #495057;
        line-height: 1.6;
        margin-bottom: 15px;
      }

      .modal-body-tratamento ul {
        margin: 10px 0 20px 0;
        padding-left: 20px;
        color: #495057;
        line-height: 1.8;
      }

      .modal-body-tratamento li {
        margin: 8px 0;
      }

      .modal-body-tratamento strong {
        color: #2c3e50;
        font-weight: 600;
      }

      .modal-footer-tratamento {
        padding: 20px 25px;
        border-top: 1px solid #e9ecef;
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
      }
    </style>
</head>
<body>
    <div class="tipos-viagem-container">
      <!-- Header Padronizado -->
      <div class="tipos-viagem-header">
        <h2>
          <i class='bx bx-trip' style="color: #3498db;"></i>
          Gerenciar Tipos de Viagem
        </h2>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="btn btn-info" onclick="window.mostrarAjudaTiposViagem()" title="Como funciona? Regras e instruções">
            <i class='bx bx-help-circle'></i> Ajuda
          </button>
        </div>
      </div>

      <!-- Abas -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="filtros">Filtros</button>
        <button class="tab-btn" data-tab="grid">Grid</button>
        <button class="tab-btn" data-tab="dados">Dados</button>
      </div>

      <!-- Filtros -->
      <div class="tab-content active" id="tab-filtros">
        <div class="filtros-box">
          <h3><i class='bx bx-filter'></i> Filtros</h3>
          <form id="filtroForm">
            <div class="filtros-grid">
              <div>
                <label for="filtroCodigo">Código</label>
                <input type="number" id="filtroCodigo" min="1" class="form-control">
              </div>
              <div>
                <label for="filtroDescricao">Descrição</label>
                <input type="text" id="filtroDescricao" maxlength="40" class="form-control">
              </div>
              <div>
                <label for="filtroSituacao">Situação</label>
                <select id="filtroSituacao" class="form-control">
                  <option value="">Todas</option>
                  <option value="S">Ativo</option>
                  <option value="N">Inativo</option>
                </select>
              </div>
            </div>
            <div class="filtros-actions">
              <button type="button" id="btnLimparFiltros" class="btn btn-secondary">
                <i class='bx bx-x'></i> Limpar
              </button>
              <button type="submit" class="btn btn-primary">
                <i class='bx bx-search'></i> Filtrar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Grid -->
      <div class="tab-content" id="tab-grid">
        <div class="form-box">
          <h2>Visualização em Grid</h2>
          <div class="actions-top">
            <button id="btnVoltarFiltorosGrid" class="btn btn-cancel">
              <i class='bx bx-arrow-back'></i> Voltar aos Filtros
            </button>
            <button id="btnNovoRegistroGrid" class="btn btn-primary">
              <i class='bx bx-plus'></i> Novo Registro
            </button>
          </div>
          <div id="tiposGridCount" style="padding: 10px 0; color: #666; font-size: 14px; font-weight: 500;">
            <span id="tiposGridCountText">0 registro(s) encontrado(s)</span>
          </div>
          <div id="tiposGrid" class="grid-container">
            <p class="empty">Aplicar filtros para carregar o grid.</p>
          </div>
        </div>
      </div>

      <!-- Dados -->
      <div class="tab-content" id="tab-dados">
        <div class="form-box">
          <h2 id="formTitle">Novo Tipo de Viagem</h2>
          <form id="tipoForm">
            <div class="input-group triple">
              <div>
                <label for="tipoCodigo">Código</label>
                <input type="text" id="tipoCodigo" readonly class="form-control">
              </div>
              <div>
                <label for="tipoDescricao">Descrição *</label>
                <input type="text" id="tipoDescricao" required maxlength="40" class="form-control">
              </div>
              <div>
                <label for="tipoSituacao">Situação *</label>
                <select id="tipoSituacao" required class="form-control">
                  <option value="S">Ativo</option>
                  <option value="N">Inativo</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <i class='bx bx-save'></i> Salvar
              </button>
              <button type="button" id="btnCancelar" class="btn btn-secondary">
                <i class='bx bx-x'></i> Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>

      <div id="confirmModal" class="modal">
        <div class="modal-content">
          <h3>Confirmar Ação</h3>
          <p id="modalMessage"></p>
          <div class="modal-actions">
            <button id="confirmYes" class="btn delete">Sim</button>
            <button id="confirmNo" class="btn cancel">Cancelar</button>
          </div>
        </div>
      </div>

      <div id="message" class="message"></div>
    </div>

    <!-- Overlay de carregamento para init.sql -->
    <div id="loadingOverlayInitSQL" class="calculando-overlay" style="display: none;">
      <div class="calculando-content">
        <div class="calculando-spinner"></div>
        <h3 id="loadingTitleInitSQL">Processando Inicialização</h3>
        <p id="loadingTextInitSQL">Executando scripts de inicialização...</p>
        <p class="calculando-detalhe" id="loadingDetailInitSQL">Isso pode levar alguns segundos.</p>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/js/cache-buster.js?v=202512091200"></script>
    <script src="/js/utils.js"></script>
    <!-- GridEditor: carregar apenas se ainda não estiver disponível -->
    <script>
      (function() {
        if (typeof window.GridEditor === 'undefined') {
          const script = document.createElement('script');
          script.src = '/js/grid-editor.js';
          document.head.appendChild(script);
        }
      })();
    </script>
    <script src="/js/init-overlay-helper.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
