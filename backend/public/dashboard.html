<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atlas Cargo</title>
  <link rel="icon" type="image/png" href="/img/logoAtlasTransparente.png" id="faviconLink">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    // INTERCEPTOR GLOBAL: Remover ? de todas as URLs
    (function() {
      function cleanUrl(url) {
        if (typeof url === 'string') {
          // Remover ? no final da URL e múltiplos ? seguidos
          return url.replace(/\?+$/, '').replace(/\?&/, '&');
        }
        return url;
      }
      
      // Interceptar location.replace
      const originalReplace = window.location.replace;
      window.location.replace = function(url) {
        const cleaned = cleanUrl(url);
        if (cleaned !== url) {
          console.warn('[URL CLEANER] Removendo ? de location.replace:', url, '→', cleaned);
        }
        return originalReplace.call(window.location, cleaned);
      };
      
      // Interceptar location.assign
      const originalAssign = window.location.assign;
      window.location.assign = function(url) {
        const cleaned = cleanUrl(url);
        if (cleaned !== url) {
          console.warn('[URL CLEANER] Removendo ? de location.assign:', url, '→', cleaned);
        }
        return originalAssign.call(window.location, cleaned);
      };
      
      // Função helper para limpar href antes de usar
      window.__cleanLocationHref = function(url) {
        return cleanUrl(url);
      };
      
      // Limpar URL atual se tiver ? no final
      if (window.location.href.endsWith('?')) {
        const cleanUrl = window.location.href.replace(/\?+$/, '');
        console.warn('[URL CLEANER] Limpando URL atual:', window.location.href, '→', cleanUrl);
        originalReplace.call(window.location, cleanUrl);
      }
      
      // Monitorar mudanças na URL usando setInterval
      let lastUrl = window.location.href;
      setInterval(function() {
        const currentUrl = window.location.href;
        if (currentUrl !== lastUrl && currentUrl.endsWith('?')) {
          const cleaned = currentUrl.replace(/\?+$/, '');
          console.warn('[URL CLEANER] Detectado ? na URL, limpando:', currentUrl, '→', cleaned);
          originalReplace.call(window.location, cleaned);
        }
        lastUrl = window.location.href;
      }, 100);
      
      // Interceptar popstate (navegação do histórico)
      window.addEventListener('popstate', function() {
        if (window.location.href.endsWith('?')) {
          const cleaned = window.location.href.replace(/\?+$/, '');
          console.warn('[URL CLEANER] Limpando ? após popstate:', window.location.href, '→', cleaned);
          originalReplace.call(window.location, cleaned);
        }
      });
    })();
    
    // Configuração transparente de protocolo - respeita HTTP ou HTTPS usado
    (function() {
      // Detectar se é ambiente local ou Atlas Cargo (mesmo produto)
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const isAtlasCargo = hostname.includes('atlas') || 
                           hostname.includes('atlas-cargo') || 
                           hostname.includes('atlascargo');
      
      // IMPORTANTE: Usar o protocolo atual da página SEM REDIRECIONAMENTO
      // Se acessar via HTTP, usar HTTP; se via HTTPS, usar HTTPS
      const protocoloAtual = window.location.protocol;
      
      // Usar exatamente o protocolo atual da página, SEM modificações
      let protocol = protocoloAtual;
      
      const host = window.location.host;
      
      // CRÍTICO: pathBase para estáticos (CSS, img). APIs ficam em /api ou /cargas/api — NUNCA em /dashboard/api.
      // Rota limpa /dashboard (sem .html) não é prefixo de deploy; antes virava __BASE_URL__=.../dashboard e quebrava fetch('/api/...').
      let pathBase = '/';
      const rawPath = window.location.pathname || '/';
      if (rawPath.indexOf('/cargas') !== -1) {
        pathBase = '/cargas/';
      } else if (rawPath.indexOf('/motorista') !== -1 && rawPath.indexOf('/cargas') === -1) {
        pathBase = '/motorista/';
      } else if (/\.html$/i.test(rawPath)) {
        const lastSlash = rawPath.lastIndexOf('/');
        pathBase = lastSlash > 0 ? rawPath.substring(0, lastSlash + 1) : '/';
      } else if (/^\/(dashboard|login)(\/|$)/.test(rawPath)) {
        pathBase = '/';
      } else if (rawPath !== '/' && rawPath.length > 1) {
        const segs = rawPath.split('/').filter(function(s) { return s; });
        if (segs.length > 0) {
          pathBase = '/' + segs[0] + '/';
        }
      }

      const baseUrl = protocol + '//' + host + (pathBase === '/' ? '' : pathBase.replace(/\/$/, ''));
      // Log de ambiente: localStorage.setItem('DEBUG_DASHBOARD','1') e recarregar
      try {
        if (localStorage.getItem('DEBUG_DASHBOARD') === '1') {
          console.log('[DASHBOARD] Ambiente: ATLAS CARGO | Protocol:', protocoloAtual, '| PathBase:', pathBase, '| BaseURL:', baseUrl);
        }
      } catch (e) {}
      
      // Função para garantir que URLs usem o mesmo protocolo da página
      // Função para garantir protocolo consistente
      // SIMPLES: se a URL tem protocolo diferente do atual, corrigir para o protocolo atual
      function garantirProtocoloConsistente(url) {
        if (!url) return url;
        
        // Se já tem protocolo completo e é diferente do protocolo atual, corrigir
        if (url.startsWith('https://') && protocoloAtual === 'http:') {
          return url.replace(/^https:/, 'http:');
        }
        
        if (url.startsWith('http://') && protocoloAtual === 'https:') {
          return url.replace(/^http:/, 'https:');
        }
        
        return url;
      }
      
      // Função para criar elementos com URLs absolutas
      function createLink(href) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        let url;
        
        if (href.startsWith('http')) {
          url = href; // URL absoluta
        } else if (href.startsWith('/')) {
          // Caminho absoluto: /css/style.css → baseUrl + /css/style.css
          url = baseUrl + href;
        } else {
          // Caminho relativo: css/style.css → baseUrl + /css/style.css
          url = baseUrl + '/' + href;
        }
        
        // Garantir protocolo consistente
        url = garantirProtocoloConsistente(url);
        
        // Usar setAttribute para forçar o valor
        link.setAttribute('href', url);
        
        // Adicionar tratamento de erro
        link.onerror = function() {
          console.error('❌ [DASHBOARD] Erro ao carregar CSS:', link.href);
          // Se falhou, tentar corrigir protocolo novamente
          if (link.href) {
            const urlCorrigida = garantirProtocoloConsistente(link.href);
            if (urlCorrigida !== link.href) {
              link.setAttribute('href', urlCorrigida);
              return;
            }
          }
          // Tentar carregar novamente após um delay
          setTimeout(() => {
            const newLink = document.createElement('link');
            newLink.rel = 'stylesheet';
            let retryUrl = link.href || url;
            retryUrl = garantirProtocoloConsistente(retryUrl);
            newLink.setAttribute('href', retryUrl + (retryUrl.includes('?') ? '&' : '?') + 'retry=' + Date.now());
            document.head.appendChild(newLink);
          }, 1000);
        };
        
        link.onload = function() { /* sucesso: sem log (evita poluir o console) */ };
        
        document.head.appendChild(link);
      }
      
      // Carregar CSS com cache busting dinâmico
      // Em desenvolvimento: usar timestamp atual (sempre atualizado)
      // Em produção: usar versão fixa (atualizada a cada deploy)
      const isDev = isLocal;
      const cacheVersion = isDev ? Date.now() : '20260506';
      
      // Armazenar globalmente para uso em scripts
      window.__CACHE_VERSION__ = cacheVersion;
      
      createLink(`/css/boxicons.min.css?v=${cacheVersion}`);
      createLink(`/css/modulos.css?v=${cacheVersion}`);
      createLink(`/css/dashboard.css?v=${cacheVersion}`);
      createLink(`/css/dashboard-adminlte.css?v=${cacheVersion}`);
      createLink(`/css/dark-mode.css?v=${cacheVersion}`);
      
      // Corrigir favicon
      const faviconLink = document.getElementById('faviconLink');
      if (faviconLink) {
        faviconLink.href = baseUrl + '/img/logoAtlasTransparente.png';
      }
      
      // Armazenar baseUrl globalmente
      window.__BASE_URL__ = baseUrl;
      
      // Função global para corrigir URLs - disponível para todos os scripts
      window.corrigirUrl = function(url) {
        if (!url) return url;
        if (url.startsWith('http://') || url.startsWith('https://')) return url;
        const cleanUrl = url.startsWith('/') ? url : '/' + url;
        // REST: sempre na raiz do host (ou /cargas), nunca sob /dashboard
        if (cleanUrl.startsWith('/api/')) {
          const pn = window.location.pathname || '';
          if (pn.indexOf('/cargas') !== -1) {
            return window.location.origin + '/cargas' + cleanUrl;
          }
          return window.location.origin + cleanUrl;
        }
        if (cleanUrl.startsWith('/cargas/api/')) {
          return window.location.origin + cleanUrl;
        }

        let baseUrl = window.__BASE_URL__;
        if (!baseUrl) {
          const pathname = window.location.pathname || '/';
          let pathBase = '/';
          if (pathname.indexOf('/cargas') !== -1) {
            pathBase = '/cargas/';
          } else if (pathname.indexOf('/motorista') !== -1 && pathname.indexOf('/cargas') === -1) {
            pathBase = '/motorista/';
          } else if (/^\/(dashboard|login)(\/|$)/.test(pathname)) {
            pathBase = '/';
          } else if (pathname !== '/' && pathname.length > 1 && !/\.html$/i.test(pathname)) {
            var segments = pathname.split('/').filter(function(s) { return s; });
            if (segments.length > 0) {
              pathBase = '/' + segments[0] + '/';
            }
          } else if (/\.html$/i.test(pathname)) {
            var ls = pathname.lastIndexOf('/');
            pathBase = ls > 0 ? pathname.substring(0, ls + 1) : '/';
          }
          baseUrl = window.location.protocol + '//' + window.location.host + (pathBase === '/' ? '' : pathBase.replace(/\/$/, ''));
        }
        const cleanBaseUrl = baseUrl.replace(/\/$/, '');
        return cleanBaseUrl + cleanUrl;
      };
      
      // Interceptar fetch() globalmente: corrigir URLs + JWT nas chamadas /api (módulos legados sem getAuthHeaders)
      function atlasDashboardBearerSkip(pathname) {
        if (!pathname || pathname.indexOf('/api') === -1) return true;
        var skip = [
          '/api/auth/login',
          '/api/motorista/login',
          '/api/motorista/cadastro',
          '/api/motorista/recuperar-senha',
          '/api/motorista/redefinir-senha',
          '/api/motorista/config',
          '/api/motorista/classes-frota-combo',
          '/api/motorista/sos',
          '/api/public/'
        ];
        for (var i = 0; i < skip.length; i++) {
          if (pathname.indexOf(skip[i]) !== -1) return true;
        }
        return false;
      }
      function atlasAttachBearerIfNeeded(input, init) {
        try {
          var token = typeof localStorage !== 'undefined' ? localStorage.getItem('token') : null;
          if (!token) return init;
          var urlStr = typeof input === 'string' ? input : (input && input.url) ? input.url : '';
          if (!urlStr) return init;
          var u = new URL(urlStr, window.location.origin);
          if (atlasDashboardBearerSkip(u.pathname)) return init;
          var hasAuth = false;
          if (init && init.headers) {
            if (typeof Headers !== 'undefined' && init.headers instanceof Headers) {
              hasAuth = init.headers.has('Authorization');
            } else {
              hasAuth = !!(init.headers.Authorization || init.headers.authorization);
            }
          }
          if (!hasAuth && typeof Request !== 'undefined' && input instanceof Request) {
            hasAuth = !!input.headers.get('Authorization');
          }
          if (hasAuth) return init;
          init = init ? Object.assign({}, init) : {};
          if (typeof Headers !== 'undefined' && init.headers instanceof Headers) {
            var h = new Headers(init.headers);
            h.set('Authorization', 'Bearer ' + token);
            init.headers = h;
          } else {
            init.headers = Object.assign({}, init.headers || {});
            init.headers.Authorization = 'Bearer ' + token;
          }
          return init;
        } catch (e) {
          return init;
        }
      }
      const originalFetch = window.fetch;
      window.fetch = function(input, init) {
        if (typeof input === 'string' && !input.startsWith('http://') && !input.startsWith('https://') && input.startsWith('/')) {
          input = window.corrigirUrl(input);
        } else if (input && typeof input === 'object' && input.url && !input.url.startsWith('http://') && !input.url.startsWith('https://') && input.url.startsWith('/')) {
          const correctedUrl = window.corrigirUrl(input.url);
          input = new Request(correctedUrl, input);
        }
        init = atlasAttachBearerIfNeeded(input, init);
        return originalFetch.call(this, input, init).then(function(response) {
          if (response.status !== 401) return response;
          try {
            if (typeof localStorage !== 'undefined' && !localStorage.getItem('token')) return response;
            var urlStr = typeof input === 'string' ? input : (input && input.url) ? input.url : '';
            if (!urlStr) return response;
            var u = new URL(urlStr, window.location.origin);
            var path = (u.pathname || '').toLowerCase();
            if (path.indexOf('/api/auth/') === 0 || path.indexOf('/cargas/api/auth/') === 0) return response;
            var clone = response.clone();
            clone.json().then(function(data) {
              if (!data || data.code !== 'SESSION_REVOKED') return;
              if (typeof window.__atlasExecuteTowerLogout === 'function') {
                window.__atlasExecuteTowerLogout();
              } else {
                try {
                  localStorage.clear();
                  sessionStorage.clear();
                } catch (e) {}
                var pb = (window.location.pathname && window.location.pathname.indexOf('/cargas') !== -1) ? '/cargas' : '';
                window.location.replace(window.location.origin + pb + '/?atlas_sessao=deslocada');
              }
            }).catch(function() { /* corpo não-JSON */ });
          } catch (e) { /* ignore */ }
          return response;
        });
      };
    })();
  </script>
</head>
<body>
  <script>

  <div class="sidebar">

    <div class="content-box">
      <div id="contentArea">
        <!-- Área de Boas-vindas -->

          <h3 data-i18n="web.dashboard.bemVindo">Bem-vindo ao sistema!</h3>

        <!-- Área de Conteúdo Customizável - Edite este bloco conforme necessário -->

  <script>
    // Fallback inline para funções críticas (caso ambiente-utils.js não carregue)
    (function() {
      if (typeof window.obterAmbiente === 'undefined') {
        window.obterAmbiente = function() {
          const hostname = window.location.hostname;
          return (hostname === 'localhost' || hostname === '127.0.0.1' || hostname.startsWith('192.168.')) ? 'local' : 'producao';
        };
        window.obterUrlBaseSync = function() {
          return window.location.origin;
        };
        window.obterUrlBase = async function() {
          return window.location.origin;
        };
      }
    })();

      // Carregar scripts com URLs absolutas - SEQUENCIALMENTE
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const baseUrl = window.__BASE_URL__ || window.location.origin;
      
      function loadScript(src, callback, retries = 2) {
        const script = document.createElement('script');
        // Se for local, forçar HTTP; senão usar protocolo atual
        let url;
        if (isLocal) {
          // Sempre forçar HTTP em local, mesmo se src já tiver protocolo
          if (src.startsWith('http://') || src.startsWith('https://')) {
            url = src.replace(/^https?:/, 'http:');
          } else {
            url = 'http://' + window.location.host + (src.startsWith('/') ? src : '/' + src);
          }
        } else {
          if (src.startsWith('http')) {
            url = src;
          } else if (src.startsWith('/')) {
            // Caminho absoluto: /js/dashboard.js → baseUrl + /js/dashboard.js
            url = baseUrl + src;
          } else {
            // Caminho relativo: js/dashboard.js → baseUrl + /js/dashboard.js
            url = baseUrl + '/' + src;
          }
        }
        // Definir src diretamente e verificar se foi alterado
        script.src = url;
        // Verificar se o navegador mudou para HTTPS e corrigir
        if (isLocal && script.src.startsWith('https://')) {
          console.warn('[loadScript] Navegador mudou para HTTPS, corrigindo:', script.src, '→', url);
          script.src = url; // Forçar novamente
        }
        
        let attempts = 0;
        const maxAttempts = retries;
        
        script.onerror = function() {
          attempts++;
          console.error('❌ Erro ao carregar script:', this.src, `(tentativa ${attempts}/${maxAttempts + 1})`);
          
          // Tentar novamente se houver tentativas restantes
          if (attempts <= maxAttempts) {
            setTimeout(() => {
              loadScript(src, callback, maxAttempts - attempts);
            }, 1000);
          } else {
            // Criar stubs para funções críticas se o script falhar completamente
            if (src.includes('ambiente-utils.js')) {
              console.warn('⚠️ ambiente-utils.js não carregou, usando fallback inline');
              // Já está definido acima como fallback
            } else if (src.includes('utils.js')) {
              console.warn('⚠️ utils.js não carregou, criando stubs básicos');
              if (typeof window.showMessage === 'undefined') {
                window.showMessage = function(msg, type) { alert(msg); };
              }
            } else if (src.includes('permissions.js')) {
              console.warn('⚠️ permissions.js não carregou');
            } else if (src.includes('log-helper.js')) {
              console.warn('⚠️ log-helper.js não carregou');
              if (typeof window.logAcao === 'undefined') {
                window.logAcao = function() {}; // Stub vazio
              }
            }
            if (callback) callback(false);
          }
        };
        
        script.onload = function() {
          if (callback) callback(true);
        };
        
        document.body.appendChild(script);
      }
      
      // Carregar scripts sequencialmente
      // Usar cacheVersion dinâmico (timestamp em dev, versão fixa em produção)
      const isDevScripts = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' || 
                           window.location.hostname.startsWith('192.168.');
      const cacheVer = isDevScripts ? Date.now() : '20260102';
      
      const scripts = [
        `/js/ambiente-utils.js?v=${cacheVer}`,
        `/js/utils.js?v=${cacheVer}`,
        `/js/permissions.js?v=${cacheVer}`,
        `/js/log-helper.js?v=${cacheVer}`,
        `/js/i18n-web.js?v=${cacheVer}`,
        `/js/dashboard.js?v=${cacheVer}`
      ];
      
      let index = 0;
      let hasErrors = false;
      function loadNext() {
        if (index < scripts.length) {
          loadScript(scripts[index], function(success) {
            if (!success) {
              console.warn('⚠️ Script falhou, mas continuando:', scripts[index]);
              hasErrors = true;
            }
            index++;
            loadNext();
          });
        } else {
          // Todos os scripts foram processados
          // Dashboard.js já inicializa automaticamente quando carrega
        }
      }
      
      loadNext();
    })();
    
    // Tratamento global de erros (diagnóstico: script que pode ter causado parse error)
    window.addEventListener('error', function(e) {
      const msg = e.message || (e.error && e.error.message) || '';
      const isParseError = /unexpected end of input|unexpected token/i.test(msg);
      let extra = '';
      if (isParseError && (window.__dashboardLastLoadingScript || window.__dashboardLastLoadedScript)) {
        extra = ' | Script em carga: ' + (window.__dashboardLastLoadingScript || '?') +
                ' | Último carregado: ' + (window.__dashboardLastLoadedScript || '?');
      }
      console.error('❌ Erro global capturado:', msg, '| filename:', e.filename, '| linha:', e.lineno, '| col:', e.colno || '-', extra);
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('❌ Promise rejeitada não tratada:', e.reason);
    });
  </script>
</body>
</html>
