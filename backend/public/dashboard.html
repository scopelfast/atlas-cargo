<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sys - Divulga Cargas</title>
  <link rel="icon" type="image/png" href="/img/logo7.png" id="faviconLink">
  <script>
    // Configuração de base URL - suporta HTTP e HTTPS
    (function() {
      // Detectar se é ambiente local
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      
      // Se estiver em local e usando HTTPS, redirecionar imediatamente
      if (isLocal && window.location.protocol === 'https:') {
        console.warn('[DASHBOARD] HTTPS detectado em local, redirecionando para HTTP...');
        window.location.replace('http://' + window.location.host + window.location.pathname + window.location.search);
        return; // Parar execução até redirecionar
      }
      
      // Forçar HTTP em desenvolvimento local
      const protocol = isLocal ? 'http:' : window.location.protocol;
      const host = window.location.host;
      const baseUrl = protocol + '//' + host;
      
      console.log('[DASHBOARD] Ambiente:', isLocal ? 'LOCAL (HTTP forçado)' : 'PRODUÇÃO', '| Protocol:', protocol, '| BaseURL:', baseUrl);
      
      // Função para criar elementos com URLs absolutas
      function createLink(href) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        // Se for local, forçar HTTP; senão usar protocolo atual
        let url;
        if (isLocal) {
          // Sempre forçar HTTP em local, mesmo se href já tiver protocolo
          if (href.startsWith('http://') || href.startsWith('https://')) {
            url = href.replace(/^https?:/, 'http:');
          } else {
            url = 'http://' + host + (href.startsWith('/') ? href : '/' + href);
          }
        } else {
          url = href.startsWith('http') ? href : baseUrl + (href.startsWith('/') ? href : '/' + href);
        }
        // Definir href diretamente e verificar se foi alterado
        link.href = url;
        // Verificar se o navegador mudou para HTTPS e corrigir
        if (isLocal && link.href.startsWith('https://')) {
          console.warn('[createLink] Navegador mudou para HTTPS, corrigindo:', link.href, '→', url);
          link.href = url; // Forçar novamente
        }
        document.head.appendChild(link);
      }
      
      // Carregar CSS com cache busting dinâmico
      // Em desenvolvimento: usar timestamp atual (sempre atualizado)
      // Em produção: usar versão fixa (atualizada a cada deploy)
      const isDev = isLocal;
      const cacheVersion = isDev ? Date.now() : '20250102';
      
      // Armazenar globalmente para uso em scripts
      window.__CACHE_VERSION__ = cacheVersion;
      
      createLink(`/css/boxicons.min.css?v=${cacheVersion}`);
      createLink(`/css/modulos.css?v=${cacheVersion}`);
      createLink(`/css/dashboard.css?v=${cacheVersion}`);
      
      // Corrigir favicon
      const faviconLink = document.getElementById('faviconLink');
      if (faviconLink) {
        faviconLink.href = (isLocal ? 'http://' + host : baseUrl) + '/img/logo7.png';
      }
      
      // Armazenar baseUrl globalmente
      window.__BASE_URL__ = baseUrl;
    })();
  </script>
</head>
<body>
  <div class="sidebar">
    <div class="logo">
      <h1>Divulga<span>Carga</span></h1>
    </div>
    <div class="menu" id="menuContainer">
      <div class="menu-item">
        <span>Carregando menu...</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="toggle-menu-btn" id="toggleMenuBtn" title="Recolher/Expandir Menu">
          <i class='bx bx-chevron-left' id="toggleMenuIcon"></i>
        </button>
        <div class="user-info">
          <h2 id="userName">Carregando...</h2>
          <p id="userEmail">-</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="logout-btn" id="docLink" style="background: #3498db; padding: 10px 20px;">
          <i class='bx bx-book' style="margin-right: 5px;"></i>Documentação CSS
        </button>
        <button class="logout-btn" id="logoutBtn">Sair</button>
      </div>
    </div>

    <div class="content-box">
      <div id="contentArea">
        <!-- Área de Boas-vindas -->
        <div class="welcome-section">
          <h3>Bem-vindo ao sistema!</h3>
          <p>Selecione uma opção no menu lateral para começar.</p>
        </div>

        <!-- Área de Conteúdo Customizável - Edite este bloco conforme necessário -->
        <div class="advertisement-section" id="customContentBlock">
          <!-- Adicione seu conteúdo aqui -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Fallback inline para funções críticas (caso ambiente-utils.js não carregue)
    (function() {
      if (typeof window.obterAmbiente === 'undefined') {
        window.obterAmbiente = function() {
          const hostname = window.location.hostname;
          return (hostname === 'localhost' || hostname === '127.0.0.1' || hostname.startsWith('192.168.')) ? 'local' : 'producao';
        };
        window.obterUrlBaseSync = function() {
          return window.location.origin;
        };
        window.obterUrlBase = async function() {
          return window.location.origin;
        };
      }
    })();

      // Carregar scripts com URLs absolutas - SEQUENCIALMENTE
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const baseUrl = window.__BASE_URL__ || window.location.origin;
      
      function loadScript(src, callback, retries = 2) {
        const script = document.createElement('script');
        // Se for local, forçar HTTP; senão usar protocolo atual
        let url;
        if (isLocal) {
          // Sempre forçar HTTP em local, mesmo se src já tiver protocolo
          if (src.startsWith('http://') || src.startsWith('https://')) {
            url = src.replace(/^https?:/, 'http:');
          } else {
            url = 'http://' + window.location.host + (src.startsWith('/') ? src : '/' + src);
          }
        } else {
          url = src.startsWith('http') ? src : baseUrl + (src.startsWith('/') ? src : '/' + src);
        }
        // Definir src diretamente e verificar se foi alterado
        script.src = url;
        // Verificar se o navegador mudou para HTTPS e corrigir
        if (isLocal && script.src.startsWith('https://')) {
          console.warn('[loadScript] Navegador mudou para HTTPS, corrigindo:', script.src, '→', url);
          script.src = url; // Forçar novamente
        }
        
        let attempts = 0;
        const maxAttempts = retries;
        
        script.onerror = function() {
          attempts++;
          console.error('❌ Erro ao carregar script:', this.src, `(tentativa ${attempts}/${maxAttempts + 1})`);
          
          // Tentar novamente se houver tentativas restantes
          if (attempts <= maxAttempts) {
            setTimeout(() => {
              loadScript(src, callback, maxAttempts - attempts);
            }, 1000);
          } else {
            // Criar stubs para funções críticas se o script falhar completamente
            if (src.includes('ambiente-utils.js')) {
              console.warn('⚠️ ambiente-utils.js não carregou, usando fallback inline');
              // Já está definido acima como fallback
            } else if (src.includes('utils.js')) {
              console.warn('⚠️ utils.js não carregou, criando stubs básicos');
              if (typeof window.showMessage === 'undefined') {
                window.showMessage = function(msg, type) { alert(msg); };
              }
            } else if (src.includes('permissions.js')) {
              console.warn('⚠️ permissions.js não carregou');
            } else if (src.includes('log-helper.js')) {
              console.warn('⚠️ log-helper.js não carregou');
              if (typeof window.logAcao === 'undefined') {
                window.logAcao = function() {}; // Stub vazio
              }
            }
            if (callback) callback(false);
          }
        };
        
        script.onload = function() {
          if (callback) callback(true);
        };
        
        document.body.appendChild(script);
      }
      
      // Carregar scripts sequencialmente
      // Usar cacheVersion dinâmico (timestamp em dev, versão fixa em produção)
      const isDevScripts = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' || 
                           window.location.hostname.startsWith('192.168.');
      const cacheVer = isDevScripts ? Date.now() : '20250102';
      
      const scripts = [
        `/js/ambiente-utils.js?v=${cacheVer}`,
        `/js/utils.js?v=${cacheVer}`,
        `/js/permissions.js?v=${cacheVer}`,
        `/js/log-helper.js?v=${cacheVer}`,
        `/js/dashboard.js?v=${cacheVer}`
      ];
      
      let index = 0;
      let hasErrors = false;
      function loadNext() {
        if (index < scripts.length) {
          loadScript(scripts[index], function(success) {
            if (!success) {
              console.warn('⚠️ Script falhou, mas continuando:', scripts[index]);
              hasErrors = true;
            }
            index++;
            loadNext();
          });
        } else {
          // Todos os scripts foram processados
          // Dashboard.js já inicializa automaticamente quando carrega
        }
      }
      
      loadNext();
    })();
    
    // Tratamento global de erros
    window.addEventListener('error', function(e) {
      console.error('❌ Erro global capturado:', e.error, e.message, e.filename, e.lineno);
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('❌ Promise rejeitada não tratada:', e.reason);
    });
  </script>
</body>
</html>
