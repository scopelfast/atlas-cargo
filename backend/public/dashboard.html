<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sys - Divulga Cargas</title>
  <link rel="icon" type="image/png" href="/img/logo7.png" id="faviconLink">
  <script>
    // INTERCEPTOR GLOBAL: Remover ? de todas as URLs
    (function() {
      function cleanUrl(url) {
        if (typeof url === 'string') {
          // Remover ? no final da URL e múltiplos ? seguidos
          return url.replace(/\?+$/, '').replace(/\?&/, '&');
        }
        return url;
      }
      
      // Interceptar location.replace
      const originalReplace = window.location.replace;
      window.location.replace = function(url) {
        const cleaned = cleanUrl(url);
        if (cleaned !== url) {
          console.warn('[URL CLEANER] Removendo ? de location.replace:', url, '→', cleaned);
        }
        return originalReplace.call(window.location, cleaned);
      };
      
      // Interceptar location.assign
      const originalAssign = window.location.assign;
      window.location.assign = function(url) {
        const cleaned = cleanUrl(url);
        if (cleaned !== url) {
          console.warn('[URL CLEANER] Removendo ? de location.assign:', url, '→', cleaned);
        }
        return originalAssign.call(window.location, cleaned);
      };
      
      // Função helper para limpar href antes de usar
      window.__cleanLocationHref = function(url) {
        return cleanUrl(url);
      };
      
      // Limpar URL atual se tiver ? no final
      if (window.location.href.endsWith('?')) {
        const cleanUrl = window.location.href.replace(/\?+$/, '');
        console.warn('[URL CLEANER] Limpando URL atual:', window.location.href, '→', cleanUrl);
        originalReplace.call(window.location, cleanUrl);
      }
      
      // Monitorar mudanças na URL usando setInterval
      let lastUrl = window.location.href;
      setInterval(function() {
        const currentUrl = window.location.href;
        if (currentUrl !== lastUrl && currentUrl.endsWith('?')) {
          const cleaned = currentUrl.replace(/\?+$/, '');
          console.warn('[URL CLEANER] Detectado ? na URL, limpando:', currentUrl, '→', cleaned);
          originalReplace.call(window.location, cleaned);
        }
        lastUrl = window.location.href;
      }, 100);
      
      // Interceptar popstate (navegação do histórico)
      window.addEventListener('popstate', function() {
        if (window.location.href.endsWith('?')) {
          const cleaned = window.location.href.replace(/\?+$/, '');
          console.warn('[URL CLEANER] Limpando ? após popstate:', window.location.href, '→', cleaned);
          originalReplace.call(window.location, cleaned);
        }
      });
    })();
    
    // Configuração transparente de protocolo - respeita HTTP ou HTTPS usado
    (function() {
      // Detectar se é ambiente local ou IntegraBrasil
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const isIntegraBrasil = hostname === 'app.integrabrasil.com' || 
                              hostname === 'beta.integrabrasil.com' || 
                              hostname.includes('integrabrasil.com');
      
      // IMPORTANTE: Usar o protocolo atual da página SEM REDIRECIONAMENTO
      // Se acessar via HTTP, usar HTTP; se via HTTPS, usar HTTPS
      const protocoloAtual = window.location.protocol;
      
      // Usar exatamente o protocolo atual da página, SEM modificações
      let protocol = protocoloAtual;
      
      const host = window.location.host;
      
      // CRÍTICO: Detectar o caminho base (subdiretório) da aplicação
      // Se a página está em /cargas/, o baseUrl deve incluir /cargas/
      let pathBase = window.location.pathname;
      if (pathBase.endsWith('.html')) {
        const lastSlash = pathBase.lastIndexOf('/');
        if (lastSlash > 0) {
          pathBase = pathBase.substring(0, lastSlash + 1);
        } else {
          pathBase = '/';
        }
      } else if (!pathBase.endsWith('/')) {
        pathBase = pathBase + '/';
      }
      
      const baseUrl = protocol + '//' + host + (pathBase === '/' ? '' : pathBase.replace(/\/$/, ''));
      
      console.log('[DASHBOARD] Ambiente:', (isLocal || isIntegraBrasil) ? 'LOCAL/INTEGRABRASIL' : 'PRODUÇÃO', '| Protocol:', protocoloAtual, '| PathBase:', pathBase, '| BaseURL:', baseUrl);
      
      // Função para garantir que URLs usem o mesmo protocolo da página
      // Função para garantir protocolo consistente
      // SIMPLES: se a URL tem protocolo diferente do atual, corrigir para o protocolo atual
      function garantirProtocoloConsistente(url) {
        if (!url) return url;
        
        // Se já tem protocolo completo e é diferente do protocolo atual, corrigir
        if (url.startsWith('https://') && protocoloAtual === 'http:') {
          return url.replace(/^https:/, 'http:');
        }
        
        if (url.startsWith('http://') && protocoloAtual === 'https:') {
          return url.replace(/^http:/, 'https:');
        }
        
        return url;
      }
      
      // Função para criar elementos com URLs absolutas
      function createLink(href) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        let url;
        
        if (href.startsWith('http')) {
          url = href; // URL absoluta
        } else if (href.startsWith('/')) {
          // Caminho absoluto: /css/style.css → baseUrl + /css/style.css
          url = baseUrl + href;
        } else {
          // Caminho relativo: css/style.css → baseUrl + /css/style.css
          url = baseUrl + '/' + href;
        }
        
        // Garantir protocolo consistente
        url = garantirProtocoloConsistente(url);
        
        // Usar setAttribute para forçar o valor
        link.setAttribute('href', url);
        
        // Adicionar tratamento de erro
        link.onerror = function() {
          console.error('❌ [DASHBOARD] Erro ao carregar CSS:', link.href);
          // Se falhou, tentar corrigir protocolo novamente
          if (link.href) {
            const urlCorrigida = garantirProtocoloConsistente(link.href);
            if (urlCorrigida !== link.href) {
              console.log('🔄 [DASHBOARD] Tentando carregar CSS com protocolo corrigido:', urlCorrigida);
              link.setAttribute('href', urlCorrigida);
              return;
            }
          }
          // Tentar carregar novamente após um delay
          setTimeout(() => {
            console.log('🔄 [DASHBOARD] Tentando carregar novamente:', link.href);
            const newLink = document.createElement('link');
            newLink.rel = 'stylesheet';
            let retryUrl = link.href || url;
            retryUrl = garantirProtocoloConsistente(retryUrl);
            newLink.setAttribute('href', retryUrl + (retryUrl.includes('?') ? '&' : '?') + 'retry=' + Date.now());
            document.head.appendChild(newLink);
          }, 1000);
        };
        
        link.onload = function() {
          console.log('✅ [DASHBOARD] CSS carregado:', url);
        };
        
        document.head.appendChild(link);
      }
      
      // Carregar CSS com cache busting dinâmico
      // Em desenvolvimento: usar timestamp atual (sempre atualizado)
      // Em produção: usar versão fixa (atualizada a cada deploy)
      const isDev = isLocal;
      const cacheVersion = isDev ? Date.now() : '20250102';
      
      // Armazenar globalmente para uso em scripts
      window.__CACHE_VERSION__ = cacheVersion;
      
      createLink(`/css/boxicons.min.css?v=${cacheVersion}`);
      createLink(`/css/modulos.css?v=${cacheVersion}`);
      createLink(`/css/dashboard.css?v=${cacheVersion}`);
      
      // Corrigir favicon
      const faviconLink = document.getElementById('faviconLink');
      if (faviconLink) {
        faviconLink.href = baseUrl + '/img/logo7.png';
      }
      
      // Armazenar baseUrl globalmente
      window.__BASE_URL__ = baseUrl;
    })();
  </script>
</head>
<body>
  <div class="sidebar">
    <div class="logo" id="logoDivulgaCarga" style="cursor: pointer;" title="Voltar ao início">
      <h1>Divulga<span>Carga</span></h1>
    </div>
    <div class="menu" id="menuContainer">
      <div class="menu-item">
        <span>Carregando menu...</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="toggle-menu-btn" id="toggleMenuBtn" title="Recolher/Expandir Menu">
          <i class='bx bx-chevron-left' id="toggleMenuIcon"></i>
        </button>
        <div class="user-info">
          <h2 id="userName">Carregando...</h2>
          <p id="userEmail">-</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="logout-btn" id="docLink" style="background: #3498db; padding: 10px 20px;">
          <i class='bx bx-book' style="margin-right: 5px;"></i>Documentação CSS
        </button>
        <button class="logout-btn" id="logoutBtn">Sair</button>
      </div>
    </div>

    <div class="content-box">
      <div id="contentArea">
        <!-- Área de Boas-vindas -->
        <div class="welcome-section">
          <h3>Bem-vindo ao sistema!</h3>
          <p>Selecione uma opção no menu lateral para começar.</p>
        </div>

        <!-- Área de Conteúdo Customizável - Edite este bloco conforme necessário -->
        <div class="advertisement-section" id="customContentBlock">
          <!-- Adicione seu conteúdo aqui -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Fallback inline para funções críticas (caso ambiente-utils.js não carregue)
    (function() {
      if (typeof window.obterAmbiente === 'undefined') {
        window.obterAmbiente = function() {
          const hostname = window.location.hostname;
          return (hostname === 'localhost' || hostname === '127.0.0.1' || hostname.startsWith('192.168.')) ? 'local' : 'producao';
        };
        window.obterUrlBaseSync = function() {
          return window.location.origin;
        };
        window.obterUrlBase = async function() {
          return window.location.origin;
        };
      }
    })();

      // Carregar scripts com URLs absolutas - SEQUENCIALMENTE
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const baseUrl = window.__BASE_URL__ || window.location.origin;
      
      function loadScript(src, callback, retries = 2) {
        const script = document.createElement('script');
        // Se for local, forçar HTTP; senão usar protocolo atual
        let url;
        if (isLocal) {
          // Sempre forçar HTTP em local, mesmo se src já tiver protocolo
          if (src.startsWith('http://') || src.startsWith('https://')) {
            url = src.replace(/^https?:/, 'http:');
          } else {
            url = 'http://' + window.location.host + (src.startsWith('/') ? src : '/' + src);
          }
        } else {
          if (src.startsWith('http')) {
            url = src;
          } else if (src.startsWith('/')) {
            // Caminho absoluto: /js/dashboard.js → baseUrl + /js/dashboard.js
            url = baseUrl + src;
          } else {
            // Caminho relativo: js/dashboard.js → baseUrl + /js/dashboard.js
            url = baseUrl + '/' + src;
          }
        }
        // Definir src diretamente e verificar se foi alterado
        script.src = url;
        // Verificar se o navegador mudou para HTTPS e corrigir
        if (isLocal && script.src.startsWith('https://')) {
          console.warn('[loadScript] Navegador mudou para HTTPS, corrigindo:', script.src, '→', url);
          script.src = url; // Forçar novamente
        }
        
        let attempts = 0;
        const maxAttempts = retries;
        
        script.onerror = function() {
          attempts++;
          console.error('❌ Erro ao carregar script:', this.src, `(tentativa ${attempts}/${maxAttempts + 1})`);
          
          // Tentar novamente se houver tentativas restantes
          if (attempts <= maxAttempts) {
            setTimeout(() => {
              loadScript(src, callback, maxAttempts - attempts);
            }, 1000);
          } else {
            // Criar stubs para funções críticas se o script falhar completamente
            if (src.includes('ambiente-utils.js')) {
              console.warn('⚠️ ambiente-utils.js não carregou, usando fallback inline');
              // Já está definido acima como fallback
            } else if (src.includes('utils.js')) {
              console.warn('⚠️ utils.js não carregou, criando stubs básicos');
              if (typeof window.showMessage === 'undefined') {
                window.showMessage = function(msg, type) { alert(msg); };
              }
            } else if (src.includes('permissions.js')) {
              console.warn('⚠️ permissions.js não carregou');
            } else if (src.includes('log-helper.js')) {
              console.warn('⚠️ log-helper.js não carregou');
              if (typeof window.logAcao === 'undefined') {
                window.logAcao = function() {}; // Stub vazio
              }
            }
            if (callback) callback(false);
          }
        };
        
        script.onload = function() {
          if (callback) callback(true);
        };
        
        document.body.appendChild(script);
      }
      
      // Carregar scripts sequencialmente
      // Usar cacheVersion dinâmico (timestamp em dev, versão fixa em produção)
      const isDevScripts = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' || 
                           window.location.hostname.startsWith('192.168.');
      const cacheVer = isDevScripts ? Date.now() : '20250102';
      
      const scripts = [
        `/js/ambiente-utils.js?v=${cacheVer}`,
        `/js/utils.js?v=${cacheVer}`,
        `/js/permissions.js?v=${cacheVer}`,
        `/js/log-helper.js?v=${cacheVer}`,
        `/js/dashboard.js?v=${cacheVer}`
      ];
      
      let index = 0;
      let hasErrors = false;
      function loadNext() {
        if (index < scripts.length) {
          loadScript(scripts[index], function(success) {
            if (!success) {
              console.warn('⚠️ Script falhou, mas continuando:', scripts[index]);
              hasErrors = true;
            }
            index++;
            loadNext();
          });
        } else {
          // Todos os scripts foram processados
          // Dashboard.js já inicializa automaticamente quando carrega
        }
      }
      
      loadNext();
    })();
    
    // Tratamento global de erros
    window.addEventListener('error', function(e) {
      console.error('❌ Erro global capturado:', e.error, e.message, e.filename, e.lineno);
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('❌ Promise rejeitada não tratada:', e.reason);
    });
  </script>
</body>
</html>
