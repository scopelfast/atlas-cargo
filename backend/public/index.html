<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Cargo</title>
  <link rel="icon" type="image/png" href="/img/logoAtlasTransparente.png" id="faviconLink">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" crossorigin="anonymous">
  <script>
    // INTERCEPTOR GLOBAL: Remover ? de todas as URLs
    (function() {
      function cleanUrl(url) {
        if (typeof url === 'string') {
          // Remover ? no final da URL e múltiplos ? seguidos
          return url.replace(/\?+$/, '').replace(/\?&/, '&');
        }
        return url;
      }
      
      // Interceptar location.replace
      const originalReplace = window.location.replace;
      window.location.replace = function(url) {
        const cleaned = cleanUrl(url);
        if (cleaned !== url) {
          console.warn('[URL CLEANER] Removendo ? de location.replace:', url, '→', cleaned);
        }
        return originalReplace.call(window.location, cleaned);
      };
      
      // Interceptar location.assign
      const originalAssign = window.location.assign;
      window.location.assign = function(url) {
        const cleaned = cleanUrl(url);
        if (cleaned !== url) {
          console.warn('[URL CLEANER] Removendo ? de location.assign:', url, '→', cleaned);
        }
        return originalAssign.call(window.location, cleaned);
      };
      
      // Função helper para limpar href antes de usar
      window.__cleanLocationHref = function(url) {
        return cleanUrl(url);
      };
      
      // Limpar URL atual se tiver ? no final
      if (window.location.href.endsWith('?')) {
        const cleanUrl = window.location.href.replace(/\?+$/, '');
        console.warn('[URL CLEANER] Limpando URL atual:', window.location.href, '→', cleanUrl);
        originalReplace.call(window.location, cleanUrl);
      }
      
      // Monitorar mudanças na URL usando MutationObserver e popstate
      let lastUrl = window.location.href;
      setInterval(function() {
        const currentUrl = window.location.href;
        if (currentUrl !== lastUrl && currentUrl.endsWith('?')) {
          const cleaned = currentUrl.replace(/\?+$/, '');
          console.warn('[URL CLEANER] Detectado ? na URL, limpando:', currentUrl, '→', cleaned);
          originalReplace.call(window.location, cleaned);
        }
        lastUrl = window.location.href;
      }, 100);
      
      // Interceptar popstate (navegação do histórico)
      window.addEventListener('popstate', function() {
        if (window.location.href.endsWith('?')) {
          const cleaned = window.location.href.replace(/\?+$/, '');
          console.warn('[URL CLEANER] Limpando ? após popstate:', window.location.href, '→', cleaned);
          originalReplace.call(window.location, cleaned);
        }
      });
    })();
    
    // Configuração transparente de protocolo - respeita HTTP ou HTTPS usado
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const isAtlasCargo = hostname.includes('atlas') || 
                           hostname.includes('atlas-cargo') || 
                           hostname.includes('atlascargo');
      
      // CRÍTICO: Usar o protocolo REAL da página SEM REDIRECIONAMENTO
      // Se a página está em HTTP, usar HTTP; se está em HTTPS, usar HTTPS
      // NÃO fazer nenhuma conversão, redirecionamento ou "correção"
      const protocoloAtual = window.location.protocol;
      
      // Usar exatamente o protocolo atual da página, sem nenhuma modificação
      let protocol = protocoloAtual;
      
      const host = window.location.host;
      
      console.log('[INDEX] Construindo baseUrl:', {
        protocoloAtual,
        protocol,
        host,
        isLocal,
        pathname: window.location.pathname
      });
      
      // CRÍTICO: Detectar o caminho base (subdiretório) da aplicação
      // Se a página está em /cargas/, o baseUrl deve incluir /cargas/
      // Se a página está em /, /login ou /index.html → usar raiz para que CSS/img carreguem de /css/, /img/
      let pathBase = window.location.pathname;
      
      // Páginas "raiz" do app: assets devem vir da raiz do servidor (/css/, /img/), não de /login/css/
      const isPaginaRaiz = pathBase === '/' || pathBase === '' || pathBase === '/login' || pathBase === '/index.html' || pathBase.startsWith('/login?');
      if (isPaginaRaiz) {
        pathBase = '/';
      } else if (pathBase.endsWith('.html')) {
        // Se termina com .html, remover o arquivo e manter o diretório (ex: /cargas/index.html → /cargas/)
        const lastSlash = pathBase.lastIndexOf('/');
        if (lastSlash > 0) {
          pathBase = pathBase.substring(0, lastSlash + 1);
        } else {
          pathBase = '/';
        }
      } else if (!pathBase.endsWith('/')) {
        pathBase = pathBase + '/';
      }
      
      // Se pathBase for apenas '/', não adicionar ao baseUrl
      // Se for '/cargas/', incluir no baseUrl
      const baseUrl = protocol + '//' + host + (pathBase === '/' ? '' : pathBase.replace(/\/$/, ''));
      window.__BASE_URL__ = baseUrl;
      
      console.log('[INDEX] Ambiente detectado:', {
        hostname,
        porta: window.location.port || (protocoloAtual === 'https:' ? '443' : '80'),
        protocolo: protocoloAtual,
        pathname: window.location.pathname,
        pathBase: pathBase,
        baseUrl,
        observacao: 'Usando protocolo REAL da página e incluindo caminho base (subdiretório)'
      });
      
      // Função para garantir que URLs usem o mesmo protocolo da página
      // SIMPLES: se a URL tem protocolo diferente do atual, corrigir para o protocolo atual
      function garantirProtocoloConsistente(url) {
        if (!url) return url;
        
        // Se já tem protocolo completo e é diferente do protocolo atual, corrigir
        if (url.startsWith('https://') && protocoloAtual === 'http:') {
          return url.replace(/^https:/, 'http:');
        }
        
        if (url.startsWith('http://') && protocoloAtual === 'https:') {
          return url.replace(/^http:/, 'https:');
        }
        
        return url;
      }
      
      // MutationObserver para interceptar e corrigir URLs automaticamente
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1) { // Element node
              // Corrigir links CSS
              if (node.tagName === 'LINK' && node.rel === 'stylesheet' && node.href) {
                const urlCorrigida = garantirProtocoloConsistente(node.href);
                if (urlCorrigida !== node.href) {
                  node.setAttribute('href', urlCorrigida);
                  console.warn('[INDEX] [Observer] CSS corrigido:', node.href, '→', urlCorrigida);
                }
              }
              // Corrigir scripts
              if (node.tagName === 'SCRIPT' && node.src) {
                const urlCorrigida = garantirProtocoloConsistente(node.src);
                if (urlCorrigida !== node.src) {
                  node.setAttribute('src', urlCorrigida);
                  console.warn('[INDEX] [Observer] Script corrigido:', node.src, '→', urlCorrigida);
                }
              }
              // Corrigir imagens
              if (node.tagName === 'IMG' && node.src) {
                const urlCorrigida = garantirProtocoloConsistente(node.src);
                if (urlCorrigida !== node.src) {
                  node.setAttribute('src', urlCorrigida);
                  console.warn('[INDEX] [Observer] Imagem corrigida:', node.src, '→', urlCorrigida);
                }
              }
            }
          });
        });
      });
      
      // Iniciar observação do DOM quando estiver pronto
      function iniciarObserver() {
        // Verificar se document.head é um Node válido
        if (document.head && document.head.nodeType === 1) {
          try {
            observer.observe(document.head, { childList: true, subtree: true });
            console.log('[INDEX] Observer iniciado para document.head');
          } catch (e) {
            console.warn('[INDEX] Erro ao observar document.head:', e);
          }
        }
        
        // Verificar se document.body é um Node válido
        if (document.body && document.body.nodeType === 1) {
          try {
            observer.observe(document.body, { childList: true, subtree: true });
            console.log('[INDEX] Observer iniciado para document.body');
          } catch (e) {
            console.warn('[INDEX] Erro ao observar document.body:', e);
          }
        } else {
          // Se body ainda não existe, aguardar DOMContentLoaded
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciarObserver);
          } else {
            // DOM já carregado, tentar novamente após um pequeno delay
            setTimeout(iniciarObserver, 100);
          }
        }
      }
      
      // Tentar iniciar apenas quando DOM estiver pronto
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciarObserver);
      } else {
        // DOM já carregado, iniciar após um pequeno delay para garantir
        setTimeout(iniciarObserver, 50);
      }
      
      // Função para carregar CSS com protocolo correto
      function loadCSS(href) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.type = 'text/css';
        let cssUrl;
        
        if (href.startsWith('http')) {
          cssUrl = href; // URL absoluta, usar como está
        } else if (href.startsWith('/')) {
          // Caminho absoluto: /css/style.css → baseUrl + /css/style.css
          // Se baseUrl já inclui /cargas, fica: https://beta...8443/cargas/css/style.css
          cssUrl = baseUrl + href;
          console.log('[INDEX] [loadCSS] baseUrl:', baseUrl, 'href:', href, '→ cssUrl:', cssUrl);
        } else {
          // Caminho relativo: css/style.css → baseUrl + /css/style.css
          cssUrl = baseUrl + '/' + href;
          console.log('[INDEX] [loadCSS] baseUrl:', baseUrl, 'href:', href, '→ cssUrl:', cssUrl);
        }
        
        // Garantir protocolo consistente
        const cssUrlOriginal = cssUrl;
        cssUrl = garantirProtocoloConsistente(cssUrl);
        if (cssUrl !== cssUrlOriginal) {
          console.log('[INDEX] [loadCSS] URL corrigida:', cssUrlOriginal, '→', cssUrl);
        }
        
        console.log('[INDEX] Carregando CSS:', cssUrl, '(protocoloAtual:', protocoloAtual + ')');
        
        // Usar setAttribute para forçar o valor
        link.setAttribute('href', cssUrl);
        
        // Adicionar tratamento de erro
        link.onerror = function() {
          console.error('❌ [INDEX] Erro ao carregar CSS:', link.href);
          // Se falhou, tentar corrigir protocolo novamente
          if (link.href) {
            const urlCorrigida = garantirProtocoloConsistente(link.href);
            if (urlCorrigida !== link.href) {
              console.log('🔄 [INDEX] Tentando carregar CSS com protocolo corrigido:', urlCorrigida);
              link.setAttribute('href', urlCorrigida);
              return;
            }
          }
          // Tentar carregar novamente após um delay
          setTimeout(() => {
            console.log('🔄 [INDEX] Tentando carregar CSS novamente:', link.href);
            const newLink = document.createElement('link');
            newLink.rel = 'stylesheet';
            newLink.type = 'text/css';
            let retryUrl = link.href || cssUrl;
            retryUrl = garantirProtocoloConsistente(retryUrl);
            newLink.setAttribute('href', retryUrl + (retryUrl.includes('?') ? '&' : '?') + 'retry=' + Date.now());
            document.head.appendChild(newLink);
          }, 1000);
        };
        
        link.onload = function() {
          console.log('✅ [INDEX] CSS carregado:', link.href);
        };
        
        document.head.appendChild(link);
      }
      
      // Carregar CSS com protocolo correto
      loadCSS('/css/boxicons.min.css');
      loadCSS('/css/style.css');
      loadCSS('/css/login-adminlte.css');
      loadCSS('/css/dark-mode.css');
      
      // Monitorar continuamente e corrigir URLs
      setInterval(function() {
        // Corrigir todos os links CSS
        document.querySelectorAll('link[rel="stylesheet"]').forEach(function(link) {
          if (link.href) {
            const urlCorrigida = garantirProtocoloConsistente(link.href);
            if (urlCorrigida !== link.href) {
              link.setAttribute('href', urlCorrigida);
            }
          }
        });
        
        // Corrigir todos os scripts
        document.querySelectorAll('script[src]').forEach(function(script) {
          if (script.src) {
            const urlCorrigida = garantirProtocoloConsistente(script.src);
            if (urlCorrigida !== script.src) {
              script.setAttribute('src', urlCorrigida);
            }
          }
        });
        
        // Corrigir todas as imagens
        document.querySelectorAll('img[src]').forEach(function(img) {
          if (img.src) {
            const urlCorrigida = garantirProtocoloConsistente(img.src);
            if (urlCorrigida !== img.src) {
              img.setAttribute('src', urlCorrigida);
            }
          }
        });
      }, 500); // Verificar a cada 500ms
      
      // Garantir protocolo consistente em imagens após DOM carregar
      document.addEventListener('DOMContentLoaded', function() {
        const images = document.querySelectorAll('img[src]');
        images.forEach(function(img) {
          if (img.src) {
            const urlCorrigida = garantirProtocoloConsistente(img.src);
            if (urlCorrigida !== img.src) {
              img.setAttribute('src', urlCorrigida);
              console.log('[INDEX] Imagem corrigida:', img.src, '→', urlCorrigida);
            } else if (img.src.startsWith('/')) {
              const urlCompleta = baseUrl + img.src;
              img.setAttribute('src', urlCompleta);
              console.log('[INDEX] Imagem com URL completa:', urlCompleta);
            }
          }
        });
      });
    })();
  </script>

  <script>
    // Garantir que scripts sejam carregados com protocolo correto
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || 
                      hostname === '127.0.0.1' || 
                      hostname.startsWith('192.168.');
      const isAtlasCargo = hostname.includes('atlas') || 
                            hostname.includes('atlas-cargo') || 
                            hostname.includes('atlascargo');
      const protocoloAtual = window.location.protocol;
      
      // Usar exatamente o protocolo atual da página, SEM modificações
      let protocol = protocoloAtual;
      
      // CRÍTICO: Detectar o caminho base (subdiretório) da aplicação
      let pathBase = window.location.pathname;
      if (pathBase.endsWith('.html')) {
        const lastSlash = pathBase.lastIndexOf('/');
        if (lastSlash > 0) {
          pathBase = pathBase.substring(0, lastSlash + 1);
        } else {
          pathBase = '/';
        }
      } else if (!pathBase.endsWith('/')) {
        pathBase = pathBase + '/';
      }
      
      const baseUrl = protocol + '//' + window.location.host + (pathBase === '/' ? '' : pathBase.replace(/\/$/, ''));
      
      // Função para garantir protocolo consistente
      // SIMPLES: se a URL tem protocolo diferente do atual, corrigir para o protocolo atual
      function garantirProtocoloConsistente(url) {
        if (!url) return url;
        
        // Se já tem protocolo completo e é diferente do protocolo atual, corrigir
        if (url.startsWith('https://') && protocoloAtual === 'http:') {
          return url.replace(/^https:/, 'http:');
        }
        
        if (url.startsWith('http://') && protocoloAtual === 'https:') {
          return url.replace(/^http:/, 'https:');
        }
        
        return url;
      }
      
      function loadScript(src) {
        const script = document.createElement('script');
        let url;

        if (src.startsWith('http')) {
          url = src; // URL absoluta, usar como está
        } else if (src.startsWith('/')) {
          // Caminho absoluto: /js/login.js → baseUrl + /js/login.js
          url = baseUrl + src;
        } else {
          // Caminho relativo: js/login.js → baseUrl + /js/login.js
          url = baseUrl + '/' + src;
        }
        
        // Garantir protocolo consistente (verificar se função existe)
        if (typeof garantirProtocoloConsistente === 'function') {
          url = garantirProtocoloConsistente(url);
        } else {
          console.warn('[INDEX] garantirProtocoloConsistente não está definida, usando URL original');
        }
        
        console.log('[INDEX] Carregando script:', url);
        
        // Usar setAttribute para forçar o valor
        script.setAttribute('src', url);
        script.async = false;
        
        // Adicionar tratamento de erro
        script.onerror = function() {
          console.error('❌ [INDEX] Erro ao carregar script:', script.src);
          // Se falhou, tentar corrigir protocolo novamente
          if (script.src && typeof garantirProtocoloConsistente === 'function') {
            const urlCorrigida = garantirProtocoloConsistente(script.src);
            if (urlCorrigida !== script.src) {
              console.log('🔄 [INDEX] Tentando carregar script com protocolo corrigido:', urlCorrigida);
              script.setAttribute('src', urlCorrigida);
              return;
            }
          }
          // Tentar carregar novamente após um delay
          setTimeout(() => {
            console.log('🔄 [INDEX] Tentando carregar script novamente:', script.src);
            const retryScript = document.createElement('script');
            let retryUrl = script.src || url;
            if (typeof garantirProtocoloConsistente === 'function') {
              retryUrl = garantirProtocoloConsistente(retryUrl);
            }
            retryScript.setAttribute('src', retryUrl + (retryUrl.includes('?') ? '&' : '?') + 'retry=' + Date.now());
            retryScript.async = false;
            document.body.appendChild(retryScript);
          }, 1000);
        };
        
        script.onload = function() {
          console.log('✅ [INDEX] Script carregado:', url);
        };
        
        document.body.appendChild(script);
      }
      
      // Carregar scripts com protocolo correto (i18n-web antes do login para aplicar idioma)
      loadScript('/js/redirect.js');
      loadScript('/js/log-helper.js');
      loadScript('/js/i18n-web.js');
      loadScript('/js/login.js');
      
      // Aplicar logos (identidade visual): tenta carregar config, senão usa padrões
      var logoCacheBust = '?v=2'; // incremente quando trocar a imagem da logo
      function aplicarLogos(logoRetangular, logoQuadrada) {
        if (typeof garantirProtocoloConsistente !== 'function') return;
        const q = (logoQuadrada || 'logoAtlasTransparenteQuadrada.png').replace(/[^a-zA-Z0-9._-]/g, '');
        const logoImg = document.getElementById('logoImg');
        if (logoImg) {
          const urlCompleta = baseUrl + '/img/' + q + logoCacheBust;
          logoImg.setAttribute('src', garantirProtocoloConsistente(urlCompleta));
        }
        const faviconLink = document.getElementById('faviconLink');
        if (faviconLink) {
          faviconLink.setAttribute('href', garantirProtocoloConsistente(baseUrl + '/img/' + q + logoCacheBust));
        }
      }
      function corrigirRecursos() {
        if (typeof garantirProtocoloConsistente !== 'function') {
          setTimeout(corrigirRecursos, 100);
          return;
        }
        fetch(baseUrl + '/api/configuracoes/identidade')
          .then(function(res) { return res.ok ? res.json() : Promise.reject(); })
          .then(function(data) {
            aplicarLogos(data.logoRetangular, data.logoQuadrada);
          })
          .catch(function() {
            aplicarLogos('logoAtlasTransparente.png', 'logoAtlasTransparenteQuadrada.png');
          });
      }
      
      // Corrigir recursos quando DOM estiver pronto
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', corrigirRecursos);
      } else {
        corrigirRecursos();
      }
      
      // Também corrigir após um pequeno delay
      setTimeout(corrigirRecursos, 500);

      // Seletor de idioma no login web (mesma chave preferredLocale do app motorista)
      function getPreferredLocaleWeb() {
        try { return localStorage.getItem('preferredLocale') || ''; } catch (e) { return ''; }
      }
      function setPreferredLocaleWeb(loc) {
        try { localStorage.setItem('preferredLocale', loc || ''); } catch (e) {}
        window.location.reload();
      }
      function initIdiomaSelectorWeb() {
        var current = getPreferredLocaleWeb();
        if (current !== 'pt-BR' && current !== 'es-PY') current = 'pt-BR';
        document.querySelectorAll('.idioma-selector-web .btn-idioma').forEach(function(btn) {
          var loc = btn.getAttribute('data-locale');
          btn.setAttribute('aria-pressed', loc === current ? 'true' : 'false');
          btn.classList.toggle('active', loc === current);
          btn.onclick = function() { setPreferredLocaleWeb(loc); };
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initIdiomaSelectorWeb);
      } else {
        initIdiomaSelectorWeb();
      }
      // Aplicar traduções do painel web quando o locale estiver pronto
      if (window.i18nWebReady) {
        window.i18nWebReady.then(function() {
          if (typeof window.applyI18nWeb === 'function') window.applyI18nWeb();
        });
      }

      // Modo escuro na tela de login (mesma chave 'theme' do dashboard)
      (function() {
        var KEY = 'theme';
        var root = document.documentElement;
        var btn = document.getElementById('themeToggleBtn');
        var icon = document.getElementById('themeToggleIcon');
        function getTheme() { try { return localStorage.getItem(KEY) || 'light'; } catch (e) { return 'light'; } }
        function setTheme(theme) {
          if (theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            if (icon) { icon.className = 'bx bx-sun'; }
            if (btn) btn.setAttribute('title', 'Ativar modo claro');
          } else {
            root.removeAttribute('data-theme');
            if (icon) { icon.className = 'bx bx-moon'; }
            if (btn) btn.setAttribute('title', 'Alternar modo escuro');
          }
          try { localStorage.setItem(KEY, theme); } catch (e) {}
        }
        setTheme(getTheme());
        if (btn) {
          btn.addEventListener('click', function() {
            setTheme(getTheme() === 'dark' ? 'light' : 'dark');
          });
        }
      })();
    })();
  </script>
</body>
</html>
